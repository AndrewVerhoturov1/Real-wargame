<!DOCTYPE html>

<title>Полигон · действия и логика программы v8.2</title>

<body>
<p id="polygon-loader-status" style="font:14px system-ui;padding:20px">Загрузка прототипа…</p>
<script>window.__polygonPayloadChunks=[];</script>
<script src="payload/part-01.js"></script>
<script src="payload/part-02.js"></script>
<script src="payload/part-03.js"></script>
<script src="payload/part-04.js"></script>
<script src="payload/part-05.js"></script>
<script src="payload/part-06.js"></script>
<script src="payload/part-07.js"></script>
<script src="payload/part-08.js"></script>
<script src="payload/part-09.js"></script>
<script>
(async()=>{
  const encoded=window.__polygonPayloadChunks.join('');
  const compressed=Uint8Array.from(atob(encoded),character=>character.charCodeAt(0));
  const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).text();
  document.open();
  document.write(html);
  document.close();
})().catch(error=>{
  document.body.innerHTML='<pre style="white-space:pre-wrap;font:14px monospace;padding:20px;color:#8b1e1e">Не удалось открыть прототип: '+String(error)+'</pre>';
  console.error(error);
});
</script>
</body>
</html>
