<script>
(async()=>{
 const status=document.getElementById('status');
 try{
  const chunks=window.__POLYGON_V44_PAYLOAD||[];
  if(chunks.length!==23||chunks.some(x=>typeof x!=='string')) throw new Error('Не все части payload загружены');
  const b64=chunks.join('');
  const raw=atob(b64);
  const gz=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)gz[i]=raw.charCodeAt(i);
  const stream=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  const html=await new Response(stream).blob();
  const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
  location.replace(url);
 }catch(error){status.className='err';status.textContent='Не удалось открыть v44: '+error.message;console.error(error);}
})();
</script>
