<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Полигон — прототип интерфейса</title>
</head>
<body>
  <header class="topbar" aria-label="Глобальная панель полигона">
    <div class="topbar__left">
      <div class="brand" aria-label="Полигон">
        <span class="brand__mark">П</span>
        <span class="brand__text">ПОЛИГОН</span>
      </div>
      <div class="run-controls">
        <button class="top-button top-button--primary" id="runButton" type="button">ЗАПУСК</button>
        <button class="top-button" id="resetButton" type="button">СБРОС</button>
        <label class="select-wrap" title="Скорость симуляции">
          <span>СКОРОСТЬ</span>
          <select id="speedSelect" aria-label="Скорость симуляции">
            <option value="0.1">×0.1</option>
            <option value="0.25">×0.25</option>
            <option value="0.5" selected>×0.5</option>
            <option value="1">×1</option>
            <option value="2">×2</option>
            <option value="5">×5</option>
            <option value="10">×10</option>
          </select>
        </label>
        <div class="transport-controls" aria-label="Управление воспроизведением">
          <button class="icon-button" id="playButton" type="button" title="Продолжить" aria-label="Продолжить">▶</button>
          <button class="icon-button" id="pauseButton" type="button" title="Пауза" aria-label="Пауза">Ⅱ</button>
        </div>
        <div class="top-status" id="topStatus" data-state="idle" aria-live="polite">
          <span class="status-dot"></span>
          <span id="timerText">00:00.0</span>
        </div>
      </div>
    </div>

    <nav class="topbar__center" aria-label="Работа с экспериментом">
      <button class="top-button" id="fileButton" type="button">ФАЙЛ</button>
      <button class="top-button" id="editorsButton" type="button">РЕДАКТОРЫ</button>
    </nav>

    <div class="topbar__right">
      <div class="dropdown-anchor">
        <button class="top-button" id="viewButton" type="button" aria-expanded="false">ВИД ▾</button>
        <div class="dropdown" id="viewDropdown" role="menu" aria-label="Визуальные слои карты">
          <div class="dropdown__title">Слои карты</div>
          <label class="dropdown__item"><input type="checkbox" data-layer="grid" checked> Сетка</label>
          <label class="dropdown__item"><input type="checkbox" data-layer="labels" checked> Подписи юнитов</label>
          <label class="dropdown__item"><input type="checkbox" data-layer="routes" checked> Маршруты</label>
          <label class="dropdown__item"><input type="checkbox" data-layer="cover"> Слой укрытий</label>
        </div>
      </div>
      <button class="top-button" id="languageButton" type="button">EN</button>
      <div class="dropdown-anchor">
        <button class="top-button" id="menuButton" type="button" aria-expanded="false">МЕНЮ</button>
        <div class="dropdown" id="menuDropdown" role="menu">
          <button class="dropdown__item" type="button" data-menu-action="reset-layout">Сбросить расположение панелей</button>
          <div class="dropdown__separator"></div>
          <button class="dropdown__item dropdown__item--disabled" type="button" disabled>Остальные пункты не определены</button>
        </div>
      </div>
    </div>
  </header>

  <main class="map-viewport" id="mapViewport">
    <div class="map-surface" id="mapSurface" aria-label="Карта полигона" tabindex="0">
      <div class="terrain-road"></div>
      <div class="terrain-stream"></div>
      <div class="forest-patch forest-patch--a"></div>
      <div class="forest-patch forest-patch--b"></div>
      <div class="house house--a"></div>
      <div class="house house--b"></div>
      <div class="house house--c"></div>

      <svg class="map-route" viewBox="0 0 1440 842" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 440 540 C 580 480, 710 470, 860 404 S 1050 320, 1160 280"></path>
        <circle cx="440" cy="540" r="7"></circle>
        <circle cx="860" cy="404" r="7"></circle>
        <circle cx="1160" cy="280" r="7"></circle>
      </svg>

      <div class="map-caption">
        <strong id="experimentCaption">Новый эксперимент</strong>
        <span class="map-caption__sep"></span>
        <span id="workspaceCaption">Режим: Программа</span>
      </div>

      <div id="unitLayer"></div>
      <div id="markerLayer"></div>
    </div>

    <section class="side-panel side-panel--left" id="leftPanel" aria-label="Палитра инструментов">
      <div class="panel-head">
        <div class="panel-head__text">
          <div class="panel-kicker">Рабочий режим</div>
          <div class="panel-title" id="leftPanelTitle">Программа</div>
        </div>
        <button class="panel-collapse" id="collapseLeft" type="button" aria-label="Скрыть левую панель">‹</button>
      </div>
      <nav class="panel-nav" id="workspaceTabs" aria-label="Разделы полигона">
        <button class="tab-button is-active" type="button" data-workspace="program">Программа</button>
        <button class="tab-button" type="button" data-workspace="map-editor">Редактор карты</button>
        <button class="tab-button" type="button" data-workspace="unit-editor">Редактор юнита</button>
        <button class="tab-button" type="button" data-workspace="series">Серия</button>
        <button class="tab-button" type="button" data-workspace="metrics">Метрики</button>
        <button class="tab-button" type="button" data-workspace="journal">Журнал</button>
      </nav>
      <div class="panel-content" id="leftPanelContent"></div>
      <div class="collapsed-label">Палитра инструментов</div>
      <div class="resizer" id="leftResizer" aria-hidden="true"></div>
    </section>

    <section class="side-panel side-panel--right" id="rightPanel" aria-label="Информация о выбранном юните">
      <div class="panel-head">
        <button class="panel-collapse" id="collapseRight" type="button" aria-label="Скрыть правую панель">›</button>
        <div class="panel-head__text">
          <div class="panel-kicker">Выбранный объект</div>
          <div class="panel-title" id="rightPanelTitle">Юнит не выбран</div>
        </div>
      </div>
      <nav class="panel-nav" id="inspectorTabs" aria-label="Информация о юните">
        <button class="tab-button is-active" type="button" data-inspector="info">Инфо</button>
        <button class="tab-button" type="button" data-inspector="overview">Обзор</button>
        <button class="tab-button" type="button" data-inspector="memory">Память</button>
        <button class="tab-button" type="button" data-inspector="danger">Опасность</button>
        <button class="tab-button" type="button" data-inspector="stealth">Скрытность</button>
        <button class="tab-button" type="button" data-inspector="positions">Позиции</button>
        <button class="tab-button" type="button" data-inspector="weapon">Оружие</button>
      </nav>
      <div class="panel-content" id="rightPanelContent"></div>
      <div class="collapsed-label">Информация о юните</div>
      <div class="resizer" id="rightResizer" aria-hidden="true"></div>
    </section>

    <div class="active-action" id="activeAction" aria-live="polite">
      <span id="activeActionText"></span>
      <button type="button" id="cancelAction">Отменить</button>
    </div>
  </main>

  <div class="context-menu" id="contextMenu" role="menu"></div>

  <div class="modal-backdrop" id="modalBackdrop" role="presentation">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
  </div>

  <input type="file" id="jsonFileInput" accept="application/json,.json" hidden>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <div class="self-test-result" id="selfTestResult" data-status="not-run">NOT RUN</div>

  <script src="style-part-01.js"></script>
  <script src="style-part-02.js"></script>
  <script src="style-part-03.js"></script>
  <script src="unit-editor-v2-style.js"></script>
  <script src="prototype-part-01.js"></script>
  <script src="prototype-part-02.js"></script>
  <script src="prototype-part-03.js"></script>
  <script src="prototype-part-04.js"></script>
  <script src="prototype-part-05.js"></script>
  <script src="unit-editor-v2-part-01.js"></script>
  <script src="unit-editor-v2-part-02.js"></script>
  <script src="unit-editor-v2-part-03.js"></script>
  <script src="unit-editor-v2-part-04.js"></script>
  <script src="unit-editor-v2-part-05.js"></script>
  <script src="unit-editor-v2-part-06.js"></script>
  <script src="unit-editor-v2-part-07.js"></script>
  <script src="unit-editor-v2-part-08.js"></script>
  <script src="bootstrap.js"></script>
</body>
</html>
