name: Combat Lab Live State Verification

on:
  pull_request:
    branches:
      - ci/combat-lab-live-state-red-base-20260728
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Full Preview verification gate
        run: npm run verify:preview -- --report combat-lab-live-state-verification.json
      - name: Production build
        run: npm run build:app
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-live-state-verification
          path: combat-lab-live-state-verification.json
          if-no-files-found: warn
