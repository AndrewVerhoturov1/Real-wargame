name: Temporary Wave 1 AI Editor Overflow Diagnostic

on:
  push:
    branches:
      - compiler/20260801-shared-game-editors-wave1

permissions:
  contents: write

jobs:
  overflow-diagnostic:
    if: contains(github.event.head_commit.message, '[overflow-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: |
          npm install --no-save --package-lock=false playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Start preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/wave1-vite-preview.log 2>&1 &
          echo $! > /tmp/wave1-vite-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ai-node-editor.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wave1-vite-preview.log
          exit 1
      - name: Capture overflow elements
        shell: bash
        run: |
          cat > /tmp/overflow-diagnostic.mjs <<'EOF'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({ headless: true });
          try {
            const context = await browser.newContext({ viewport: { width: 1100, height: 760 } });
            const page = await context.newPage();
            await page.goto('http://127.0.0.1:4173/ai-node-editor.html', { waitUntil: 'networkidle' });
            const diagnostic = await page.evaluate(() => {
              const viewportWidth = document.documentElement.clientWidth;
              const describe = (element) => {
                const rect = element.getBoundingClientRect();
                const style = getComputedStyle(element);
                return {
                  tag: element.tagName.toLowerCase(),
                  id: element.id,
                  className: typeof element.className === 'string' ? element.className : '',
                  rect: {
                    left: Math.round(rect.left * 100) / 100,
                    right: Math.round(rect.right * 100) / 100,
                    width: Math.round(rect.width * 100) / 100,
                  },
                  clientWidth: element.clientWidth,
                  scrollWidth: element.scrollWidth,
                  display: style.display,
                  position: style.position,
                  width: style.width,
                  minWidth: style.minWidth,
                  maxWidth: style.maxWidth,
                  overflowX: style.overflowX,
                  whiteSpace: style.whiteSpace,
                  flexShrink: style.flexShrink,
                  gridTemplateColumns: style.gridTemplateColumns,
                };
              };
              const elements = [...document.querySelectorAll('*')];
              const outside = elements
                .filter((element) => {
                  const rect = element.getBoundingClientRect();
                  return rect.right > viewportWidth + 0.5 || rect.left < -0.5;
                })
                .map(describe)
                .sort((a, b) => b.rect.right - a.rect.right)
                .slice(0, 80);
              const internallyWide = elements
                .filter((element) => element.scrollWidth > element.clientWidth + 1)
                .map(describe)
                .sort((a, b) => (b.scrollWidth - b.clientWidth) - (a.scrollWidth - a.clientWidth))
                .slice(0, 40);
              return {
                windowInnerWidth: window.innerWidth,
                documentClientWidth: document.documentElement.clientWidth,
                documentScrollWidth: document.documentElement.scrollWidth,
                bodyClientWidth: document.body.clientWidth,
                bodyScrollWidth: document.body.scrollWidth,
                bodyClasses: document.body.className,
                outside,
                internallyWide,
              };
            });
            console.log(JSON.stringify(diagnostic, null, 2));
            await context.close();
          } finally {
            await browser.close();
          }
          EOF
          node /tmp/overflow-diagnostic.mjs > .tmp-wave1-overflow-diagnostic 2>&1
          cat .tmp-wave1-overflow-diagnostic
          if [ -f /tmp/wave1-vite-preview.pid ]; then kill "$(cat /tmp/wave1-vite-preview.pid)" || true; fi
          git config user.name "wave1-compiler-bot"
          git config user.email "wave1-compiler-bot@users.noreply.github.com"
          git add .tmp-wave1-overflow-diagnostic
          git commit -m "chore(wave1): record AI editor overflow diagnostic"
          git push origin HEAD:compiler/20260801-shared-game-editors-wave1
