name: Polygon deployed visual audit 20260817

on:
  pull_request:
    branches:
      - ci/polygon-visual-audit-base-20260817t0723z-57e5531

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://repo-poz6mqsct-111s-projects-807221af.vercel.app/combat-lab.html
      EXPECTED_PRODUCT_SHA: 57e553121affa8a78f78f94d87bc0d122188bc09
      CANONICAL_FEATURE_BRANCH: feature/20260817-polygon-six-x-integration
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture deployed Polygon visual states
        run: npx playwright test --config=ci/playwright.polygon-visual-audit.config.ts

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polygon-visual-audit-${{ github.run_id }}
          path: |
            artifacts/vercel-e2e/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
