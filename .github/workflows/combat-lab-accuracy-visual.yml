name: Combat Lab Accuracy Visual QA

on:
  pull_request:
    branches:
      - ci/combat-lab-accuracy-visual-base-20260728t104500z-7a1fc38

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_PRODUCT_SHA: 7a1fc3802efa7193870cdf72e7a347a00571daca
    steps:
      - name: Checkout CI head
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Run Combat Lab visual scenario
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --config=ci/playwright.combat-lab-accuracy-visual.config.ts 2>&1 | tee combat-lab-accuracy-visual.log

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-accuracy-visual-evidence-${{ github.run_id }}
          path: |
            artifacts/combat-lab-accuracy-visual/**
            test-results/combat-lab-accuracy-visual/**
            playwright-report/combat-lab-accuracy-visual/**
            combat-lab-accuracy-visual.log
          if-no-files-found: warn
          retention-days: 14
