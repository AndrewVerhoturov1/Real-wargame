name: Combat Lab Camera Aim Red Green

on:
  pull_request:
    branches:
      - ci/combat-lab-camera-aim-tdd-base-20260727
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout corrected product head
        uses: actions/checkout@v4
        with:
          ref: 8cbad1df40eeb2699d9c2cf97866dabdacb89666
          fetch-depth: 0
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Capture Stage 5 aim verification
        id: stage5
        shell: bash
        run: |
          set +e
          npm run infantry-combat-stage5:verify > "$RUNNER_TEMP/stage5-preparation.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/stage5-preparation.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Stage 5 verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infantry-combat-stage5-preparation-log
          path: ${{ runner.temp }}/stage5-preparation.log
      - name: Require Stage 5 aim verification success
        run: test "${{ steps.stage5.outputs.status }}" -eq 0
