name: Combat Lab Camera Aim Red Green

on:
  pull_request:
    branches:
      - ci/combat-lab-camera-aim-tdd-base-20260727
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout regression-test commit before correction
        uses: actions/checkout@v4
        with:
          ref: c9bdb8dd783a8bc045c2e7054763ffad8b77d89c
          fetch-depth: 0
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies for red proof
        run: npm ci --no-audit --no-fund
      - name: Prove regression test fails before correction
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/combat_lab_camera_aim_regression_smoke.mjs > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/red.log"
          test "$status" -ne 0
          grep -Eq "Combat Lab must not move|must not fire before the weapon direction" "$RUNNER_TEMP/red.log"
      - name: Checkout corrected product head
        uses: actions/checkout@v4
        with:
          ref: 22fb9ace521584443f4ecc388be80eb021d0d3fb
          clean: true
          fetch-depth: 0
      - name: Install exact dependencies for green proof
        run: npm ci --no-audit --no-fund
      - name: Run focused camera and aim regression
        run: node scripts/combat_lab_camera_aim_regression_smoke.mjs
      - name: Run Stage 5 aim verification
        run: npm run infantry-combat-stage5:verify
      - name: Run Combat Lab workspace contract
        run: node scripts/combat_lab_workspace_layout_smoke.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
