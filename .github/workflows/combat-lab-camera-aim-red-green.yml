name: Combat Lab Camera Aim Red Green

on:
  pull_request:
    branches:
      - ci/combat-lab-camera-aim-tdd-base-20260727
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout corrected product head
        uses: actions/checkout@v4
        with:
          ref: 8cbad1df40eeb2699d9c2cf97866dabdacb89666
          fetch-depth: 0
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Run camera and aim regression
        run: node scripts/combat_lab_camera_aim_regression_smoke.mjs
      - name: Run Stage 5 aim verification
        run: npm run infantry-combat-stage5:verify
      - name: Run Combat Lab workspace contract
        run: node scripts/combat_lab_workspace_layout_smoke.mjs
      - name: TypeScript
        run: npm run typecheck
      - name: Production build
        run: npm run build
