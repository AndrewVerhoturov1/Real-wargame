name: Combat Lab Camera Aim Red Green

on:
  pull_request:
    branches:
      - ci/combat-lab-camera-aim-tdd-base-20260727
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Checkout corrected product head
        uses: actions/checkout@v4
        with:
          ref: 8cbad1df40eeb2699d9c2cf97866dabdacb89666
          fetch-depth: 0
      - name: Install current dependencies
        run: npm ci --no-audit --no-fund
      - name: Measure current projectile benchmark
        id: current
        shell: bash
        run: |
          set +e
          npm run infantry-combat-projectile:benchmark > "$RUNNER_TEMP/current-projectile.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/current-projectile.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Checkout mandatory Stage 5 base
        uses: actions/checkout@v4
        with:
          ref: 6e719225d8da711fbf2d1963baa43bcd03c7dbdf
          clean: true
          fetch-depth: 0
      - name: Install base dependencies
        run: npm ci --no-audit --no-fund
      - name: Measure base projectile benchmark
        id: base
        shell: bash
        run: |
          set +e
          npm run infantry-combat-projectile:benchmark > "$RUNNER_TEMP/base-projectile.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/base-projectile.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload benchmark comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projectile-benchmark-current-vs-base
          path: |
            ${{ runner.temp }}/current-projectile.log
            ${{ runner.temp }}/base-projectile.log
      - name: Record comparison statuses
        run: |
          echo "current=${{ steps.current.outputs.status }}"
          echo "base=${{ steps.base.outputs.status }}"
