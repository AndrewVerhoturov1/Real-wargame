name: Combat Lab Camera Aim Red Green

on:
  pull_request:
    branches:
      - ci/combat-lab-camera-aim-tdd-base-20260727
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout corrected product head
        uses: actions/checkout@v4
        with:
          ref: 527f370a2ba64aabaff51ea853e05c6a03939951
          fetch-depth: 0
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Capture focused camera and aim regression
        id: focused
        shell: bash
        run: |
          set +e
          node scripts/combat_lab_camera_aim_regression_smoke.mjs > "$RUNNER_TEMP/focused.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/focused.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload focused regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-forward-aim-diagnostic
          path: ${{ runner.temp }}/focused.log
      - name: Require focused regression success
        run: test "${{ steps.focused.outputs.status }}" -eq 0
