name: Combat Lab Dual Sidebars QA

on:
  pull_request:
    branches:
      - ci/combat-lab-dual-sidebars-base-20260727t0411z-9e2f645
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCT_SHA: 9e2f64567dc3f66ce765c58edf7c6ddd2d340c27
      PRODUCT_BRANCH: feature/20260726-shooting-stage-09v-combat-lab
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Prove exact feature source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          branch_sha="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual_sha" = "$PRODUCT_SHA"
          test "$branch_sha" = "$PRODUCT_SHA"
          test -z "$(git status --short)"
          echo "Verified product source: $PRODUCT_BRANCH @ $PRODUCT_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical Preview gate
        run: npm run verify:preview -- --report "$RUNNER_TEMP/preview-verification.json"

      - name: Build production dist
        run: npm run build

      - name: Install Chromium tooling
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Chromium QA at 1440x900
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/combat-lab-dual-sidebars
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/combat-lab.html > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/combat-lab.html > /dev/null
          cat > .combat-lab-dual-sidebars-qa.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const out = 'artifacts/combat-lab-dual-sidebars';
          fs.mkdirSync(out, { recursive: true });
          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--ignore-gpu-blocklist'],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(`pageerror: ${error.message}`));
          page.on('console', (message) => {
            if (message.type() === 'error') pageErrors.push(`console: ${message.text()}`);
          });

          function check(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function snapshot(name) {
            const geometry = await page.evaluate(() => {
              const rect = (selector) => {
                const element = document.querySelector(selector);
                if (!(element instanceof HTMLElement)) return null;
                const box = element.getBoundingClientRect();
                return { left: box.left, right: box.right, top: box.top, bottom: box.bottom, width: box.width, height: box.height };
              };
              return {
                viewport: { width: window.innerWidth, height: window.innerHeight },
                body: { scrollWidth: document.documentElement.scrollWidth, clientWidth: document.documentElement.clientWidth },
                bodyClasses: document.body.className,
                left: rect('#combat-lab-extension-root'),
                app: rect('#app'),
                right: rect('.simulation-sidebar'),
                bottom: rect('.simulation-unit-bar'),
                canvasCount: document.querySelectorAll('#app canvas').length,
                rightInsideLeft: Boolean(document.querySelector('#combat-lab-extension-root .simulation-sidebar')),
                fighterTab: Boolean(document.querySelector('[data-combat-lab-tab="fighter"]')),
              };
            });
            check(geometry.body.scrollWidth <= geometry.body.clientWidth, `${name}: horizontal overflow ${geometry.body.scrollWidth}/${geometry.body.clientWidth}`);
            check(geometry.canvasCount === 1, `${name}: expected one game canvas, got ${geometry.canvasCount}`);
            check(!geometry.rightInsideLeft, `${name}: standard right inspector was moved into Combat Lab`);
            check(!geometry.fighterTab, `${name}: obsolete Fighter tab remains`);
            if (geometry.left && geometry.app && geometry.bodyClasses.includes('combat-lab-dock-open')) {
              check(geometry.app.left + 1 >= geometry.left.right, `${name}: map overlaps open left dock`);
            }
            if (geometry.left && geometry.bottom && geometry.bodyClasses.includes('combat-lab-dock-open')) {
              check(geometry.bottom.left + 1 >= geometry.left.right, `${name}: lower panel overlaps open left dock`);
            }
            if (geometry.right && geometry.app && geometry.bodyClasses.includes('sidebar-open')) {
              check(geometry.app.right <= geometry.right.left + 1, `${name}: map overlaps open right inspector`);
            }
            if (geometry.right && geometry.bottom && geometry.bodyClasses.includes('sidebar-open')) {
              check(geometry.bottom.right <= geometry.right.left + 1, `${name}: lower panel overlaps open right inspector`);
            }
            await page.screenshot({ path: `${out}/${name}.png`, fullPage: false });
            return geometry;
          }

          await page.goto('http://127.0.0.1:4173/combat-lab.html', { waitUntil: 'networkidle' });
          await page.waitForSelector('#combat-lab-extension-root[data-combat-lab-extension="active"]');
          await page.waitForSelector('#app canvas');
          await page.waitForSelector('.simulation-sidebar');
          check(await page.locator('.simulation-sidebar [data-tab]').count() >= 5, 'Standard game inspector tabs are missing');

          for (const selector of [
            '.simulation-controls [data-action="fire-contact"]',
            '.simulation-controls [data-action="toggle-fire-permission"]',
          ]) {
            const control = page.locator(selector);
            check(await control.count() === 1, `Missing legacy shooting control ${selector}`);
            check(!(await control.isVisible()), `Legacy shooting control remains visible: ${selector}`);
            check(await control.isDisabled(), `Legacy shooting control remains enabled: ${selector}`);
          }

          const lowerPause = page.locator('.simulation-controls [data-action="pause"]');
          const labPause = page.locator('.combat-lab-run-controls button').filter({ hasText: /^(Пауза|Продолжить)$/ }).first();
          check(await lowerPause.count() === 1 && await labPause.count() === 1, 'Shared pause controls are missing');
          await lowerPause.click();
          await page.waitForTimeout(150);
          check((await lowerPause.textContent()) === (await labPause.textContent()), 'Game and laboratory pause controls diverged');
          await page.locator('.unit-bar-speed-group [data-speed="2"]').click();
          const labSpeed = page.locator('.combat-lab-run-controls label').filter({ hasText: 'Скорость' }).locator('select');
          check(await labSpeed.inputValue() === '2', 'Game and laboratory speed controls diverged');

          await snapshot('01-stand-both-open');
          await page.locator('[data-combat-lab-tab="metrics"]').click();
          await snapshot('02-metrics-both-open');
          await page.locator('[data-combat-lab-tab="log"]').click();
          await snapshot('03-log-both-open');
          await page.locator('[data-combat-lab-tab="stand"]').click();

          const leftToggle = page.locator('.combat-lab-dock-toggle');
          const rightToggle = page.locator('.simulation-sidebar [data-action="collapse"]');
          await leftToggle.click();
          await page.waitForTimeout(200);
          await snapshot('04-left-collapsed-right-open');
          await leftToggle.click();
          await rightToggle.click();
          await page.waitForTimeout(200);
          await snapshot('05-left-open-right-collapsed');
          await leftToggle.click();
          await page.waitForTimeout(200);
          await snapshot('06-both-collapsed');

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle' });
          await page.waitForSelector('#app canvas');
          const gamePopupState = await page.evaluate(() => {
            const lowerDetails = document.querySelector('.unit-bar-route-controls > .unit-route-details');
            const statePlan = document.querySelector('.unit-state-plan > summary');
            return {
              lowerDetailsDisplay: lowerDetails instanceof HTMLElement ? getComputedStyle(lowerDetails).display : 'absent',
              statePlanPointerEvents: statePlan instanceof HTMLElement ? getComputedStyle(statePlan).pointerEvents : 'absent',
              canvasCount: document.querySelectorAll('#app canvas').length,
              overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth,
            };
          });
          check(gamePopupState.lowerDetailsDisplay === 'none' || gamePopupState.lowerDetailsDisplay === 'absent', 'Order/route popover remains available over the game map');
          check(gamePopupState.statePlanPointerEvents !== 'none', 'State/plan diagnostics were disabled');
          check(gamePopupState.canvasCount === 1, 'Game page does not have exactly one canvas');
          check(!gamePopupState.overflow, 'Game page has horizontal overflow');
          await page.screenshot({ path: `${out}/07-game-without-order-popover.png`, fullPage: false });

          fs.writeFileSync(`${out}/evidence.json`, JSON.stringify({
            productSha: process.env.PRODUCT_SHA,
            pageErrors,
            gamePopupState,
          }, null, 2));
          check(pageErrors.length === 0, `Browser errors detected:\n${pageErrors.join('\n')}`);
          await browser.close();
          NODE
          PRODUCT_SHA="$PRODUCT_SHA" node .combat-lab-dual-sidebars-qa.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-dual-sidebars-qa-${{ github.run_id }}
          path: |
            artifacts/combat-lab-dual-sidebars/**
            ${{ runner.temp }}/preview-verification.json
            ${{ runner.temp }}/vite-preview.log
          if-no-files-found: warn
          retention-days: 14
