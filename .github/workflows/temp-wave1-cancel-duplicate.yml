name: Temporary Wave 1 Cancel Duplicate

on:
  push:
    branches:
      - compiler/20260801-shared-game-editors-wave1

permissions:
  contents: read

concurrency:
  group: temp-wave1-compiler-verification
  cancel-in-progress: true

jobs:
  cancel-duplicate:
    if: contains(github.event.head_commit.message, '[cancel-old]')
    runs-on: ubuntu-latest
    steps:
      - run: echo "Duplicate focused verification cancelled; final matrix will run on the next exact SHA."
