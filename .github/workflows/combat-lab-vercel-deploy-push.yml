name: Combat Lab Exact Vercel Deploy

on:
  push:
    branches:
      - ci/combat-lab-vercel-deploy-*

permissions:
  contents: read

concurrency:
  group: combat-lab-vercel-deploy-222cbd901029751396c6891fa63c1633eb408f31
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify exact SHA and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PRODUCT_BRANCH: feature/20260730-combat-lab-user-acceptance-fixes
      PRODUCT_SHA: 222cbd901029751396c6891fa63c1633eb408f31
      EXPECTED_VERCEL_PROJECT_NAME: repo
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Verify exact source before installation
        id: source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          branch_sha="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual_sha" = "$PRODUCT_SHA"
          test "$branch_sha" = "$PRODUCT_SHA"
          test -z "$(git status --short)"
          echo "ref=$PRODUCT_BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "Verified deployment source: $PRODUCT_BRANCH @ $actual_sha"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused Combat Lab acceptance checks
        run: |
          node scripts/combat_lab_action_catalog_smoke.mjs
          node scripts/combat_lab_map_input_ownership_smoke.mjs
          node scripts/combat_lab_action_dialog_ui_contract_smoke.mjs
          node scripts/combat_lab_program_action_runtime_smoke.mjs
          node scripts/combat_lab_participant_contract_smoke.mjs
          node scripts/combat_lab_participant_scene_editing_smoke.mjs
          node scripts/combat_lab_participant_parameters_smoke.mjs
          node scripts/combat_lab_participant_editor_ui_contract_smoke.mjs
          npx tsc --noEmit

      - name: Run canonical Preview verification gate
        id: gate
        shell: bash
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/preview-verification.json"
          log="$RUNNER_TEMP/preview-verification.log"
          set +e
          npm run verify:preview -- --report "$report" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "log=$log" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-verification-222cbd9
          path: |
            ${{ steps.gate.outputs.report }}
            ${{ steps.gate.outputs.log }}
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce successful verification gate
        run: test "${{ steps.gate.outputs.status }}" = "0"

      - name: Pull permanent Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify permanent Vercel project link
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          node scripts/verify_vercel_project_link.mjs
          --file .vercel/project.json
          --expected-org-id "$VERCEL_ORG_ID"
          --expected-project-id "$VERCEL_PROJECT_ID"
          --expected-project-name "$EXPECTED_VERCEL_PROJECT_NAME"

      - name: Build Vercel output once
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REAL_WARGAME_BRANCH: ${{ steps.source.outputs.ref }}
          REAL_WARGAME_COMMIT_SHA: ${{ steps.source.outputs.sha }}
        run: npx --yes vercel@56.4.1 build --token="$VERCEL_TOKEN"

      - name: Add exact deployment identity
        run: >-
          node scripts/write_deployment_source.mjs
          --root .vercel/output/static
          --ref "${{ steps.source.outputs.ref }}"
          --sha "${{ steps.source.outputs.sha }}"
          --report "${{ steps.gate.outputs.report }}"

      - name: Verify prebuilt output pages
        run: |
          npm run verify:deployment-pages -- --root .vercel/output/static --require-source
          test -f .vercel/output/static/combat-lab.html

      - name: Publish one prebuilt Preview deployment
        id: publish
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@56.4.1 deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          [[ "$deployment_url" =~ ^https://[^[:space:]]+$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Published Preview: $deployment_url"

      - name: Wait for READY and inspect deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          npx --yes vercel@56.4.1 inspect "${{ steps.publish.outputs.url }}"
          --wait --token="$VERCEL_TOKEN"

      - name: Read deployment ID and status
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          response="$RUNNER_TEMP/vercel-deployment.json"
          curl --fail --silent --show-error --get \
            --url "https://api.vercel.com/v13/deployments/$deployment_host" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --data-urlencode "teamId=$VERCEL_ORG_ID" \
            --output "$response"
          RESPONSE="$response" node <<'NODE'
          const fs = require('node:fs');
          const deployment = JSON.parse(fs.readFileSync(process.env.RESPONSE, 'utf8'));
          if (deployment.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error('Wrong Vercel project.');
          if (deployment.readyState !== 'READY') throw new Error(`Deployment is ${deployment.readyState ?? 'unknown'}.`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `id=${deployment.id}\nstatus=${deployment.readyState}\n`);
          NODE

      - name: Verify published pages and exact identity
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
          EXPECTED_REF: ${{ steps.source.outputs.ref }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          npx --yes vercel@56.4.1 curl / --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /ai-node-editor.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /combat-lab.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          source_file="$RUNNER_TEMP/published-deployment-source.json"
          npx --yes vercel@56.4.1 curl /deployment-source.json --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > "$source_file"
          SOURCE_FILE="$source_file" node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8'));
          if (source.ref !== process.env.EXPECTED_REF || source.sourceSha !== process.env.EXPECTED_SHA) throw new Error('Published deployment identity mismatch.');
          NODE

      - name: Save deployment result
        if: success()
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/combat-lab-deployment-result.json" <<JSON
          {
            "ref": "${{ steps.source.outputs.ref }}",
            "sha": "${{ steps.source.outputs.sha }}",
            "deploymentId": "${{ steps.deployment.outputs.id }}",
            "status": "${{ steps.deployment.outputs.status }}",
            "url": "${{ steps.publish.outputs.url }}"
          }
          JSON

      - name: Upload deployment result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-deployment-result-222cbd9
          path: ${{ runner.temp }}/combat-lab-deployment-result.json
          retention-days: 7

      - name: Publish deployment summary
        if: always()
        shell: bash
        env:
          RUN_STATUS: ${{ job.status }}
          VERIFIED_SHA: ${{ steps.source.outputs.sha }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
          DEPLOYMENT_STATUS: ${{ steps.deployment.outputs.status }}
        run: |
          {
            echo '## Combat Lab exact Preview deployment'
            echo
            echo "- status: ${RUN_STATUS:-unknown}"
            echo "- ref: $PRODUCT_BRANCH"
            echo "- verified SHA: ${VERIFIED_SHA:-not verified}"
            echo "- deployment ID: ${DEPLOYMENT_ID:-not created}"
            echo "- Preview URL: ${DEPLOYMENT_URL:-not created}"
            echo "- Vercel status: ${DEPLOYMENT_STATUS:-not available}"
          } >> "$GITHUB_STEP_SUMMARY"
