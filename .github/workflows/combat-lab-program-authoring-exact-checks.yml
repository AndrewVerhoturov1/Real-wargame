name: Combat Lab Program Authoring Exact Checks

on:
  pull_request:
    branches:
      - verification/20260731-combat-lab-program-authoring-report-base

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Selection controller behavior
        run: node scripts/combat_lab_selection_controller_behavior_smoke.mjs
      - name: Map tool transaction behavior
        run: node scripts/combat_lab_map_tool_transaction_behavior_smoke.mjs
      - name: Program layout behavior
        run: node scripts/combat_lab_program_layout_behavior_smoke.mjs
      - name: Track dialog behavior
        run: node scripts/combat_lab_track_dialog_behavior_smoke.mjs
      - name: Map mode behavior
        run: node scripts/combat_lab_map_mode_behavior_smoke.mjs
      - name: Marker authoring behavior
        run: node scripts/combat_lab_marker_authoring_behavior_smoke.mjs
      - name: Step dialog behavior
        run: node scripts/combat_lab_step_dialog_behavior_smoke.mjs
      - name: Scenario system verify
        run: npm run combat-lab-scenario-system:verify
      - name: UI contract smoke
        run: npm run combat-lab-ui-contract:smoke
      - name: TypeScript no emit
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
