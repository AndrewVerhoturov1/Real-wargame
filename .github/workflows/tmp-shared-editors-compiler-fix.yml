name: Temporary Shared Editors Compiler Matrix

on:
  push:
    branches:
      - compiler/20260731-shared-game-editors-integration

permissions:
  contents: write
  actions: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[compiler-matrix]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Run canonical non-browser matrix
        shell: bash
        run: |
          set -u
          OUT="$GITHUB_WORKSPACE/reports/compiler-final"
          LOGS="$OUT/logs"
          mkdir -p "$LOGS" "$OUT/screenshots"
          git rev-parse HEAD > "$OUT/tested-head.txt"
          : > "$OUT/checks.tsv"
          FAILED=0
          run_check() {
            local name="$1"; shift
            local started ended status
            started=$(date +%s)
            set +e
            "$@" > "$LOGS/$name.log" 2>&1
            status=$?
            set -e
            ended=$(date +%s)
            printf '%s\t%s\t%s\n' "$name" "$status" "$((ended-started))" >> "$OUT/checks.tsv"
            if [ "$status" -ne 0 ]; then FAILED=1; fi
          }
          run_check npm-ci npm ci --no-audit --no-fund
          run_check typecheck npm run typecheck
          run_check app-shell-overlay npm run app-shell-overlay:smoke
          run_check shared-game-editors npm run shared-game-editors:smoke
          run_check gameplay-tuning-editors npm run gameplay-tuning-editors:smoke
          run_check combat-lab-game-editors npm run combat-lab-game-editors:smoke
          run_check editor npm run editor:smoke
          run_check graph-v2 npm run graph-v2:smoke
          run_check perception npm run perception:smoke
          run_check perception-performance npm run perception-performance:smoke
          run_check attention-profiles npm run attention-profiles:smoke
          run_check movement-profiles npm run movement-profiles:smoke
          run_check environment-materials npm run environment-materials:smoke
          run_check combat-catalog-editor npm run combat-catalog-editor:smoke
          run_check directional-terrain npm run directional-terrain:smoke
          run_check combat-lab-ui-contract npm run combat-lab-ui-contract:smoke
          run_check combat-lab-experiment npm run combat-lab-experiment:smoke
          run_check combat-lab-batch npm run combat-lab-batch:smoke
          run_check combat-lab-scenario-system npm run combat-lab-scenario-system:verify
          run_check infantry-stage6 npm run infantry-combat-stage6:verify
          run_check infantry-stage7 npm run infantry-combat-stage7:verify
          run_check infantry-stage8 npm run infantry-combat-stage8:verify
          run_check infantry-stage9 npm run infantry-combat-stage9:verify
          run_check workspace-architecture npm run workspace-architecture-contract:smoke
          run_check performance-contract npm run performance-contract:smoke
          run_check long-task-classification npm run long-task-classification:smoke
          run_check production-build npm run build
          run_check canonical-preview npm run verify:preview -- --report "$OUT/canonical-preview.json"
          echo "$FAILED" > "$OUT/matrix-failed.txt"

      - name: Install Chromium audit dependency
        shell: bash
        run: |
          OUT="$GITHUB_WORKSPACE/reports/compiler-final"
          set +e
          npm install --no-save --package-lock=false playwright@1.54.2 > "$OUT/logs/playwright-package.log" 2>&1
          PACKAGE_STATUS=$?
          npx playwright install --with-deps chromium > "$OUT/logs/playwright-browser.log" 2>&1
          BROWSER_STATUS=$?
          set -e
          if [ "$PACKAGE_STATUS" -ne 0 ] || [ "$BROWSER_STATUS" -ne 0 ]; then
            echo 1 > "$OUT/browser-install-failed.txt"
          else
            echo 0 > "$OUT/browser-install-failed.txt"
          fi

      - name: Run four-resolution browser and performance audit
        shell: bash
        run: |
          OUT="$GITHUB_WORKSPACE/reports/compiler-final"
          cat > "$OUT/browser-audit.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { chromium } from 'playwright';

          const out = path.resolve('reports/compiler-final');
          const shots = path.join(out, 'screenshots');
          fs.mkdirSync(shots, { recursive: true });
          const base = 'http://127.0.0.1:4173';
          const sizes = [[1440, 900], [1366, 768], [1100, 760], [1920, 1080]];
          const editorIds = [
            'behaviorGraph', 'tacticalPositions', 'routeProfiles', 'environmentProfiles',
            'movementProfiles', 'weapons', 'attentionProfiles', 'perceptionProfiles',
            'soldierData', 'soldierArchetypes', 'conditionProfiles', 'directionalTerrain',
          ];
          const evidence = {
            testedHead: fs.readFileSync(path.join(out, 'tested-head.txt'), 'utf8').trim(),
            sizes: [], consoleErrors: [], pageErrors: [], requestFailures: [],
            lifecycle: null, frameSamples: null, longTasks: [], selectedProfileLink: false,
            graphReturn: false, batchStarted: false, runControls: false,
          };
          const ensure = (condition, message) => { if (!condition) throw new Error(message); };
          const percentile = (values, p) => {
            if (!values.length) return 0;
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.min(sorted.length - 1, Math.ceil(sorted.length * p) - 1)];
          };
          const browser = await chromium.launch({ headless: true });
          try {
            for (const [width, height] of sizes) {
              const label = `${width}x${height}`;
              const context = await browser.newContext({ viewport: { width, height } });
              await context.addInitScript(() => {
                window.__sharedEditorsQaLongTasks = [];
                try {
                  new PerformanceObserver((list) => {
                    for (const entry of list.getEntries()) {
                      window.__sharedEditorsQaLongTasks.push({ startTime: entry.startTime, duration: entry.duration });
                    }
                  }).observe({ type: 'longtask', buffered: true });
                } catch {}
              });
              const page = await context.newPage();
              page.on('console', (message) => {
                if (message.type() === 'error') evidence.consoleErrors.push({ label, text: message.text() });
              });
              page.on('pageerror', (error) => evidence.pageErrors.push({ label, text: String(error) }));
              page.on('requestfailed', (request) => evidence.requestFailures.push({ label, url: request.url(), error: request.failure()?.errorText ?? '' }));

              const noHorizontalScroll = async (stage) => {
                const value = await page.evaluate(() => ({
                  viewport: document.documentElement.clientWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  bodyWidth: document.body.scrollWidth,
                }));
                ensure(value.documentWidth <= value.viewport + 1 && value.bodyWidth <= value.viewport + 1,
                  `${label} ${stage}: horizontal overflow ${JSON.stringify(value)}`);
              };
              const openAndCloseMenu = async (prefix) => {
                const trigger = page.locator('.app-shell-menu-trigger');
                await trigger.waitFor({ state: 'visible' });
                ensure(await page.locator('[data-app-shell-menu-root="true"]').count() === 1, `${label} ${prefix}: expected one menu root`);
                await trigger.click();
                const dialog = page.locator('.app-modal-dialog[role="dialog"]');
                await dialog.waitFor({ state: 'visible' });
                ensure(await dialog.getByText('Текущий режим').count() === 1, `${label} ${prefix}: current mode marker missing`);
                await page.screenshot({ path: path.join(shots, `${prefix}-menu-${label}.png`), fullPage: true });
                await page.keyboard.press('Escape');
                await dialog.waitFor({ state: 'detached' });
                ensure(await page.evaluate(() => document.activeElement?.classList.contains('app-shell-menu-trigger') === true),
                  `${label} ${prefix}: menu focus was not restored`);
              };

              await page.goto(`${base}/`, { waitUntil: 'domcontentloaded' });
              await page.locator('.app-shell-menu-trigger').waitFor();
              await noHorizontalScroll('game');
              await openAndCloseMenu('game');

              await page.goto(`${base}/ai-node-editor.html`, { waitUntil: 'domcontentloaded' });
              await page.locator('[data-game-editor-surface="ai-editor"]').waitFor();
              ensure(await page.locator('[data-game-editor-id]').count() === 12, `${label} AI editor: expected 12 editor tabs`);
              ensure(await page.locator('[data-game-editor-return]').isHidden(), `${label} AI editor: unsafe return link visible on direct load`);
              await noHorizontalScroll('ai-editor');
              if (width === 1440 || width === 1100) {
                for (const id of editorIds) {
                  await page.locator(`[data-game-editor-id="${id}"]`).click();
                  await page.waitForFunction((value) => document.querySelector('[data-game-editor-workspace]')?.dataset.activeGameEditor === value, id);
                  await noHorizontalScroll(`ai-editor-${id}`);
                  if (width === 1440 && ['environmentProfiles', 'perceptionProfiles', 'soldierArchetypes', 'conditionProfiles'].includes(id)) {
                    await page.screenshot({ path: path.join(shots, `ai-${id}-${label}.png`), fullPage: true });
                  }
                }
              }
              await openAndCloseMenu('ai');

              await page.goto(`${base}/combat-lab.html`, { waitUntil: 'domcontentloaded' });
              await page.locator('.combat-lab-workspace').waitFor({ state: 'visible' });
              await noHorizontalScroll('combat-lab');
              const runToolbar = page.locator('.combat-lab-experiment-run-toolbar');
              await runToolbar.waitFor({ state: 'visible' });
              const startButton = runToolbar.getByRole('button', { name: /Запустить/ }).first();
              if (await startButton.isEnabled()) {
                await startButton.click();
                await page.waitForFunction(() => document.querySelector('.combat-lab-experiment-run-toolbar')?.dataset.status === 'running');
                const pauseButton = runToolbar.getByRole('button', { name: 'Пауза', exact: true });
                if (await pauseButton.isEnabled()) await pauseButton.click();
                await runToolbar.getByRole('button', { name: 'Сбросить', exact: true }).click();
                evidence.runControls = true;
              }

              await page.locator('[data-combat-lab-tab="settings"]').click();
              await page.locator('[data-combat-lab-game-editor-catalogue="true"]').waitFor({ state: 'visible' });
              ensure(await page.locator('.combat-lab-game-editor-item').count() === 12, `${label} Combat Lab: expected 12 dynamic editor items`);
              ensure(await page.locator('[data-game-editor-group]').count() === 4, `${label} Combat Lab: expected four editor groups`);
              await noHorizontalScroll('combat-lab-settings');
              await page.screenshot({ path: path.join(shots, `combat-lab-catalogue-${label}.png`), fullPage: true });

              const perceptionButton = page.locator('[data-game-editor-id="perceptionProfiles"]');
              await perceptionButton.click();
              await page.locator('.app-modal-layer').waitFor({ state: 'visible' });
              await noHorizontalScroll('combat-lab-perception-modal');
              await page.screenshot({ path: path.join(shots, `combat-lab-perception-modal-${label}.png`), fullPage: true });
              await page.keyboard.press('Escape');
              await page.locator('.app-modal-layer').waitFor({ state: 'detached' });
              ensure(await page.evaluate(() => document.activeElement?.dataset.gameEditorId === 'perceptionProfiles'),
                `${label} Combat Lab: editor trigger focus was not restored`);
              await page.keyboard.press('Escape');
              await page.locator('.app-shell-dialog').waitFor({ state: 'visible' });
              await page.keyboard.press('Escape');
              await page.locator('.app-shell-dialog').waitFor({ state: 'detached' });

              if (width === 1440) {
                const embedded = editorIds.filter((id) => id !== 'behaviorGraph');
                for (const id of embedded) {
                  await page.locator(`[data-game-editor-id="${id}"]`).click();
                  await page.locator('.app-modal-layer').waitFor({ state: 'visible' });
                  await page.keyboard.press('Escape');
                  await page.locator('.app-modal-layer').waitFor({ state: 'detached' });
                }

                await page.evaluate(() => { window.__sharedEditorsQaLongTasks.length = 0; });
                const openDurations = [];
                const closeDurations = [];
                const lifecycleButton = page.locator('[data-game-editor-id="conditionProfiles"]');
                for (let index = 0; index < 20; index += 1) {
                  let started = Date.now();
                  await lifecycleButton.click();
                  await page.locator('.app-modal-layer').waitFor({ state: 'visible' });
                  openDurations.push(Date.now() - started);
                  ensure(await page.locator('.app-modal-layer').count() === 1, 'modal layers accumulated');
                  started = Date.now();
                  await page.keyboard.press('Escape');
                  await page.locator('.app-modal-layer').waitFor({ state: 'detached' });
                  closeDurations.push(Date.now() - started);
                }
                evidence.lifecycle = {
                  cycles: 20,
                  openP95Ms: percentile(openDurations, 0.95),
                  openMaxMs: Math.max(...openDurations),
                  closeP95Ms: percentile(closeDurations, 0.95),
                  closeMaxMs: Math.max(...closeDurations),
                };

                const dialogQueue = [];
                page.on('dialog', async (dialog) => {
                  const instruction = dialogQueue.shift();
                  if (!instruction) {
                    evidence.pageErrors.push({ label, text: `Unexpected dialog: ${dialog.message()}` });
                    await dialog.dismiss();
                  } else if (instruction.action === 'accept') {
                    await dialog.accept(instruction.value ?? '');
                  } else {
                    await dialog.dismiss();
                  }
                });
                await perceptionButton.click();
                await page.locator('.app-modal-layer').waitFor({ state: 'visible' });
                dialogQueue.push(
                  { action: 'accept', value: 'qa-perception-copy' },
                  { action: 'accept', value: 'Проверка несохранённых изменений' },
                );
                await page.getByRole('button', { name: 'Создать копию', exact: true }).click();
                await page.locator('[data-tuning-profile-id="qa-perception-copy"]').waitFor();
                const numericInput = page.locator('input[data-tuning-path]:not([disabled])').first();
                await numericInput.evaluate((element) => {
                  element.value = String(Number(element.value) + Number(element.step || 1));
                  element.dispatchEvent(new Event('change', { bubbles: true }));
                });
                ensure(await page.getByText('Есть несохранённые изменения.').count() === 1, 'dirty state missing');
                dialogQueue.push({ action: 'dismiss' });
                await page.keyboard.press('Escape');
                await page.waitForTimeout(100);
                ensure(await page.locator('.app-modal-layer').count() === 1, 'beforeClose=false did not preserve modal');
                dialogQueue.push({ action: 'accept' });
                await page.keyboard.press('Escape');
                await page.locator('.app-modal-layer').waitFor({ state: 'detached' });

                await page.locator('[data-combat-lab-tab="parameters"]').click();
                const sourceLink = page.locator('.combat-lab-source-profile-link button').first();
                await sourceLink.waitFor({ state: 'visible', timeout: 10000 });
                await sourceLink.click();
                await page.locator('.app-modal-layer').waitFor({ state: 'visible' });
                evidence.selectedProfileLink = true;
                await page.screenshot({ path: path.join(shots, `combat-lab-selected-profile-link-${label}.png`), fullPage: true });
                await page.keyboard.press('Escape');
                await page.locator('.app-modal-layer').waitFor({ state: 'detached' });

                await page.getByRole('button', { name: 'Серия', exact: true }).click();
                await page.locator('[data-combat-lab-tab="batch"][aria-selected="true"]').waitFor();
                const batchPanel = page.locator('.combat-lab-batch-panel');
                await batchPanel.getByLabel('Число прогонов').fill('2');
                await batchPanel.getByLabel('Максимум симуляционных секунд').fill('1');
                await batchPanel.getByRole('button', { name: 'Запустить серию', exact: true }).click();
                evidence.batchStarted = true;
                await page.waitForTimeout(1200);
                const cancelBatch = batchPanel.getByRole('button', { name: 'Отменить', exact: true });
                if (await cancelBatch.isEnabled()) await cancelBatch.click();
                await page.screenshot({ path: path.join(shots, `combat-lab-batch-${label}.png`), fullPage: true });

                await page.locator('[data-combat-lab-tab="settings"]').click();
                await Promise.all([
                  page.waitForURL(/\/ai-node-editor\.html\?/),
                  page.locator('[data-game-editor-id="behaviorGraph"]').click(),
                ]);
                const returnLink = page.locator('[data-game-editor-return]');
                await returnLink.waitFor({ state: 'visible' });
                ensure((await returnLink.getAttribute('href'))?.startsWith('/combat-lab.html') === true, 'safe graph return link missing');
                evidence.graphReturn = true;
                await page.screenshot({ path: path.join(shots, `graph-return-${label}.png`), fullPage: true });
                await Promise.all([
                  page.waitForURL(/\/combat-lab\.html/),
                  returnLink.click(),
                ]);
                await page.locator('.combat-lab-workspace').waitFor({ state: 'visible' });

                await page.locator('[data-combat-lab-tab="settings"]').click();
                await page.locator('[data-game-editor-id="perceptionProfiles"]').click();
                await page.locator('.app-modal-layer').waitFor({ state: 'visible' });
                const sampleFrames = async () => page.evaluate(async () => {
                  const deltas = [];
                  let previous = performance.now();
                  await new Promise((resolve) => {
                    const frame = (now) => {
                      deltas.push(now - previous);
                      previous = now;
                      if (deltas.length >= 120) resolve(); else requestAnimationFrame(frame);
                    };
                    requestAnimationFrame(frame);
                  });
                  deltas.sort((a, b) => a - b);
                  return { p95: deltas[Math.ceil(deltas.length * 0.95) - 1], max: deltas.at(-1) };
                });
                const modalFrames = await sampleFrames();
                await page.keyboard.press('Escape');
                await page.locator('.app-modal-layer').waitFor({ state: 'detached' });
                const closedFrames = await sampleFrames();
                evidence.frameSamples = { modalOpen: modalFrames, modalClosed: closedFrames };
                evidence.longTasks = await page.evaluate(() => [...window.__sharedEditorsQaLongTasks]);
              }

              evidence.sizes.push({ width, height, horizontalOverflow: false });
              await context.close();
            }
          } finally {
            await browser.close();
          }
          ensure(evidence.consoleErrors.length === 0, `console errors: ${JSON.stringify(evidence.consoleErrors)}`);
          ensure(evidence.pageErrors.length === 0, `page errors: ${JSON.stringify(evidence.pageErrors)}`);
          ensure(evidence.requestFailures.length === 0, `request failures: ${JSON.stringify(evidence.requestFailures)}`);
          ensure(evidence.selectedProfileLink, 'selected-unit source-profile link was not exercised');
          ensure(evidence.graphReturn, 'graph route return was not exercised');
          ensure(evidence.batchStarted, 'batch start was not exercised');
          ensure(evidence.runControls, 'start/pause/reset controls were not exercised');
          ensure(evidence.longTasks.length === 0, `application long tasks observed: ${JSON.stringify(evidence.longTasks)}`);
          fs.writeFileSync(path.join(out, 'browser-evidence.json'), JSON.stringify(evidence, null, 2));
          NODE

          if [ "$(cat "$OUT/browser-install-failed.txt")" != "0" ]; then
            echo 1 > "$OUT/browser-failed.txt"
            echo "Playwright installation failed" > "$OUT/logs/browser-audit.log"
            exit 0
          fi
          set +e
          npm run preview -- --host 127.0.0.1 --port 4173 > "$OUT/logs/preview-server.log" 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node "$OUT/browser-audit.mjs" > "$OUT/logs/browser-audit.log" 2>&1
          STATUS=$?
          kill "$SERVER_PID" >/dev/null 2>&1 || true
          wait "$SERVER_PID" >/dev/null 2>&1 || true
          set -e
          echo "$STATUS" > "$OUT/browser-failed.txt"

      - name: Build verification summary
        id: summary
        shell: bash
        run: |
          OUT="$GITHUB_WORKSPACE/reports/compiler-final"
          MATRIX_FAILED=$(cat "$OUT/matrix-failed.txt")
          BROWSER_FAILED=$(cat "$OUT/browser-failed.txt")
          if [ "$MATRIX_FAILED" = "0" ] && [ "$BROWSER_FAILED" = "0" ]; then OVERALL=PASS; else OVERALL=FAIL; fi
          {
            echo "overall_status=$OVERALL"
            echo "tested_head=$(cat "$OUT/tested-head.txt")"
            echo "matrix_failed=$MATRIX_FAILED"
            echo "browser_failed=$BROWSER_FAILED"
            echo
            echo "checks:"
            cat "$OUT/checks.tsv"
            echo
            echo "browser_evidence:"
            if [ -f "$OUT/browser-evidence.json" ]; then cat "$OUT/browser-evidence.json"; else echo "missing"; fi
          } > "$OUT/summary.txt"

      - name: Upload full compiler evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-editors-compiler-evidence
          path: reports/compiler-final
          if-no-files-found: error
          retention-days: 14

      - name: Publish report metadata to compiler branch
        if: always()
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence.outputs.artifact-digest }}
        run: |
          OUT="$GITHUB_WORKSPACE/reports/compiler-final"
          {
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_url=$ARTIFACT_URL"
            echo "artifact_digest=$ARTIFACT_DIGEST"
          } > "$OUT/artifact.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT/summary.txt" "$OUT/artifact.txt" "$OUT/canonical-preview.json" 2>/dev/null || true
          git commit -m "test(integration): record final compiler verification evidence" || true
          git push origin HEAD:compiler/20260731-shared-game-editors-integration

      - name: Enforce verification result
        if: always()
        shell: bash
        run: |
          grep -q '^overall_status=PASS$' reports/compiler-final/summary.txt
