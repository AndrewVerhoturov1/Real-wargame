name: Stage 9 Full Log Diagnostic

on:
  pull_request:
    branches:
      - real-wargame-preview
    types: [ready_for_review]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feature/20260725-shooting-stage-09-machine-gun-assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complete combat verification
        id: combat
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run combat-foundation:smoke 2>&1 | tee "$RUNNER_TEMP/stage9-full-verification.log"
          npm run perception:smoke 2>&1 | tee -a "$RUNNER_TEMP/stage9-full-verification.log"

      - name: Upload complete verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage9-full-verification-log
          path: ${{ runner.temp }}/stage9-full-verification.log
          if-no-files-found: error
          retention-days: 3

      - name: Preserve verification result
        if: steps.combat.outcome != 'success'
        run: exit 1
