name: Temporary Shared Editors Exact Diff Gate

on:
  push:
    branches:
      - compiler/20260731-shared-game-editors-integration

permissions:
  contents: write

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[shared-editors-exact-diff]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Establish final clean HEAD
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t TEMP_FILES < <(git ls-files \
            '.github/workflows/tmp-shared-editors-*.yml' \
            'reports/.tmp-shared-editors-*' \
            'reports/compiler-final/*')
          if [ "${#TEMP_FILES[@]}" -gt 0 ]; then
            git rm -f -- "${TEMP_FILES[@]}"
            git commit -m "chore(integration): remove exact diff verification scaffolding"
            git push origin HEAD:compiler/20260731-shared-game-editors-integration
          fi
          test -z "$(git status --short)"
          git rev-parse HEAD | tee /tmp/shared-editors-exact-diff-head.txt
      - name: Run exact foundation and focused gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          git diff --check dd89d31c4d4b874439e0860b6a2be0c5e6ecee1f...HEAD
          test -z "$(git status --short)"
          npm run typecheck
          npm run shared-game-editors:smoke
          npm run gameplay-tuning-editors:smoke
          npm run combat-lab-game-editors:smoke
          npm run build
          test -z "$(git status --short)"
          test "$(git rev-parse HEAD)" = "$(cat /tmp/shared-editors-exact-diff-head.txt)"
