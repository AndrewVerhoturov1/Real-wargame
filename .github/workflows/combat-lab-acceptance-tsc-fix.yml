name: Combat Lab Acceptance TSC Fix

on:
  pull_request:
    branches:
      - ci/20260730-combat-lab-acceptance-deploy-base-c0c0cf7
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_BRANCH: feature/20260730-combat-lab-user-acceptance-fixes
      EXPECTED_SHA: 0d3560d7eb7eb5b7a895fb3d8b88ed03588956b8
    steps:
      - name: Checkout acceptance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_BRANCH }}
          fetch-depth: 0

      - name: Verify expected source
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --short)"

      - name: Apply exhaustive action-union fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected fragment missing in {path}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'src/combat-lab/scenario-editor/CombatLabExperimentDraft.ts',
              """function actionReferencesMarker(action: CombatLabActionV1, markerId: string): boolean {
            if (action.kind === 'move') return action.markerId === markerId;
            return action.kind === 'fire' && action.target.kind === 'marker' && action.target.markerId === markerId;
          }""",
              """function actionReferencesMarker(action: CombatLabActionV1, markerId: string): boolean {
            if (action.kind === 'move') return action.markerId === markerId || action.finalFacingMarkerId === markerId;
            if (action.kind === 'face') return action.markerId === markerId;
            return action.kind === 'fire' && action.target.kind === 'marker' && action.target.markerId === markerId;
          }""",
          )
          replace(
              'src/combat-lab/scenario-editor/CombatLabExperimentDraft.ts',
              """    case 'stop_fire':
              case 'move':
              case 'posture': return action.actorRoleId === roleId;""",
              """    case 'stop_fire':
              case 'move':
              case 'face':
              case 'cancel_action':
              case 'posture': return action.actorRoleId === roleId;""",
          )
          replace(
              'src/combat-lab/scenario-editor/CombatLabMapAuthoringController.ts',
              "import type { CombatLabExperimentDraft } from './CombatLabExperimentDraft';",
              "import { CombatLabExperimentDraft } from './CombatLabExperimentDraft';",
          )
          replace(
              'src/combat-lab/scenario-editor/CombatLabMapAuthoringController.ts',
              'weapon.resolved.weapon.fireModes.includes(mode)',
              'weapon.resolved.weapon.availableFireModes.includes(mode)',
          )
          replace(
              'src/core/testing/combat-lab/CombatLabCommands.ts',
              """  const actor = findUnit(state, command.actorUnitId);
            const target = findUnit(state, command.targetUnitId);""",
              """  if (command.kind !== 'first_aid') {
            return rejected('combat_lab_command_kind_unsupported', `Команда ${command.kind} не поддерживается.`);
          }
          const actor = findUnit(state, command.actorUnitId);
            const target = findUnit(state, command.targetUnitId);""",
          )
          replace(
              'src/core/testing/combat-lab/experiment/CombatLabBuiltInExperiments.ts',
              """    case 'move': return 'Двигаться к позиции';
              case 'posture': return 'Изменить позу';""",
              """    case 'move': return 'Двигаться к позиции';
              case 'face': return 'Повернуться к точке';
              case 'cancel_action': return 'Отменить действие';
              case 'posture': return 'Изменить позу';""",
          )
          replace(
              'src/core/testing/combat-lab/experiment/CombatLabParticipantParameters.ts',
              'deepFreeze(structuredClone(value.accuracy)) as CombatLabAccuracyOverridesV1',
              'deepFreeze(structuredClone(value.accuracy)) as unknown as CombatLabAccuracyOverridesV1',
          )

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify fixes
        run: |
          npx tsc --noEmit
          node scripts/combat_lab_action_catalog_smoke.mjs
          node scripts/combat_lab_program_action_runtime_smoke.mjs
          npm run combat-lab-experiment:smoke
          npm run combat-lab-scenario-editor:smoke
          npm run build

      - name: Commit and push acceptance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/combat-lab/scenario-editor/CombatLabExperimentDraft.ts \
            src/combat-lab/scenario-editor/CombatLabMapAuthoringController.ts \
            src/core/testing/combat-lab/CombatLabCommands.ts \
            src/core/testing/combat-lab/experiment/CombatLabBuiltInExperiments.ts \
            src/core/testing/combat-lab/experiment/CombatLabParticipantParameters.ts
          git commit -m "fix(combat-lab): complete expanded action type coverage"
          git push origin "HEAD:$PRODUCT_BRANCH"
          echo "NEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
