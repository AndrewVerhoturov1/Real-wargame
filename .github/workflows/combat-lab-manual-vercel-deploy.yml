name: Combat Lab Manual Vercel Deploy

on:
  pull_request:
    branches:
      - ci/combat-lab-camera-aim-tdd-base-20260727
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: combat-lab-manual-vercel-8cbad1df40eeb2699d9c2cf97866dabdacb89666
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and publish exact Combat Lab Preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_VERCEL_PROJECT_NAME: repo
      DEPLOY_REF: feature/20260726-shooting-stage-09v-combat-lab
      DEPLOY_SHA: 8cbad1df40eeb2699d9c2cf97866dabdacb89666
    steps:
      - name: Checkout exact product commit
        uses: actions/checkout@v4
        with:
          ref: 8cbad1df40eeb2699d9c2cf97866dabdacb89666
          fetch-depth: 0

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Requested ref: $DEPLOY_REF"
          echo "Expected SHA: $DEPLOY_SHA"
          echo "Checked out SHA: $actual_sha"
          test "$actual_sha" = "$DEPLOY_SHA"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run deployment verification gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/preview-verification.json"
          npm run verify:preview -- --report "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Pull permanent Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify permanent Vercel project link
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          node scripts/verify_vercel_project_link.mjs
          --file .vercel/project.json
          --expected-org-id "$VERCEL_ORG_ID"
          --expected-project-id "$VERCEL_PROJECT_ID"
          --expected-project-name "$EXPECTED_VERCEL_PROJECT_NAME"

      - name: Build Vercel output once
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REAL_WARGAME_BRANCH: ${{ env.DEPLOY_REF }}
          REAL_WARGAME_COMMIT_SHA: ${{ env.DEPLOY_SHA }}
        run: npx --yes vercel@56.4.1 build --token="$VERCEL_TOKEN"

      - name: Add exact deployment identity
        run: >-
          node scripts/write_deployment_source.mjs
          --root .vercel/output/static
          --ref "$DEPLOY_REF"
          --sha "$DEPLOY_SHA"
          --report "${{ steps.gate.outputs.report }}"

      - name: Verify prebuilt output pages
        run: npm run verify:deployment-pages -- --root .vercel/output/static --require-source

      - name: Publish one prebuilt Preview deployment
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@56.4.1 deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          [[ "$deployment_url" =~ ^https://[^[:space:]]+$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Wait for READY and inspect deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          npx --yes vercel@56.4.1 inspect "${{ steps.deploy.outputs.url }}"
          --wait --token="$VERCEL_TOKEN"

      - name: Read deployment ID and status
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          response="$RUNNER_TEMP/vercel-deployment.json"
          curl --fail --silent --show-error --get \
            --url "https://api.vercel.com/v13/deployments/$deployment_host" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --data-urlencode "teamId=$VERCEL_ORG_ID" \
            --output "$response"
          RESPONSE="$response" node <<'NODE'
          const fs = require('node:fs');
          const deployment = JSON.parse(fs.readFileSync(process.env.RESPONSE, 'utf8'));
          if (deployment.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error('Wrong permanent Vercel project.');
          if (deployment.readyState !== 'READY') throw new Error(`Deployment is not READY: ${deployment.readyState ?? 'unknown'}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `id=${deployment.id}\nstatus=${deployment.readyState}\n`);
          NODE

      - name: Verify published pages and identity
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@56.4.1 curl / --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /ai-node-editor.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          source_file="$RUNNER_TEMP/published-deployment-source.json"
          npx --yes vercel@56.4.1 curl /deployment-source.json --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > "$source_file"
          SOURCE_FILE="$source_file" node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8'));
          if (source.ref !== process.env.DEPLOY_REF || source.sourceSha !== process.env.DEPLOY_SHA) {
            throw new Error(`Published identity mismatch: ${JSON.stringify(source)}`);
          }
          NODE

      - name: Write deployment result
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOYMENT_STATUS: ${{ steps.deployment.outputs.status }}
        run: |
          RESULT="$RUNNER_TEMP/manual-vercel-preview-result.json" node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync(process.env.RESULT, JSON.stringify({
            status: process.env.DEPLOYMENT_STATUS,
            deploymentId: process.env.DEPLOYMENT_ID,
            deploymentUrl: process.env.DEPLOYMENT_URL,
            ref: process.env.DEPLOY_REF,
            sourceSha: process.env.DEPLOY_SHA,
            gameUrl: `${process.env.DEPLOYMENT_URL}/`,
            aiNodeEditorUrl: `${process.env.DEPLOYMENT_URL}/ai-node-editor.html`,
            sourceUrl: `${process.env.DEPLOYMENT_URL}/deployment-source.json`,
          }, null, 2) + '\n');
          NODE

      - name: Upload deployment result
        uses: actions/upload-artifact@v4
        with:
          name: manual-vercel-preview-result
          path: ${{ runner.temp }}/manual-vercel-preview-result.json

      - name: Publish run summary
        if: always()
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          DEPLOYMENT_STATUS: ${{ steps.deployment.outputs.status }}
        run: |
          {
            echo '## Manual Vercel Preview'
            echo
            echo "- job status: ${{ job.status }}"
            echo "- ref: $DEPLOY_REF"
            echo "- SHA: $DEPLOY_SHA"
            echo "- deployment ID: ${DEPLOYMENT_ID:-not created}"
            echo "- Preview URL: ${DEPLOYMENT_URL:-not created}"
            echo "- Vercel status: ${DEPLOYMENT_STATUS:-not available}"
          } >> "$GITHUB_STEP_SUMMARY"
