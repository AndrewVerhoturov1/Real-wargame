name: Combat Lab Final Publish Exact

on:
  pull_request:
    branches:
      - ci/combat-lab-final-publish-base-20260731t113500z-aab8781

permissions:
  contents: write

jobs:
  publish-exact-product-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout temporary harness
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Checkout exact integration parent
        uses: actions/checkout@v4
        with:
          ref: integration/20260731-combat-lab-final-assembly-visual-qa
          fetch-depth: 0
          path: product

      - name: Apply and publish exact reviewed product patch
        shell: bash
        working-directory: product
        env:
          EXPECTED_PARENT: aab878113abb876f066745debd6d04fe3246fd94
          EXPECTED_TREE: 22504f2c1e388740aa244655934648d3d436d1da
          PATCH_B64_SHA256: ee7843d018f5a8cc15cbe40c0e98bd303b26a927aa5dc9c81eb2ceca2974ca8a
          TARGET_BRANCH: integration/20260731-combat-lab-final-assembly-visual-qa
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_PARENT"
          remote_sha="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_PARENT"

          cat ../harness/ci/final-product-chunks/chunk-* > "$RUNNER_TEMP/final-product.patch.gz.b64"
          printf '%s  %s\n' "$PATCH_B64_SHA256" "$RUNNER_TEMP/final-product.patch.gz.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/final-product.patch.gz.b64" | gunzip > "$RUNNER_TEMP/final-product.patch"
          git apply --check "$RUNNER_TEMP/final-product.patch"
          git apply "$RUNNER_TEMP/final-product.patch"
          git diff --check
          git add -A
          git config user.name 'OpenAI Combat Lab Integrator'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Integrate Combat Lab authoring and final assembly contracts'

          actual_tree="$(git rev-parse HEAD^{tree})"
          echo "Expected tree: $EXPECTED_TREE"
          echo "Actual tree:   $actual_tree"
          test "$actual_tree" = "$EXPECTED_TREE"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Record published identity
        shell: bash
        working-directory: product
        run: |
          {
            echo '## Exact final integration product publication'
            echo
            echo "- commit: $(git rev-parse HEAD)"
            echo "- tree: $(git rev-parse HEAD^{tree})"
            echo '- workflow update: intentionally separate'
            echo '- target: integration/20260731-combat-lab-final-assembly-visual-qa'
          } >> "$GITHUB_STEP_SUMMARY"
