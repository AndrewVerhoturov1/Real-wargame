name: Temporary Wave 1 Compiler Verification

on:
  push:
    branches:
      - compiler/20260801-shared-game-editors-wave1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temp-wave1-compiler-verification
  cancel-in-progress: false

jobs:
  baseline-red:
    if: contains(github.event.head_commit.message, '[baseline]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd802d92613b64df76552c429a664bb4cbcd909c
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify exact starting state
        run: |
          test "$(git rev-parse HEAD)" = "cd802d92613b64df76552c429a664bb4cbcd909c"
          test -z "$(git status --short)"
          test "$(git merge-base HEAD af9e54036658e95a8df680658be73e589efae4b4)" = "af9e54036658e95a8df680658be73e589efae4b4"
          test "$(git merge-base HEAD 26e7cc7fe9c6fc7855d2781fc2c0a539cbb1a049)" = "233e14fb17cdfa3edcf76724042d4c35fd4ae5f1"
      - run: npm ci --no-audit --no-fund
      - name: Reproduce both known defects
        shell: bash
        run: |
          set +e
          npm run app-shell-overlay:smoke
          shell_code=$?
          npm run posture-transition:smoke
          posture_code=$?
          set -e
          echo "app-shell-overlay exit code: ${shell_code}"
          echo "posture-transition exit code: ${posture_code}"
          test "${shell_code}" -ne 0
          test "${posture_code}" -ne 0

  posture-red:
    if: contains(github.event.head_commit.message, '[red]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prove the strengthened regression is red
        shell: bash
        run: |
          set +e
          npm run posture-transition:smoke
          code=$?
          set -e
          echo "posture-transition strengthened regression exit code: ${code}"
          test "${code}" -ne 0

  focused:
    if: contains(github.event.head_commit.message, '[focused]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run app-shell-overlay:smoke
      - run: npm run posture-transition:smoke
      - run: npm run infantry-combat-stage9:verify
      - name: Clean tree after focused checks
        run: test -z "$(git status --short)"

  full-matrix:
    if: contains(github.event.head_commit.message, '[verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run mandatory matrix and retain every exit code in logs
        shell: bash
        run: |
          set +e
          failures=0
          run_check() {
            label="$1"
            shift
            echo "::group::${label}"
            "$@"
            code=$?
            echo "EXIT_CODE ${label}: ${code}"
            echo "::endgroup::"
            if [ "${code}" -ne 0 ]; then failures=1; fi
          }
          run_shell() {
            label="$1"
            command="$2"
            run_check "${label}" bash -lc "${command}"
          }

          run_shell "npm ci --no-audit --no-fund" "npm ci --no-audit --no-fund"
          run_shell "git diff --check platform...HEAD" "git diff --check af9e54036658e95a8df680658be73e589efae4b4...HEAD"
          run_shell "git status --short before" "test -z \"$(git status --short)\""
          run_shell "npm run app-shell-overlay:smoke" "npm run app-shell-overlay:smoke"
          run_shell "npm run shared-game-editors:smoke" "npm run shared-game-editors:smoke"
          run_shell "npm run typecheck" "npm run typecheck"
          run_shell "npm run combat-lab-ui-contract:smoke" "npm run combat-lab-ui-contract:smoke"
          run_shell "npm run editor:smoke" "npm run editor:smoke"
          run_shell "npm run workspace-architecture-contract:smoke" "npm run workspace-architecture-contract:smoke"
          run_shell "npm run performance-contract:smoke" "npm run performance-contract:smoke"
          run_shell "npm run graph-v2:smoke" "npm run graph-v2:smoke"
          run_shell "npm run movement-profiles:smoke" "npm run movement-profiles:smoke"
          run_shell "npm run combat-catalog-editor:smoke" "npm run combat-catalog-editor:smoke"
          run_shell "npm run attention-profiles:smoke" "npm run attention-profiles:smoke"
          run_shell "npm run directional-terrain:smoke" "npm run directional-terrain:smoke"
          run_shell "npm run environment-materials:smoke" "npm run environment-materials:smoke"
          run_shell "npm run posture-transition:smoke" "npm run posture-transition:smoke"
          run_shell "npm run combat-lab-scenario-system:verify" "npm run combat-lab-scenario-system:verify"
          run_shell "npm run combat-lab-experiment:smoke" "npm run combat-lab-experiment:smoke"
          run_shell "npm run combat-lab-batch:smoke" "npm run combat-lab-batch:smoke"
          run_shell "npm run infantry-combat-stage9:verify" "npm run infantry-combat-stage9:verify"
          run_shell "npm run build" "npm run build"
          run_shell "git status --short after" "test -z \"$(git status --short)\""
          exit "${failures}"

  browser-verification:
    if: contains(github.event.head_commit.message, '[verify]')
    needs: full-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.54.2
      - run: npx playwright install --with-deps chromium
      - name: Start local production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/wave1-vite-preview.log 2>&1 &
          echo $! > /tmp/wave1-vite-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wave1-vite-preview.log
          exit 1
      - name: Verify pages, menu, focus and shared editors
        shell: bash
        run: |
          cat > scripts/.tmp-wave1-browser-verification.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const baseUrl = 'http://127.0.0.1:4173';
          const pagePaths = ['/', '/ai-node-editor.html', '/combat-lab.html'];
          const viewports = [
            { width: 1440, height: 900 },
            { width: 1100, height: 760 },
          ];
          const browser = await chromium.launch({ headless: true });
          const errors = [];

          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport });
              for (const path of pagePaths) {
                const page = await context.newPage();
                page.on('console', (message) => {
                  if (message.type() === 'error') errors.push(`${viewport.width}x${viewport.height} ${path} console: ${message.text()}`);
                });
                page.on('pageerror', (error) => errors.push(`${viewport.width}x${viewport.height} ${path} pageerror: ${error.message}`));
                page.on('requestfailed', (request) => errors.push(`${viewport.width}x${viewport.height} ${path} requestfailed: ${request.url()} ${request.failure()?.errorText ?? ''}`));

                await page.goto(`${baseUrl}${path}`, { waitUntil: 'networkidle' });
                const trigger = page.locator('[data-app-shell-menu-root="true"] .app-shell-menu-trigger');
                await trigger.waitFor({ state: 'visible' });
                assert.equal(await trigger.count(), 1, `${path}: expected one compact menu trigger`);
                assert.equal(await page.locator('body.with-app-shell-menu').count(), 0, `${path}: legacy body reservation must be absent`);
                assert.equal(await page.locator('[data-app-shell-menu-root="true"] .app-shell-mode-links').count(), 0, `${path}: mode links must not remain permanently visible`);
                assert.equal(await page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth), true, `${path}: horizontal page overflow`);

                await trigger.click();
                const dialog = page.getByRole('dialog', { name: 'Общее игровое меню Real Wargame' });
                await dialog.waitFor({ state: 'visible' });
                assert.equal(await dialog.locator('[aria-current="page"]').count(), 1, `${path}: one current mode marker expected`);
                assert.equal(await dialog.locator('.app-shell-current-marker').count(), 1, `${path}: current mode label expected`);
                assert.equal(await page.evaluate(() => {
                  const active = document.activeElement;
                  const modal = document.querySelector('[role="dialog"]');
                  return active instanceof Node && modal?.contains(active) === true;
                }), true, `${path}: focus must move inside menu`);

                const expectedPaths = ['/', '/ai-node-editor.html', '/combat-lab.html'];
                const hrefPaths = await dialog.locator('a.app-shell-mode-link').evaluateAll((links) => links.map((link) => new URL(link.href).pathname));
                assert.deepEqual(hrefPaths, expectedPaths, `${path}: mode destinations changed`);

                await page.keyboard.press('Escape');
                await dialog.waitFor({ state: 'hidden' });
                assert.equal(await trigger.evaluate((element) => document.activeElement === element), true, `${path}: focus must return to trigger`);
                await page.keyboard.press('Escape');
                await dialog.waitFor({ state: 'visible' });
                await page.keyboard.press('Escape');
                await dialog.waitFor({ state: 'hidden' });

                if (path === '/ai-node-editor.html') {
                  const tabs = page.locator('[data-game-editor-id]');
                  await tabs.first().waitFor({ state: 'visible' });
                  assert.equal(await tabs.count(), 9, 'AI editor must expose nine shared registry sections');
                  await page.evaluate(() => {
                    const graph = document.getElementById('ai-node-editor-root');
                    if (!graph) throw new Error('Graph root missing.');
                    graph.dataset.browserIdentity = 'canonical-graph-root';
                  });
                  await page.locator('[data-game-editor-id="weapons"]').click();
                  await page.locator('[data-combat-catalog-editor]').waitFor({ state: 'visible' });
                  assert.equal(await page.locator('[data-combat-catalog-editor]').count(), 1, 'one weapon catalog expected after first opening');
                  await page.locator('[data-game-editor-id="movementProfiles"]').click();
                  await page.locator('[data-game-editor-id="weapons"]').click();
                  await page.locator('[data-combat-catalog-editor]').waitFor({ state: 'visible' });
                  assert.equal(await page.locator('[data-combat-catalog-editor]').count(), 1, 'weapon editor switching must not create a second catalog');
                  await page.locator('[data-game-editor-id="behaviorGraph"]').click();
                  assert.equal(await page.evaluate(() => document.querySelectorAll('#ai-node-editor-root').length), 1, 'graph canvas root must remain singular');
                  assert.equal(await page.locator('#ai-node-editor-root').getAttribute('data-browser-identity'), 'canonical-graph-root', 'Graph v2 must retain its original canvas root');
                }

                await page.close();
              }

              for (const sourcePath of pagePaths) {
                for (const destinationPath of pagePaths) {
                  const page = await context.newPage();
                  await page.goto(`${baseUrl}${sourcePath}`, { waitUntil: 'networkidle' });
                  await page.locator('.app-shell-menu-trigger').click();
                  await Promise.all([
                    page.waitForURL((url) => url.pathname === destinationPath),
                    page.locator(`a.app-shell-mode-link[href="${destinationPath}"]`).click(),
                  ]);
                  assert.equal(new URL(page.url()).pathname, destinationPath, `${sourcePath} -> ${destinationPath} navigation failed`);
                  await page.close();
                }
              }
              await context.close();
            }

            assert.deepEqual(errors, [], `Browser errors:\n${errors.join('\n')}`);
            console.log('Wave 1 browser verification passed at 1440x900 and 1100x760.');
          } finally {
            await browser.close();
          }
          EOF
          node scripts/.tmp-wave1-browser-verification.mjs
          rm scripts/.tmp-wave1-browser-verification.mjs
      - name: Stop preview and verify clean tree
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/wave1-vite-preview.pid ]; then kill "$(cat /tmp/wave1-vite-preview.pid)" || true; fi
          rm -f scripts/.tmp-wave1-browser-verification.mjs
          test -z "$(git status --short)"
