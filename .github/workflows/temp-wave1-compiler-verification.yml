name: Temporary Wave 1 Compiler Browser Verification

on:
  push:
    branches:
      - compiler/20260801-shared-game-editors-wave1

permissions:
  contents: read

jobs:
  browser-verification:
    if: contains(github.event.head_commit.message, '[browser]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright@1.54.2
      - run: npx playwright install --with-deps chromium
      - name: Start production preview
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/wave1-vite-preview.log 2>&1 &
          echo $! > /tmp/wave1-vite-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/wave1-vite-preview.log
          exit 1
      - name: Verify pages, menu, focus and shared editors
        shell: bash
        run: |
          cat > scripts/.tmp-wave1-browser-verification.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const baseUrl = 'http://127.0.0.1:4173';
          const pagePaths = ['/', '/ai-node-editor.html', '/combat-lab.html'];
          const viewports = [
            { width: 1440, height: 900 },
            { width: 1100, height: 760 },
          ];
          const menuName = 'Общее игровое меню Real Wargame';
          const browser = await chromium.launch({ headless: true });
          const errors = [];

          function collectErrors(page, viewport, path) {
            page.on('console', (message) => {
              if (message.type() === 'error') {
                errors.push(`${viewport.width}x${viewport.height} ${path} console: ${message.text()}`);
              }
            });
            page.on('pageerror', (error) => {
              errors.push(`${viewport.width}x${viewport.height} ${path} pageerror: ${error.message}`);
            });
            page.on('requestfailed', (request) => {
              errors.push(`${viewport.width}x${viewport.height} ${path} requestfailed: ${request.url()} ${request.failure()?.errorText ?? ''}`);
            });
          }

          async function waitForMenuFocus(page) {
            await page.waitForFunction((ariaLabel) => {
              const active = document.activeElement;
              if (!(active instanceof HTMLElement)) return false;
              return active.closest(`[role="dialog"][aria-label="${ariaLabel}"]`) !== null;
            }, menuName);
          }

          async function verifyPage(context, viewport, path) {
            const page = await context.newPage();
            collectErrors(page, viewport, path);
            await page.goto(`${baseUrl}${path}`, { waitUntil: 'networkidle' });

            const trigger = page.locator('[data-app-shell-menu-root="true"] .app-shell-menu-trigger');
            await trigger.waitFor({ state: 'visible' });
            assert.equal(await trigger.count(), 1, `${path}: expected one compact menu trigger`);
            assert.equal(await page.locator('body.with-app-shell-menu').count(), 0, `${path}: legacy top reservation must be absent`);
            assert.equal(
              await page.locator('[data-app-shell-menu-root="true"] .app-shell-mode-links').count(),
              0,
              `${path}: permanent mode strip must be absent`,
            );
            assert.equal(
              await page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth),
              true,
              `${path}: horizontal overflow`,
            );

            await trigger.click();
            const dialog = page.getByRole('dialog', { name: menuName });
            await dialog.waitFor({ state: 'visible' });
            await waitForMenuFocus(page);
            assert.equal(await dialog.locator('[aria-current="page"]').count(), 1, `${path}: one current mode expected`);
            assert.equal(await dialog.locator('.app-shell-current-marker').count(), 1, `${path}: current mode marker expected`);

            const expectedPaths = ['/', '/ai-node-editor.html', '/combat-lab.html'];
            const hrefPaths = await dialog.locator('a.app-shell-mode-link').evaluateAll(
              (links) => links.map((link) => new URL(link.href).pathname),
            );
            assert.deepEqual(hrefPaths, expectedPaths, `${path}: mode destinations changed`);

            const controls = dialog.locator('button:not([disabled]), a[href]');
            const firstControl = controls.first();
            const lastControl = controls.last();
            assert.equal(
              await firstControl.evaluate((element) => document.activeElement === element),
              true,
              `${path}: initial focus must target the first menu control`,
            );
            await lastControl.focus();
            await page.keyboard.press('Tab');
            assert.equal(
              await firstControl.evaluate((element) => document.activeElement === element),
              true,
              `${path}: Tab must wrap from last to first`,
            );
            await page.keyboard.press('Shift+Tab');
            assert.equal(
              await lastControl.evaluate((element) => document.activeElement === element),
              true,
              `${path}: Shift+Tab must wrap from first to last`,
            );

            await page.keyboard.press('Escape');
            await dialog.waitFor({ state: 'hidden' });
            assert.equal(
              await trigger.evaluate((element) => document.activeElement === element),
              true,
              `${path}: closing must restore trigger focus`,
            );
            await page.keyboard.press('Escape');
            await dialog.waitFor({ state: 'visible' });
            await waitForMenuFocus(page);
            await page.keyboard.press('Escape');
            await dialog.waitFor({ state: 'hidden' });

            if (path === '/ai-node-editor.html') {
              const tabs = page.locator('[data-game-editor-id]');
              await tabs.first().waitFor({ state: 'visible' });
              assert.equal(await tabs.count(), 9, 'AI editor must expose nine shared sections');
              await page.evaluate(() => {
                const graph = document.getElementById('ai-node-editor-root');
                if (!graph) throw new Error('Graph root missing.');
                graph.dataset.browserIdentity = 'canonical-graph-root';
              });
              await page.locator('[data-game-editor-id="weapons"]').click();
              await page.locator('[data-combat-catalog-editor]').waitFor({ state: 'visible' });
              assert.equal(await page.locator('[data-combat-catalog-editor]').count(), 1, 'one weapon catalog expected');
              await page.locator('[data-game-editor-id="movementProfiles"]').click();
              await page.locator('[data-game-editor-id="weapons"]').click();
              await page.locator('[data-combat-catalog-editor]').waitFor({ state: 'visible' });
              assert.equal(
                await page.locator('[data-combat-catalog-editor]').count(),
                1,
                'switching sections must not duplicate the weapon catalog',
              );
              await page.locator('[data-game-editor-id="behaviorGraph"]').click();
              assert.equal(
                await page.evaluate(() => document.querySelectorAll('#ai-node-editor-root').length),
                1,
                'Graph v2 root must remain singular',
              );
              assert.equal(
                await page.locator('#ai-node-editor-root').getAttribute('data-browser-identity'),
                'canonical-graph-root',
                'Graph v2 must retain its original canvas root',
              );
            }

            await page.close();
          }

          async function verifyNavigation(context, viewport, sourcePath, destinationPath) {
            const page = await context.newPage();
            collectErrors(page, viewport, `${sourcePath}->${destinationPath}`);
            await page.goto(`${baseUrl}${sourcePath}`, { waitUntil: 'networkidle' });
            await page.locator('.app-shell-menu-trigger').click();
            await Promise.all([
              page.waitForURL((url) => url.pathname === destinationPath),
              page.locator(`a.app-shell-mode-link[href="${destinationPath}"]`).click(),
            ]);
            assert.equal(
              new URL(page.url()).pathname,
              destinationPath,
              `${sourcePath} -> ${destinationPath} navigation failed`,
            );
            await page.close();
          }

          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport });
              for (const path of pagePaths) await verifyPage(context, viewport, path);
              for (const sourcePath of pagePaths) {
                for (const destinationPath of pagePaths.filter((candidate) => candidate !== sourcePath)) {
                  await verifyNavigation(context, viewport, sourcePath, destinationPath);
                }
              }
              await context.close();
            }
            assert.deepEqual(errors, [], `Browser errors:\n${errors.join('\n')}`);
            console.log('Wave 1 browser verification passed at 1440x900 and 1100x760.');
          } finally {
            await browser.close();
          }
          EOF
          node scripts/.tmp-wave1-browser-verification.mjs
          rm scripts/.tmp-wave1-browser-verification.mjs
      - name: Stop preview and verify clean tree
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/wave1-vite-preview.pid ]; then kill "$(cat /tmp/wave1-vite-preview.pid)" || true; fi
          rm -f scripts/.tmp-wave1-browser-verification.mjs
          test -z "$(git status --short)"
