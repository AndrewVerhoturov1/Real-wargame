name: External deployed UI audit 2

on:
  pull_request:
    branches:
      - ci/ui-audit2-base-20260731t162000z-6220ba65

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_ORIGIN: https://repo-hba09463a-111s-projects-807221af.vercel.app
      EXPECTED_PRODUCT_SHA: 6220ba65de584239612600ae2ec025363137e09f
      CANONICAL_FEATURE_BRANCH: feature/20260731-combat-lab-user-acceptance-fixes
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Link permanent Vercel project
        run: npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Create protected deployment browser session
        shell: bash
        run: |
          set -euo pipefail
          cookie_file="$RUNNER_TEMP/vercel-cookies.txt"
          storage_state="$RUNNER_TEMP/vercel-storage-state.json"
          npx --yes vercel@56.4.1 curl /ai-node-editor.html \
            --deployment "$TARGET_ORIGIN" \
            --token="$VERCEL_TOKEN" \
            -H 'x-vercel-set-bypass-cookie: true' \
            -L \
            -c "$cookie_file" \
            -o /dev/null

          COOKIE_FILE="$cookie_file" STORAGE_STATE_FILE="$storage_state" node <<'NODE'
          const fs = require('node:fs');
          const lines = fs.readFileSync(process.env.COOKIE_FILE, 'utf8').split(/\r?\n/);
          const cookies = [];
          for (let line of lines) {
            let httpOnly = false;
            if (line.startsWith('#HttpOnly_')) {
              line = line.slice('#HttpOnly_'.length);
              httpOnly = true;
            } else if (!line || line.startsWith('#')) {
              continue;
            }
            const fields = line.split('\t');
            if (fields.length < 7) continue;
            const [domain, , path, secure, expires, name, ...valueParts] = fields;
            cookies.push({
              name,
              value: valueParts.join('\t'),
              domain,
              path: path || '/',
              expires: Number(expires) || -1,
              httpOnly,
              secure: secure === 'TRUE',
              sameSite: 'Lax',
            });
          }
          if (cookies.length === 0) throw new Error('Vercel CLI did not create a browser bypass cookie.');
          fs.writeFileSync(process.env.STORAGE_STATE_FILE, JSON.stringify({ cookies, origins: [] }));
          console.log(`Prepared ${cookies.length} protected-session cookie(s) without exposing values.`);
          NODE
          echo "PLAYWRIGHT_STORAGE_STATE=$storage_state" >> "$GITHUB_ENV"

      - name: Audit deployed editor and Combat Lab
        run: npx playwright test --config=ci/playwright.ui-audit.config.ts

      - name: Upload UI audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-ui-audit-${{ github.run_id }}
          path: |
            artifacts/vercel-ui-audit/**
            test-results/vercel-ui-audit/**
            playwright-report-ui-audit/**
          if-no-files-found: warn
          retention-days: 14
