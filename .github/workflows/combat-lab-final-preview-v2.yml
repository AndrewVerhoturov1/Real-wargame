name: Combat Lab Final Preview v2

on:
  pull_request:
    branches:
      - ci/combat-lab-final-base-20260727t0440z-5e8d45a
    types: [synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-browser-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PRODUCT_BRANCH: feature/20260726-shooting-stage-09v-combat-lab
      PRODUCT_SHA: 9f428186869564f1e76c0aafc682c573572d2d0e
      EXPECTED_VERCEL_PROJECT_NAME: repo
      EVIDENCE_DIR: artifacts/combat-lab-final
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Prove exact feature source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$PRODUCT_SHA"
          test -z "$(git status --short)"
          echo "Verified product source: $PRODUCT_BRANCH @ $PRODUCT_SHA"

      - name: Checkout temporary browser harness
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: _ci
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical Preview gate
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          npm run verify:preview -- --report "$EVIDENCE_DIR/preview-verification.json"

      - name: Build production dist
        run: npm run build

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Chromium QA at 1440x900
        shell: bash
        run: |
          set -u
          mkdir -p "$EVIDENCE_DIR"
          npm run preview -- --host 127.0.0.1 --port 4173 > "$EVIDENCE_DIR/vite-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/combat-lab.html > /dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo 'Vite preview did not become ready.' | tee "$EVIDENCE_DIR/browser.log"
            exit 1
          fi
          set +e
          PRODUCT_SHA="$PRODUCT_SHA" EVIDENCE_DIR="$EVIDENCE_DIR" node _ci/ci/combat-lab-final-qa.mjs > "$EVIDENCE_DIR/browser.log" 2>&1
          status=$?
          cat "$EVIDENCE_DIR/browser.log"
          exit $status

      - name: Re-prove exact feature HEAD before deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$PRODUCT_SHA"

      - name: Pull permanent Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify permanent Vercel project link
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          node scripts/verify_vercel_project_link.mjs
          --file .vercel/project.json
          --expected-org-id "$VERCEL_ORG_ID"
          --expected-project-id "$VERCEL_PROJECT_ID"
          --expected-project-name "$EXPECTED_VERCEL_PROJECT_NAME"

      - name: Build exact Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REAL_WARGAME_BRANCH: ${{ env.PRODUCT_BRANCH }}
          REAL_WARGAME_COMMIT_SHA: ${{ env.PRODUCT_SHA }}
        run: npx --yes vercel@56.4.1 build --token="$VERCEL_TOKEN"

      - name: Add deployment identity and verify pages
        run: |
          node scripts/write_deployment_source.mjs --root .vercel/output/static --ref "$PRODUCT_BRANCH" --sha "$PRODUCT_SHA" --report "$EVIDENCE_DIR/preview-verification.json"
          npm run verify:deployment-pages -- --root .vercel/output/static --require-source
          test -f .vercel/output/static/index.html
          test -f .vercel/output/static/ai-node-editor.html
          test -f .vercel/output/static/combat-lab.html
          test -f .vercel/output/static/deployment-source.json

      - name: Publish one prebuilt Preview
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          url="$(npx --yes vercel@56.4.1 deploy --prebuilt --yes --token="$VERCEL_TOKEN" | tail -n 1 | tr -d '\r')"
          [[ "$url" =~ ^https://[^[:space:]]+$ ]]
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Wait for READY and record deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@56.4.1 inspect "$DEPLOYMENT_URL" --wait --token="$VERCEL_TOKEN"
          host="${DEPLOYMENT_URL#https://}"
          curl --fail --silent --show-error --get "https://api.vercel.com/v13/deployments/$host" --header "Authorization: Bearer $VERCEL_TOKEN" --data-urlencode "teamId=$VERCEL_ORG_ID" --output "$EVIDENCE_DIR/vercel-response.json"
          RESPONSE="$EVIDENCE_DIR/vercel-response.json" OUTPUT="$EVIDENCE_DIR/deployment.json" node <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.RESPONSE, 'utf8'));
          if (value.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error('Wrong Vercel project.');
          if (value.readyState !== 'READY') throw new Error(`Deployment is ${value.readyState}.`);
          fs.writeFileSync(process.env.OUTPUT, JSON.stringify({ id: value.id, url: `https://${value.url}`, status: value.readyState, projectId: value.projectId }, null, 2));
          NODE

      - name: Verify published pages and exact identity
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for page in / /ai-node-editor.html /combat-lab.html; do
            npx --yes vercel@56.4.1 curl "$page" --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          done
          npx --yes vercel@56.4.1 curl /deployment-source.json --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > "$EVIDENCE_DIR/published-deployment-source.json"
          SOURCE="$EVIDENCE_DIR/published-deployment-source.json" node <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(fs.readFileSync(process.env.SOURCE, 'utf8'));
          if (value.ref !== process.env.PRODUCT_BRANCH || value.sourceSha !== process.env.PRODUCT_SHA) throw new Error('Published identity mismatch.');
          NODE

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-final-preview-${{ github.run_id }}
          path: artifacts/combat-lab-final/**
          if-no-files-found: warn
          retention-days: 14
