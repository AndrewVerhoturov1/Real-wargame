name: Combat Lab Live Screenshot 222cbd9

on:
  push:
    branches:
      - ci/combat-lab-screenshot-222cbd9

permissions:
  contents: read

concurrency:
  group: combat-lab-live-screenshot-222cbd9
  cancel-in-progress: true

jobs:
  screenshot:
    name: Verify public Preview in Chromium 1440x900
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_BRANCH: feature/20260730-combat-lab-user-acceptance-fixes
      PRODUCT_SHA: 222cbd901029751396c6891fa63c1633eb408f31
      BASE_URL: https://combat-lab-acceptance-222cbd9.vercel.app
    steps:
      - name: Checkout exact source identity
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$PRODUCT_SHA"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Chromium automation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/combat-lab-qa"
          cd "$RUNNER_TEMP/combat-lab-qa"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Capture and verify public Preview
        shell: bash
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/combat-lab-qa"
          mkdir -p "$qa/screenshots"
          cat > "$qa/qa.mjs" <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from 'playwright';

          const baseUrl = process.env.BASE_URL;
          const expectedSha = process.env.PRODUCT_SHA;
          const out = `${process.env.RUNNER_TEMP}/combat-lab-qa/screenshots`;
          const report = {
            expectedSha,
            baseUrl,
            viewport: { width: 1440, height: 900 },
            pages: {},
            consoleErrors: [],
            pageErrors: [],
            requestFailures: [],
            failure: null,
          };

          const browser = await chromium.launch({
            headless: true,
            args: ['--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'],
          });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          page.on('console', (message) => {
            if (message.type() === 'error') report.consoleErrors.push(message.text());
          });
          page.on('pageerror', (error) => report.pageErrors.push(String(error)));
          page.on('requestfailed', (request) => report.requestFailures.push({
            url: request.url(),
            method: request.method(),
            error: request.failure()?.errorText ?? 'unknown',
          }));

          async function capture(path, selector, key, screenshotName) {
            const response = await page.goto(`${baseUrl}${path}`, { waitUntil: 'domcontentloaded', timeout: 120_000 });
            if (!response || response.status() >= 400) throw new Error(`${path} returned ${response?.status() ?? 'no response'}`);
            await page.waitForSelector(selector, { state: 'attached', timeout: 120_000 });
            await page.waitForTimeout(5000);
            const state = await page.evaluate(() => ({
              title: document.title,
              url: location.href,
              viewportWidth: document.documentElement.clientWidth,
              viewportHeight: document.documentElement.clientHeight,
              scrollWidth: document.documentElement.scrollWidth,
              scrollHeight: document.documentElement.scrollHeight,
              canvasCount: document.querySelectorAll('canvas').length,
              bodyText: document.body?.innerText?.slice(0, 2000) ?? '',
            }));
            if (/Application error|Internal Server Error|404: NOT_FOUND|Log in to Vercel|Sign in to Vercel/i.test(state.bodyText)) {
              throw new Error(`${path} rendered an error/authentication page`);
            }
            await page.screenshot({ path: `${out}/${screenshotName}`, fullPage: false });
            report.pages[key] = state;
            return state;
          }

          try {
            const game = await capture('/', '#app canvas', 'game', '01-game.png');
            if (game.canvasCount < 1) throw new Error('Game page has no canvas.');

            await capture('/combat-lab.html', '#combat-lab-extension-root', 'scene', '02-combat-lab-scene.png');

            const programTab = page.locator('[data-combat-lab-tab="program"]');
            await programTab.click();
            await page.waitForTimeout(2500);
            await page.screenshot({ path: `${out}/03-combat-lab-program.png`, fullPage: false });
            report.pages.program = await page.evaluate(() => ({ title: document.title, url: location.href, bodyText: document.body.innerText.slice(0, 2000) }));

            const parametersTab = page.locator('[data-combat-lab-tab="parameters"]');
            await parametersTab.click();
            await page.waitForTimeout(2500);
            await page.screenshot({ path: `${out}/04-combat-lab-parameters.png`, fullPage: false });
            report.pages.parameters = await page.evaluate(() => ({ title: document.title, url: location.href, bodyText: document.body.innerText.slice(0, 2000) }));

            await capture('/ai-node-editor.html', 'body', 'aiEditor', '05-ai-node-editor.png');

            const sourceResponse = await context.request.get(`${baseUrl}/deployment-source.json`);
            if (sourceResponse.status() !== 200) throw new Error(`deployment-source.json returned ${sourceResponse.status()}`);
            const source = await sourceResponse.json();
            if (source.sourceSha !== expectedSha || source.verificationStatus !== 'passed') {
              throw new Error(`Deployment identity mismatch: ${JSON.stringify(source)}`);
            }
            report.deploymentSource = source;
          } catch (error) {
            report.failure = error instanceof Error ? { name: error.name, message: error.message, stack: error.stack } : String(error);
            try { await page.screenshot({ path: `${out}/99-failure.png`, fullPage: false }); } catch {}
          } finally {
            await writeFile(`${out}/qa-report.json`, `${JSON.stringify(report, null, 2)}\n`);
            await browser.close();
          }

          if (report.failure) {
            console.error(JSON.stringify(report.failure, null, 2));
            process.exit(1);
          }
          console.log(`Chromium public Preview verification passed for ${expectedSha}.`);
          NODE
          cd "$qa"
          node qa.mjs

      - name: Upload screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-public-screenshots-222cbd9
          path: ${{ runner.temp }}/combat-lab-qa/screenshots
          if-no-files-found: error
          retention-days: 7
