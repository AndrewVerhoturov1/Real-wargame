name: Combat Lab Live Screenshot 222cbd9

on:
  push:
    branches:
      - ci/combat-lab-screenshot-222cbd9

permissions:
  contents: read

concurrency:
  group: combat-lab-live-screenshot-222cbd9
  cancel-in-progress: true

jobs:
  screenshot:
    name: Verify live Preview in Chromium 1440x900
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT_BRANCH: feature/20260730-combat-lab-user-acceptance-fixes
      PRODUCT_SHA: 222cbd901029751396c6891fa63c1633eb408f31
      BASE_URL: https://repo-foqlr0dj9-111s-projects-807221af.vercel.app
      SHARE_URL: https://repo-foqlr0dj9-111s-projects-807221af.vercel.app/?_vercel_share=4Z4BW1lnOV5NcCyg2rxF1LEvr21ssegM
    steps:
      - name: Checkout exact source identity
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRODUCT_SHA"
          test "$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')" = "$PRODUCT_SHA"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Chromium automation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/combat-lab-qa"
          cd "$RUNNER_TEMP/combat-lab-qa"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Capture and verify live Preview
        shell: bash
        run: |
          set -euo pipefail
          qa="$RUNNER_TEMP/combat-lab-qa"
          mkdir -p "$qa/screenshots"
          cat > "$qa/qa.mjs" <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import { chromium } from 'playwright';

          const baseUrl = process.env.BASE_URL;
          const shareUrl = process.env.SHARE_URL;
          const expectedSha = process.env.PRODUCT_SHA;
          const out = `${process.env.RUNNER_TEMP}/combat-lab-qa/screenshots`;
          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          const page = await context.newPage();
          const consoleErrors = [];
          const pageErrors = [];
          page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
          page.on('pageerror', (error) => pageErrors.push(String(error)));

          async function goto(path, waitSelector, screenshotName) {
            const response = await page.goto(`${baseUrl}${path}`, { waitUntil: 'domcontentloaded', timeout: 120_000 });
            if (!response || response.status() >= 400) throw new Error(`${path} returned ${response?.status() ?? 'no response'}`);
            if (waitSelector) await page.waitForSelector(waitSelector, { timeout: 120_000 });
            await page.waitForTimeout(2500);
            const metrics = await page.evaluate(() => ({
              title: document.title,
              url: location.href,
              viewportWidth: document.documentElement.clientWidth,
              viewportHeight: document.documentElement.clientHeight,
              scrollWidth: document.documentElement.scrollWidth,
              scrollHeight: document.documentElement.scrollHeight,
              bodyText: document.body.innerText.slice(0, 1000),
            }));
            if (/Application error|Internal Server Error|404: NOT_FOUND/i.test(metrics.bodyText)) throw new Error(`${path} rendered an error page`);
            await page.screenshot({ path: `${out}/${screenshotName}`, fullPage: false });
            return metrics;
          }

          const authResponse = await page.goto(shareUrl, { waitUntil: 'domcontentloaded', timeout: 120_000 });
          if (!authResponse || authResponse.status() >= 400) throw new Error(`Share authorization failed: ${authResponse?.status() ?? 'no response'}`);
          await page.waitForTimeout(2000);

          const report = { expectedSha, viewport: { width: 1440, height: 900 }, pages: {}, consoleErrors, pageErrors };
          report.pages.game = await goto('/', '#app canvas', '01-game.png');
          report.pages.scene = await goto('/combat-lab.html', '#combat-lab-extension-root, [data-combat-lab-extension="active"]', '02-combat-lab-scene.png');

          const programTab = page.locator('[data-combat-lab-tab="program"]');
          await programTab.click();
          await page.waitForTimeout(1200);
          await page.screenshot({ path: `${out}/03-combat-lab-program.png`, fullPage: false });

          const parametersTab = page.locator('[data-combat-lab-tab="parameters"]');
          await parametersTab.click();
          await page.waitForTimeout(1200);
          await page.screenshot({ path: `${out}/04-combat-lab-parameters.png`, fullPage: false });

          report.pages.aiEditor = await goto('/ai-node-editor.html', 'body', '05-ai-node-editor.png');

          const sourceResponse = await context.request.get(`${baseUrl}/deployment-source.json`);
          if (sourceResponse.status() !== 200) throw new Error(`deployment-source.json returned ${sourceResponse.status()}`);
          const source = await sourceResponse.json();
          if (source.sourceSha !== expectedSha || source.verificationStatus !== 'passed') {
            throw new Error(`Deployment identity mismatch: ${JSON.stringify(source)}`);
          }
          report.deploymentSource = source;
          report.finalConsoleErrors = consoleErrors;
          report.finalPageErrors = pageErrors;
          await writeFile(`${out}/qa-report.json`, `${JSON.stringify(report, null, 2)}\n`);
          await browser.close();
          NODE
          cd "$qa"
          node qa.mjs

      - name: Upload screenshots and QA report
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-live-screenshots-222cbd9
          path: ${{ runner.temp }}/combat-lab-qa/screenshots
          if-no-files-found: error
          retention-days: 7
