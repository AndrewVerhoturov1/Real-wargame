name: Polygon Editors Visual Audit

on:
  pull_request:
    branches:
      - ci/polygon-editors-visual-audit-base-20260817t2018z-13a70b7

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_URL: https://repo-6j98j2x3u-111s-projects-807221af.vercel.app/combat-lab.html
      EXPECTED_PRODUCT_SHA: 13a70b76bd5087b87c0767970eb378ba192a1b49
      CANONICAL_FEATURE_BRANCH: feat/20260817-polygon-editors-visual-parity
    steps:
      - name: Checkout temporary CI merge
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real deployment visual audit
        run: npx playwright test --config=ci/playwright.polygon-editors-visual-audit.config.ts

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polygon-editors-deployment-visual-audit-${{ github.run_id }}
          path: |
            artifacts/polygon-editors-visual-audit/**
            test-results/polygon-editors-visual-audit/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
