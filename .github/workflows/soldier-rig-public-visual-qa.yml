name: Soldier Rig Public Visual QA

on:
  pull_request:
    branches:
      - ci/soldier-rig-visual-base-20260809-18364bb

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET_URL: https://repo-f633gr6zk-111s-projects-807221af.vercel.app
      EXPECTED_PRODUCT_SHA: 18364bb8cbd723d5c5d2c4f23594aec816fe65f5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deployed visual QA
        run: npx playwright test --config=ci/playwright.soldier-rig-public.config.ts
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soldier-rig-public-visual-${{ github.run_id }}
          path: |
            artifacts/soldier-rig-public/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
