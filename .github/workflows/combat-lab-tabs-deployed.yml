name: Combat Lab deployed tabs visual inspection

on:
  pull_request:
    branches:
      - ci/combat-lab-tabs-base-20260810t212500z-317fa1f3

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://repo-or86iaie7-111s-projects-807221af.vercel.app/combat-lab.html
      EXPECTED_PRODUCT_SHA: 317fa1f3db60cdc605dfe3e1c2c0f13940a6d282
      CANONICAL_FEATURE_BRANCH: feature/20260805-map-diorama-prototype
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspect deployed Combat Lab tabs
        run: npx playwright test --config=ci/playwright.combat-lab-tabs.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-tabs-evidence-${{ github.run_id }}
          path: |
            artifacts/vercel-e2e/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
