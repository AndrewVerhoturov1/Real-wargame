name: Combat Lab Baseline Visual QA

on:
  pull_request:
    branches:
      - ci/combat-lab-baseline-base-20260727t123000z-672e272

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://repo-776uuc2hx-111s-projects-807221af.vercel.app/combat-lab.html
      EXPECTED_PRODUCT_SHA: 672e272fd57b1424a6663c08f16facc49f6ebaa4
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run deployed Combat Lab scenario
        run: npx playwright test --config=ci/playwright.combat-lab-baseline.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-baseline-evidence-${{ github.run_id }}
          path: |
            artifacts/vercel-e2e/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
