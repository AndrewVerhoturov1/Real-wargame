name: Apply Combat Lab six-fix patch

on:
  push:
    branches:
      - feature/20260726-shooting-stage-09v-combat-lab
    paths:
      - .github/workflows/apply-combat-lab-six-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: feature/20260726-shooting-stage-09v-combat-lab
      - name: Verify exact base
        run: |
          test "$(git rev-parse HEAD^)" = "cc69a60f0724ab3292c3bcef13787197922814cc"
      - name: Apply exact patch and self-clean
        shell: bash
        run: |
          cat > /tmp/fixes.patch.gz.b64 <<'PATCH'
          
          PATCH
          base64 --decode /tmp/fixes.patch.gz.b64 | gzip -d > /tmp/fixes.patch
          git apply --check /tmp/fixes.patch
          git apply /tmp/fixes.patch
          rm .github/workflows/apply-combat-lab-six-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: correct Combat Lab prone targets and UI"
          git push origin HEAD:feature/20260726-shooting-stage-09v-combat-lab
