name: Shared Game Editors Verification

on:
  push:
    branches:
      - worker/20260731-shared-game-editor-platform

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run required verification
        shell: bash
        run: |
          set +e
          REPORT=.shared-game-editors-verification.txt
          : > "$REPORT"
          echo "commit=$GITHUB_SHA" >> "$REPORT"
          echo "runner_node=$(node --version)" >> "$REPORT"
          echo "runner_npm=$(npm --version)" >> "$REPORT"

          run_check() {
            local name="$1"
            shift
            local log="/tmp/${name//[:\/ ]/_}.log"
            echo "" >> "$REPORT"
            echo "## $name" >> "$REPORT"
            "$@" >"$log" 2>&1
            local code=$?
            echo "exit=$code" >> "$REPORT"
            if [ "$code" -ne 0 ]; then
              echo "--- output tail ---" >> "$REPORT"
              tail -n 120 "$log" >> "$REPORT"
              echo "--- end output tail ---" >> "$REPORT"
            fi
            return 0
          }

          run_check "npm ci --no-audit --no-fund" npm ci --no-audit --no-fund
          if grep -q '^exit=0$' "$REPORT"; then
            run_check "npm run typecheck" npm run typecheck
            run_check "npm run shared-game-editors:smoke" npm run shared-game-editors:smoke
            run_check "npm run editor:smoke" npm run editor:smoke
            run_check "npm run graph-v2:smoke" npm run graph-v2:smoke
            run_check "npm run movement-profiles:smoke" npm run movement-profiles:smoke
            run_check "npm run combat-catalog-editor:smoke" npm run combat-catalog-editor:smoke
            run_check "npm run attention-profiles:smoke" npm run attention-profiles:smoke
            run_check "npm run directional-terrain:smoke" npm run directional-terrain:smoke
            run_check "npm run environment-materials:smoke" npm run environment-materials:smoke
            run_check "npm run build" npm run build
          else
            echo "dependency installation failed; remaining commands skipped" >> "$REPORT"
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT"
          git commit -m "chore: record shared editor verification [skip ci]"
          git push
