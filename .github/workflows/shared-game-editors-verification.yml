name: Shared Game Editors Verification

on:
  push:
    branches:
      - worker/20260731-shared-game-editor-platform

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update migrated source contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected source contract in {path}: {old!r}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'scripts/shared_game_editor_platform_smoke.mjs',
              "'const graphRoot = document.getElementById'",
              "'const graphRootElement = document.getElementById'",
          )
          replace(
              'scripts/ai_node_editor_smoke.mjs',
              "for (const needle of ['Тактические позиции', 'TACTICAL_POSITION_SETTINGS_GROUPS'",
              "for (const needle of ['Профили позиций', 'TACTICAL_POSITION_SETTINGS_GROUPS'",
          )
          replace(
              'scripts/attention_profiles_smoke.ts',
              "assert.match(visibilityFieldSource, /let currentVisibilityQuality = 0/);",
              "assert.match(visibilityFieldSource, /const quality = new Uint8Array/);\nassert.match(visibilityFieldSource, /zone\\[localIndex\\] = VISIBILITY_ZONE_CODE\\.unseen/);",
          )

          environment = Path('scripts/environment_materials_smoke.ts')
          text = environment.read_text(encoding='utf-8')
          old = """const sectionRegistrySource = readFileSync('src/ai-node-editor/AiEditorSectionRegistry.ts', 'utf8');
const environmentIntegrationSource = readFileSync('src/ai-node-editor/EnvironmentProfileEditorIntegration.ts', 'utf8');
const movementIntegrationSource = readFileSync('src/ai-node-editor/MovementProfileEditorIntegration.ts', 'utf8');
"""
          new = """const sharedRegistrySource = readFileSync('src/game-editors/createDefaultGameEditorRegistry.ts', 'utf8');
const environmentIntegrationSource = readFileSync('src/ai-node-editor/EnvironmentProfileEditorIntegration.ts', 'utf8');
const movementIntegrationSource = readFileSync('src/ai-node-editor/MovementProfileEditorIntegration.ts', 'utf8');
"""
          if old not in text:
              raise SystemExit('missing environment editor registry source block')
          text = text.replace(old, new)
          old = """assert.match(environmentIntegrationSource, /labelRu:\\s*'Профили местности'/, 'environment editor must register through the shared section registry');
assert.match(environmentIntegrationSource, /order:\\s*25/, 'environment editor must sit between route and movement profiles');
assert.match(movementIntegrationSource, /order:\\s*30/, 'movement editor must follow environment profiles');
assert.match(sectionRegistrySource, /\\['profiles',\\s*'Профили маршрута',\\s*20\\]/, 'the legacy profiles tab must be labelled as route profiles');
assert.match(sectionRegistrySource, /\\['attentionProfiles',\\s*'Профили внимания',\\s*40\\]/);
assert.match(sectionRegistrySource, /\\['blackboard',\\s*'Данные бойца',\\s*50\\]/);
"""
          new = """assert.match(environmentIntegrationSource, /mountEnvironmentProfileEditor/, 'environment editor must expose a direct mount');
assert.match(environmentIntegrationSource, /const panel = context\\.host/, 'environment editor must mount into the supplied host');
assert.match(movementIntegrationSource, /mountMovementProfileEditor/, 'movement editor must expose a direct mount');
assert.doesNotMatch(environmentIntegrationSource, /registerAiEditorSection|AiEditorSectionRegistry/);
assert.doesNotMatch(movementIntegrationSource, /registerAiEditorSection|AiEditorSectionRegistry/);
assert.match(sharedRegistrySource, /id:\\s*'routeProfiles'[\\s\\S]*labelRu:\\s*'Профили маршрута'/);
assert.match(sharedRegistrySource, /id:\\s*'attentionProfiles'[\\s\\S]*labelRu:\\s*'Профили внимания'/);
assert.match(sharedRegistrySource, /id:\\s*'soldierData'[\\s\\S]*labelRu:\\s*'Данные бойца'/);
"""
          if old not in text:
              raise SystemExit('missing environment legacy registry assertions')
          environment.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Run required verification
        shell: bash
        run: |
          set +e
          REPORT=.shared-game-editors-verification.txt
          : > "$REPORT"
          echo "commit=$GITHUB_SHA" >> "$REPORT"
          echo "runner_node=$(node --version)" >> "$REPORT"
          echo "runner_npm=$(npm --version)" >> "$REPORT"

          run_check() {
            local name="$1"
            shift
            local log="/tmp/${name//[:\/ ]/_}.log"
            echo "" >> "$REPORT"
            echo "## $name" >> "$REPORT"
            "$@" >"$log" 2>&1
            local code=$?
            echo "exit=$code" >> "$REPORT"
            if [ "$code" -ne 0 ]; then
              echo "--- output tail ---" >> "$REPORT"
              tail -n 120 "$log" >> "$REPORT"
              echo "--- end output tail ---" >> "$REPORT"
            fi
            return 0
          }

          run_check "npm ci --no-audit --no-fund" npm ci --no-audit --no-fund
          if grep -q '^exit=0$' "$REPORT"; then
            run_check "npm run typecheck" npm run typecheck
            run_check "npm run shared-game-editors:smoke" npm run shared-game-editors:smoke
            run_check "npm run editor:smoke" npm run editor:smoke
            run_check "npm run graph-v2:smoke" npm run graph-v2:smoke
            run_check "npm run movement-profiles:smoke" npm run movement-profiles:smoke
            run_check "npm run combat-catalog-editor:smoke" npm run combat-catalog-editor:smoke
            run_check "npm run attention-profiles:smoke" npm run attention-profiles:smoke
            run_check "npm run directional-terrain:smoke" npm run directional-terrain:smoke
            run_check "npm run environment-materials:smoke" npm run environment-materials:smoke
            run_check "npm run build" npm run build
          else
            echo "dependency installation failed; remaining commands skipped" >> "$REPORT"
          fi

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test(editors): align migrated contracts and record verification [skip ci]"
          git push
