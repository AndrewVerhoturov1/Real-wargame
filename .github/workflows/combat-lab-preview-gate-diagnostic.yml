name: Combat Lab Preview Gate Diagnostic

on:
  pull_request:
    branches:
      - ci/combat-lab-camera-aim-tdd-base-20260727
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact product commit
        uses: actions/checkout@v4
        with:
          ref: 8cbad1df40eeb2699d9c2cf97866dabdacb89666
          fetch-depth: 0
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Capture Preview verification gate
        id: gate
        shell: bash
        run: |
          set +e
          report="$RUNNER_TEMP/preview-verification.json"
          npm run verify:preview -- --report "$report" > "$RUNNER_TEMP/preview-gate.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/preview-gate.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Preview gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-preview-gate-diagnostic
          path: |
            ${{ runner.temp }}/preview-gate.log
            ${{ runner.temp }}/preview-verification.json
      - name: Require Preview gate success
        run: test "${{ steps.gate.outputs.status }}" -eq 0
