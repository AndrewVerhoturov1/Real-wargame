name: CI Polygon Editor Exact Preview Deploy

on:
  pull_request:
    branches:
      - ci/polygon-editor-deploy-base-20260817t1056z-0792cae

permissions:
  contents: read

concurrency:
  group: ci-polygon-editor-exact-deploy-13a70b7
  cancel-in-progress: false

jobs:
  preview:
    name: Verify and publish exact Polygon editors Preview
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_VERCEL_PROJECT_NAME: repo
      PRODUCT_REF: feat/20260817-polygon-editors-visual-parity
      PRODUCT_SHA: 13a70b76bd5087b87c0767970eb378ba192a1b49
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: 13a70b76bd5087b87c0767970eb378ba192a1b49
          fetch-depth: 0

      - name: Verify exact product source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Product ref: $PRODUCT_REF"
          echo "Checked out SHA: $actual_sha"
          test "$actual_sha" = "$PRODUCT_SHA"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical Preview gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/preview-verification.json"
          npm run verify:preview -- --report "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Pull permanent Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify permanent Vercel project link
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          node scripts/verify_vercel_project_link.mjs
          --file .vercel/project.json
          --expected-org-id "$VERCEL_ORG_ID"
          --expected-project-id "$VERCEL_PROJECT_ID"
          --expected-project-name "$EXPECTED_VERCEL_PROJECT_NAME"

      - name: Build exact Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REAL_WARGAME_BRANCH: ${{ env.PRODUCT_REF }}
          REAL_WARGAME_COMMIT_SHA: ${{ env.PRODUCT_SHA }}
        run: npx --yes vercel@56.4.1 build --token="$VERCEL_TOKEN"

      - name: Add exact deployment identity
        run: >-
          node scripts/write_deployment_source.mjs
          --root .vercel/output/static
          --ref "$PRODUCT_REF"
          --sha "$PRODUCT_SHA"
          --report "${{ steps.gate.outputs.report }}"

      - name: Verify prebuilt output pages
        run: npm run verify:deployment-pages -- --root .vercel/output/static --require-source

      - name: Publish one prebuilt Preview deployment
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@56.4.1 deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          [[ "$deployment_url" =~ ^https://[^[:space:]]+$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Wait for READY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          npx --yes vercel@56.4.1 inspect "${{ steps.deploy.outputs.url }}"
          --wait --token="$VERCEL_TOKEN"

      - name: Verify published pages and exact identity
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@56.4.1 curl / --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /ai-node-editor.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          source_file="$RUNNER_TEMP/published-deployment-source.json"
          npx --yes vercel@56.4.1 curl /deployment-source.json --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > "$source_file"
          SOURCE_FILE="$source_file" node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8'));
          if (source.ref !== process.env.PRODUCT_REF || source.sourceSha !== process.env.PRODUCT_SHA) {
            throw new Error(`Published deployment identity mismatch: ${source.ref} @ ${source.sourceSha}`);
          }
          NODE

      - name: Write clean deployment result
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          mkdir -p artifacts/deploy
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('artifacts/deploy/result.json', JSON.stringify({
            url: process.env.DEPLOYMENT_URL,
            ref: process.env.PRODUCT_REF,
            sha: process.env.PRODUCT_SHA,
            status: 'READY'
          }, null, 2));
          NODE

      - name: Upload deployment result
        uses: actions/upload-artifact@v4
        with:
          name: polygon-editors-exact-deploy-${{ github.run_id }}
          path: artifacts/deploy/result.json
          retention-days: 14
