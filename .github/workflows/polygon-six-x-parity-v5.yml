name: Polygon six-X parity visual audit v5

on:
  pull_request:
    branches:
      - ci/polygon-six-x-parity-v5-base-20260817t0908z-d0aa755

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://repo-ffinqnfmm-111s-projects-807221af.vercel.app/combat-lab.html
      EXPECTED_PRODUCT_SHA: d0aa7557cbbca4350b22ed90b6353a0bcd537a25
      CANONICAL_FEATURE_BRANCH: feature/20260817-polygon-six-x-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture exact deployed Polygon parity states
        run: npx playwright test --config=ci/playwright.polygon-six-x-parity-v5.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polygon-six-x-parity-v5-${{ github.run_id }}
          path: |
            artifacts/vercel-e2e/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
