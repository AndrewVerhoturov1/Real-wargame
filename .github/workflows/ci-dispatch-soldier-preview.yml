name: CI Exact Soldier Preview

on:
  pull_request:
    branches:
      - ci/20260809-soldier-deploy-base
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-exact-soldier-preview-88eb2c2e059c523d7f9bb64b01e0ff1b00edf3f5
  cancel-in-progress: false

jobs:
  exact-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET_REF: feature/20260808-soldier-topdown-appearance-codex
      EXPECTED_SHA: 88eb2c2e059c523d7f9bb64b01e0ff1b00edf3f5
      EXPECTED_VERCEL_PROJECT_NAME: repo
    steps:
      - name: Checkout exact feature ref
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0

      - name: Verify exact source before installation
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Requested ref: $TARGET_REF"
          echo "Expected SHA: $EXPECTED_SHA"
          echo "Checked out SHA: $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"
          git fetch --no-tags origin main:refs/remotes/origin/main real-wargame-preview:refs/remotes/origin/real-wargame-preview
          test "$actual_sha" != "$(git rev-parse refs/remotes/origin/main)"
          test "$actual_sha" != "$(git rev-parse refs/remotes/origin/real-wargame-preview)"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused soldier prototype check
        run: node scripts/soldier_topdown_prototype_smoke.mjs

      - name: Run TypeScript
        run: npm run typecheck

      - name: Run production build
        run: npm run build

      - name: Run canonical Preview verification gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/preview-verification.json"
          npm run verify:preview -- --report "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Pull permanent Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify permanent Vercel project link
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          node scripts/verify_vercel_project_link.mjs
          --file .vercel/project.json
          --expected-org-id "$VERCEL_ORG_ID"
          --expected-project-id "$VERCEL_PROJECT_ID"
          --expected-project-name "$EXPECTED_VERCEL_PROJECT_NAME"

      - name: Build Vercel output once
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REAL_WARGAME_BRANCH: ${{ env.TARGET_REF }}
          REAL_WARGAME_COMMIT_SHA: ${{ env.EXPECTED_SHA }}
        run: npx --yes vercel@56.4.1 build --token="$VERCEL_TOKEN"

      - name: Add exact deployment identity
        run: >-
          node scripts/write_deployment_source.mjs
          --root .vercel/output/static
          --ref "$TARGET_REF"
          --sha "$EXPECTED_SHA"
          --report "${{ steps.gate.outputs.report }}"

      - name: Verify prebuilt output pages
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:deployment-pages -- --root .vercel/output/static --require-source
          test -f .vercel/output/static/soldier-topdown-prototype.html

      - name: Publish one prebuilt Preview deployment
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@56.4.1 deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          [[ "$deployment_url" =~ ^https://[^[:space:]]+$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $deployment_url"

      - name: Wait for READY and inspect deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@56.4.1 inspect "${{ steps.deploy.outputs.url }}" --wait --token="$VERCEL_TOKEN"

      - name: Verify published pages and exact identity
        id: published
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          response="$RUNNER_TEMP/vercel-deployment.json"
          curl --fail --silent --show-error --get \
            --url "https://api.vercel.com/v13/deployments/$deployment_host" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --data-urlencode "teamId=$VERCEL_ORG_ID" \
            --output "$response"
          RESPONSE="$response" node <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.env.RESPONSE, 'utf8'));
          if (d.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error('wrong permanent Vercel project');
          if (d.readyState !== 'READY') throw new Error(`deployment not READY: ${d.readyState}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `id=${d.id}\nstatus=${d.readyState}\n`);
          NODE
          npx --yes vercel@56.4.1 curl / --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /ai-node-editor.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /soldier-topdown-prototype.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          source_file="$RUNNER_TEMP/published-deployment-source.json"
          npx --yes vercel@56.4.1 curl /deployment-source.json --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > "$source_file"
          SOURCE_FILE="$source_file" node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8'));
          if (source.ref !== process.env.TARGET_REF || source.sourceSha !== process.env.EXPECTED_SHA) {
            throw new Error(`deployment identity mismatch: ${source.ref} @ ${source.sourceSha}`);
          }
          NODE
          mkdir -p artifacts/exact-preview
          cp "$source_file" artifacts/exact-preview/deployment-source.json
          cp "${{ steps.gate.outputs.report }}" artifacts/exact-preview/preview-verification.json
          cp "$response" artifacts/exact-preview/vercel-deployment.json
          printf '%s\n' "$DEPLOYMENT_URL" > artifacts/exact-preview/preview-url.txt

      - name: Upload exact Preview evidence
        uses: actions/upload-artifact@v4
        with:
          name: exact-soldier-preview-${{ env.EXPECTED_SHA }}
          path: artifacts/exact-preview
          if-no-files-found: error
          retention-days: 14

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Exact Soldier Preview'
            echo
            echo "- product ref: $TARGET_REF"
            echo "- product SHA: $EXPECTED_SHA"
            echo "- deployment URL: ${{ steps.deploy.outputs.url }}"
            echo "- deployment ID: ${{ steps.published.outputs.id }}"
            echo "- Vercel status: ${{ steps.published.outputs.status }}"
            echo '- focused check: `node scripts/soldier_topdown_prototype_smoke.mjs`'
            echo '- TypeScript: `npm run typecheck`'
            echo '- production build: `npm run build`'
            echo '- canonical gate: `npm run verify:preview -- --report ...`'
          } >> "$GITHUB_STEP_SUMMARY"
