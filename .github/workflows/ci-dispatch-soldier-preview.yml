name: CI Dispatch Soldier Preview

on:
  pull_request:
    branches:
      - ci/20260809-soldier-deploy-base
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TARGET_REF: feature/20260808-soldier-topdown-appearance-codex
      EXPECTED_SHA: 88eb2c2e059c523d7f9bb64b01e0ff1b00edf3f5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch canonical manual Preview workflow
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(node -e 'console.log(JSON.stringify({ref:process.env.TARGET_REF,inputs:{ref:process.env.TARGET_REF,expected_sha:process.env.EXPECTED_SHA,allow_main:"false",allow_skipped_checks:"false",skip_reason:""}}))')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/manual-vercel-preview.yml/dispatches" \
            --data "$payload"
          echo "Dispatched canonical workflow for ${TARGET_REF} @ ${EXPECTED_SHA}"

          run_id=""
          for attempt in $(seq 1 30); do
            runs="$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/manual-vercel-preview.yml/runs?event=workflow_dispatch&branch=${TARGET_REF}&per_page=20")"
            run_id="$(RUNS="$runs" STARTED_AT="$started_at" node <<'NODE'
          const data = JSON.parse(process.env.RUNS);
          const started = Date.parse(process.env.STARTED_AT);
          const match = (data.workflow_runs || []).find((run) =>
            run.head_sha === process.env.EXPECTED_SHA && Date.parse(run.created_at) >= started - 5000
          );
          if (match) process.stdout.write(String(match.id));
          NODE
            )"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 4
          done
          if [[ -z "$run_id" ]]; then
            echo "Unable to locate dispatched workflow run." >&2
            exit 1
          fi
          echo "Canonical workflow run ID: $run_id"
          echo "Canonical workflow URL: https://github.com/${GITHUB_REPOSITORY}/actions/runs/$run_id"

          for attempt in $(seq 1 180); do
            run="$(curl --fail --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id")"
            read -r status conclusion url <<<"$(RUN="$run" node <<'NODE'
          const run = JSON.parse(process.env.RUN);
          process.stdout.write(`${run.status || ''} ${run.conclusion || '-'} ${run.html_url || ''}`);
          NODE
            )"
            echo "manual-preview status=$status conclusion=$conclusion"
            if [[ "$status" == "completed" ]]; then
              echo "Manual Preview final URL: $url"
              if [[ "$conclusion" != "success" ]]; then
                jobs="$(curl --fail --silent --show-error \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer $GH_TOKEN" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/jobs?per_page=100")"
                JOBS="$jobs" node <<'NODE'
          const data = JSON.parse(process.env.JOBS);
          for (const job of data.jobs || []) {
            console.log(`job ${job.id}: ${job.name} = ${job.conclusion}`);
            for (const step of job.steps || []) console.log(`  step: ${step.name} = ${step.conclusion}`);
          }
          NODE
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for canonical Preview workflow." >&2
          exit 1
