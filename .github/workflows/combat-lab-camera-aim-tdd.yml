name: Combat Lab Camera Aim TDD

on:
  pull_request_target:
    branches:
      - ci/combat-lab-camera-aim-tdd-base-20260727
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve current product head
        id: source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/AndrewVerhoturov1/Real-wargame.git refs/heads/feature/20260726-shooting-stage-09v-combat-lab | awk '{print $1}')"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Testing product SHA: $sha"
      - name: Checkout product source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Run camera and aim regression
        run: node scripts/combat_lab_camera_aim_regression_smoke.mjs
