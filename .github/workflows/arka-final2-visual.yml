name: ARKA Final Exact Shell Visual QA 2

on:
  pull_request:
    branches:
      - ci/arka-final2-base-20260816-4df2bc2

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://repo-eai0l1oxa-111s-projects-807221af.vercel.app/combat-lab.html
      EXPECTED_PRODUCT_SHA: 4df2bc2f9f91ab58af48331ff8f0dbffc43ec2d4
      CANONICAL_FEATURE_BRANCH: feature/20260816-polygon-arka-exact-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run final exact Polygon shell scenario
        run: npx playwright test --config=ci/playwright.arka-final2-shell.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arka-final2-shell-visual-evidence-${{ github.run_id }}
          path: |
            artifacts/vercel-e2e/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
