name: Temporary Shared Editors Layout Contract Fix

on:
  push:
    branches:
      - compiler/20260731-shared-game-editors-integration

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[layout-contract-fix]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Update canonical Combat Lab layout contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/combat_lab_workspace_layout_smoke.mjs')
          source = path.read_text(encoding='utf-8')
          old_tabs = "for (const tabId of ['scene', 'program', 'batch', 'parameters', 'metrics', 'journal']) {\n"
          new_tabs = "for (const tabId of ['scene', 'program', 'batch', 'parameters', 'settings', 'metrics', 'journal']) {\n"
          if source.count(old_tabs) != 1:
              raise SystemExit('workspace layout smoke: tab list marker missing')
          source = source.replace(old_tabs, new_tabs, 1)
          old_count = "assert.equal((workspaceHosts.match(/tabId:/g) ?? []).length, 6, 'Combat Lab must expose exactly six workspace tabs.');\n"
          new_count = "assert.equal((workspaceHosts.match(/tabId:/g) ?? []).length, 7, 'Combat Lab must expose six Stage 10 tabs plus game settings.');\n"
          if source.count(old_count) != 1:
              raise SystemExit('workspace layout smoke: tab count marker missing')
          path.write_text(source.replace(old_count, new_count, 1), encoding='utf-8')
          PY
      - name: Run focused gate
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          node scripts/combat_lab_workspace_layout_smoke.mjs
          npm run combat-lab-scenario-system:verify
          npm run verify:preview -- --report /tmp/shared-editors-layout-preview.json
          npm run build
      - name: Commit permanent correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/combat_lab_workspace_layout_smoke.mjs
          git commit -m "test(combat-lab): include game settings in layout contract"
          git push origin HEAD:compiler/20260731-shared-game-editors-integration
