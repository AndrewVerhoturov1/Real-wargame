name: ARKA Exact Shell Full Verify 1deccfb

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run Preview verification gate
        run: npm run verify:preview -- --report /tmp/arka-preview-verification.json
      - name: Build production app
        run: npm run build:app
