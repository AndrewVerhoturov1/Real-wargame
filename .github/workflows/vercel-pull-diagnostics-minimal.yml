name: Vercel Pull Diagnostics Minimal

on:
  pull_request:
    branches:
      - feature/20260726-shooting-stage-09v-combat-lab
    paths:
      - .github/workflows/vercel-pull-diagnostics-minimal.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe secrets and Vercel pull
        continue-on-error: true
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -o pipefail
          {
            for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
              if [[ -n "${!variable:-}" ]]; then
                echo "$variable=present"
              else
                echo "$variable=missing"
              fi
            done
            set +e
            npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN" 2>&1
            status="$?"
            set -e
            echo "vercel_pull_exit=$status"
            exit "$status"
          } 2>&1 | tee /tmp/vercel-pull-diagnostics.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-pull-diagnostics-minimal
          path: /tmp/vercel-pull-diagnostics.log
          retention-days: 7
