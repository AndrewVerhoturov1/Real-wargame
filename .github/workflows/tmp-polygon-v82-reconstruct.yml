name: Temporary Polygon Laboratory v1 finalization

on:
  push:
    branches:
      - real-wargame-preview
    paths:
      - .github/workflows/tmp-polygon-v82-reconstruct.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      JOURNAL_ENTRY_B64: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify and accept exact Laboratory v1 artifact
        shell: bash
        run: |
          set -euo pipefail
          wrong='docs/subprojects/polygon-prototype/prototypes/laboratory-v1/polygon-laboratory-v1.html.html'
          right='docs/subprojects/polygon-prototype/prototypes/laboratory-v1/polygon-laboratory-v1.html'
          test -f "$wrong"
          test ! -e "$right"
          test "$(stat -c %s "$wrong")" = '2090476'
          test "$(sha256sum "$wrong" | awk '{print $1}')" = '29e1d493fd3c4ef7633ad3850bf71ec94e3403d6a5ccb2a0658ca958d0765c02'
          mv "$wrong" "$right"
          test "$(stat -c %s "$right")" = '2090476'
          test "$(sha256sum "$right" | awk '{print $1}')" = '29e1d493fd3c4ef7633ad3850bf71ec94e3403d6a5ccb2a0658ca958d0765c02'
          python -c "import os,base64; from pathlib import Path; p=Path('docs/subprojects/polygon-prototype/JOURNAL.md'); t=p.read_text(encoding='utf-8'); h='## 2026-08-14 — принята Лаборатория v1'; e=base64.b64decode(os.environ['JOURNAL_ENTRY_B64']).decode('utf-8'); p.write_text(t if h in t else t.rstrip()+'\\n\\n'+e, encoding='utf-8')"
          git add -A docs/subprojects/polygon-prototype/JOURNAL.md docs/subprojects/polygon-prototype/prototypes/laboratory-v1
          git commit -m "prototype: accept Laboratory v1 exact artifact"
          git push origin HEAD:real-wargame-preview
          echo "VERIFIED_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Sync and verify agent documentation
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json,os; from pathlib import Path; p=Path('docs/subprojects/polygon-prototype/subproject.json'); d=json.loads(p.read_text(encoding='utf-8')); d['last_verified_commit']=os.environ['VERIFIED_SHA']; p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')"
          npm run docs:sync
          npm run docs:check
          git status --short
          git add docs
          if git diff --cached --quiet; then
            echo 'No documentation changes to commit.'
          else
            git commit -m "docs: sync Polygon state for Laboratory v1"
            git push origin HEAD:real-wargame-preview
          fi

      - name: Final verification
        shell: bash
        run: |
          set -euo pipefail
          file='docs/subprojects/polygon-prototype/prototypes/laboratory-v1/polygon-laboratory-v1.html'
          test -f "$file"
          test ! -e "${file}.html"
          test "$(stat -c %s "$file")" = '2090476'
          test "$(sha256sum "$file" | awk '{print $1}')" = '29e1d493fd3c4ef7633ad3850bf71ec94e3403d6a5ccb2a0658ca958d0765c02'
          grep -Fq '## 2026-08-14 — принята Лаборатория v1' docs/subprojects/polygon-prototype/JOURNAL.md
          grep -Fq 'Laboratory v1' docs/subprojects/polygon-prototype/STATUS.md
          grep -Fq "$VERIFIED_SHA" docs/subprojects/polygon-prototype/subproject.json
          npm run docs:check
          echo "VERIFIED_SHA=$VERIFIED_SHA"
          echo "WORKFLOW_HEAD=$(git rev-parse HEAD)"
