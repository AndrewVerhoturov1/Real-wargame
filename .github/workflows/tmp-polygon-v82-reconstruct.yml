name: Temporary Polygon v8.2 reconstruction

on:
  push:
    branches:
      - real-wargame-preview
    paths:
      - .github/workflows/tmp-polygon-v82-reconstruct.yml

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover repository Program payload
        shell: python
        run: |
          import base64, hashlib, re, zlib
          from pathlib import Path

          root = Path('docs/subprojects/infantry-combat-prototype-v1/prototypes/polygon-program-logic-editor/payload')
          chunks = []
          for path in sorted(root.glob('part-*.js')):
              text = path.read_text(encoding='utf-8')
              match = re.search(r'push\("([A-Za-z0-9+/=]+)"\)', text)
              if not match:
                  raise SystemExit(f'payload chunk not found in {path}')
              chunks.append(match.group(1))
          packed = base64.b64decode(''.join(chunks), validate=True)
          if packed[:2] != b'\x1f\x8b':
              raise SystemExit('not gzip')
          data = zlib.decompress(packed[10:-8], -15)
          packed_sha = hashlib.sha256(packed).hexdigest()
          sha = hashlib.sha256(data).hexdigest()
          out = Path('/tmp/polygon-program-payload.html')
          out.write_bytes(data)
          print(f'PAYLOAD {len(packed)} bytes SHA-256 {packed_sha}')
          print(f'HTML {len(data)} bytes SHA-256 {sha}')
      - uses: actions/upload-artifact@v4
        with:
          name: polygon-program-payload
          path: /tmp/polygon-program-payload.html
          if-no-files-found: error
          retention-days: 1
