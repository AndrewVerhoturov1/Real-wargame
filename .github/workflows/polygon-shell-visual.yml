name: Polygon Shell External Preview Visual QA

on:
  pull_request:
    branches:
      - ci/polygon-shell-visual-base-20260815t221700z-0fa822c

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://repo-lil75k9mn-111s-projects-807221af.vercel.app/combat-lab.html
      EXPECTED_PRODUCT_SHA: 0fa822ce1a22cc7ff3b9d3691f4ea76c62be092e
      CANONICAL_FEATURE_BRANCH: feature/20260815-polygon-arka-shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deployed Polygon shell scenario
        run: npx playwright test --config=ci/playwright.polygon-shell-visual.config.ts

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polygon-shell-visual-evidence-${{ github.run_id }}
          path: |
            artifacts/vercel-e2e/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
