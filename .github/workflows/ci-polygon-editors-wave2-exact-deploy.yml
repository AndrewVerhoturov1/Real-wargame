name: Polygon Editors Final Exact Deploy

on:
  push:
    branches:
      - ci/polygon-editors-wave2-deploy-push-20260818t0034z-2c2a2d5

permissions:
  contents: read

jobs:
  exact-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SHA: f695c9b1c035340de319e769b2ada4c993d2b83b
      EXPECTED_REF: feat/20260817-polygon-editors-visual-parity
      EXPECTED_VERCEL_PROJECT_NAME: repo
    steps:
      - name: Checkout workflow branch
        uses: actions/checkout@v4

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: f695c9b1c035340de319e769b2ada4c993d2b83b
          fetch-depth: 0
          path: product

      - name: Verify exact product source
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Product SHA: $actual_sha"
          test "$actual_sha" = "$EXPECTED_SHA"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install exact dependencies
        working-directory: product
        run: npm ci --no-audit --no-fund

      - name: Run Preview verification gate
        working-directory: product
        run: npm run verify:preview -- --report "$RUNNER_TEMP/preview-verification.json"

      - name: Pull permanent Vercel project settings
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify permanent Vercel project link
        working-directory: product
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          node scripts/verify_vercel_project_link.mjs
          --file .vercel/project.json
          --expected-org-id "$VERCEL_ORG_ID"
          --expected-project-id "$VERCEL_PROJECT_ID"
          --expected-project-name "$EXPECTED_VERCEL_PROJECT_NAME"

      - name: Build exact Preview output
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REAL_WARGAME_BRANCH: feat/20260817-polygon-editors-visual-parity
          REAL_WARGAME_COMMIT_SHA: f695c9b1c035340de319e769b2ada4c993d2b83b
        run: npx --yes vercel@56.4.1 build --token="$VERCEL_TOKEN"

      - name: Add exact deployment identity
        working-directory: product
        run: >-
          node scripts/write_deployment_source.mjs
          --root .vercel/output/static
          --ref "$EXPECTED_REF"
          --sha "$EXPECTED_SHA"
          --report "$RUNNER_TEMP/preview-verification.json"

      - name: Verify prebuilt output pages
        working-directory: product
        run: npm run verify:deployment-pages -- --root .vercel/output/static --require-source

      - name: Publish one prebuilt Preview
        id: deploy
        working-directory: product
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@56.4.1 deploy --prebuilt --yes --token="$VERCEL_TOKEN" | tail -n 1 | tr -d '\r')"
          [[ "$deployment_url" =~ ^https://[^[:space:]]+$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $deployment_url"

      - name: Wait for READY and inspect
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@56.4.1 inspect "${{ steps.deploy.outputs.url }}" --wait --token="$VERCEL_TOKEN"

      - name: Verify published pages and exact identity
        working-directory: product
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          deployment="${{ steps.deploy.outputs.url }}"
          npx --yes vercel@56.4.1 curl / --deployment "$deployment" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /ai-node-editor.html --deployment "$deployment" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /combat-lab.html --deployment "$deployment" --token="$VERCEL_TOKEN" > /dev/null
          identity="$RUNNER_TEMP/deployment-source.json"
          npx --yes vercel@56.4.1 curl /deployment-source.json --deployment "$deployment" --token="$VERCEL_TOKEN" > "$identity"
          SOURCE_FILE="$identity" node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8'));
          if (source.sourceSha !== process.env.EXPECTED_SHA) throw new Error(`SHA mismatch: ${source.sourceSha}`);
          if (source.ref !== process.env.EXPECTED_REF) throw new Error(`ref mismatch: ${source.ref}`);
          if (source.verificationStatus !== 'passed') throw new Error(`verification status: ${source.verificationStatus}`);
          if ((source.skippedChecks ?? []).length !== 0) throw new Error('Preview verification contains skipped checks.');
          console.log(`Verified deployment source: ${source.ref} @ ${source.sourceSha}`);
          NODE
