name: Temporary Shared Game Editors Compiler Gate

on:
  push:
    branches:
      - compiler/20260731-shared-game-editors-integration

permissions:
  contents: write

concurrency:
  group: tmp-shared-game-editors-compiler
  cancel-in-progress: false

jobs:
  worker3-focused:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci(report):') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run worker 3 focused checks and publish report
        shell: bash
        run: |
          set +e
          report="reports/.tmp-shared-game-editors-worker3-focused.txt"
          mkdir -p reports
          : > "$report"
          overall=0
          run_check() {
            name="$1"
            shift
            printf '\n===== %s =====\n' "$name" | tee -a "$report"
            "$@" >> "$report" 2>&1
            code=$?
            printf '\nexit_code=%s\n' "$code" | tee -a "$report"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }
          printf 'source_sha=%s\n' "$GITHUB_SHA" | tee -a "$report"
          printf 'branch=%s\n' "$GITHUB_REF_NAME" | tee -a "$report"
          run_check "npm ci" npm ci --no-audit --no-fund
          run_check "typecheck" npm run typecheck
          run_check "gameplay tuning editor contracts" node scripts/gameplay_tuning_editors_smoke.mjs
          run_check "gameplay tuning runtime behavior" node scripts/gameplay_tuning_profiles_behavior_smoke.mjs
          run_check "perception smoke" npm run perception:smoke
          run_check "perception performance smoke" npm run perception-performance:smoke
          run_check "attention profiles smoke" npm run attention-profiles:smoke
          run_check "combat foundation smoke" npm run combat-foundation:smoke
          run_check "stage 6 verify" npm run infantry-combat-stage6:verify
          run_check "stage 7 verify" npm run infantry-combat-stage7:verify
          run_check "stage 8 verify" npm run infantry-combat-stage8:verify
          run_check "stage 9 verify" npm run infantry-combat-stage9:verify
          run_check "shared game editors smoke" npm run shared-game-editors:smoke
          run_check "editor smoke" npm run editor:smoke
          run_check "workspace architecture" npm run workspace-architecture-contract:smoke
          run_check "performance contract" npm run performance-contract:smoke
          run_check "build" npm run build
          printf '\noverall_exit_code=%s\n' "$overall" | tee -a "$report"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          git commit -m "ci(report): record worker3 focused gate" || true
          git push origin HEAD:compiler/20260731-shared-game-editors-integration
          exit "$overall"
