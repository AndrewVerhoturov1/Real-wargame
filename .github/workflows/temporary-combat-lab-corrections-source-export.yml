name: Temporary Combat Lab Corrections Source Export

on:
  pull_request:
    branches:
      - real-wargame-preview

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Record exact source
        run: |
          git rev-parse HEAD > SOURCE_SHA.txt
          printf '%s\n' '${{ github.event.pull_request.head.ref }}' > SOURCE_BRANCH.txt

      - name: Archive repository with git metadata
        run: tar --exclude='./node_modules' --exclude='./dist' -czf /tmp/real-wargame-source.tgz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-corrections-source-${{ github.event.pull_request.head.sha }}
          path: /tmp/real-wargame-source.tgz
          if-no-files-found: error
          retention-days: 1
