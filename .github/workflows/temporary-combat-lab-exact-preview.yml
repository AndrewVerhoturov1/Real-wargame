name: Temporary Combat Lab Exact Preview

on:
  pull_request:
    branches:
      - ci/combat-lab-deploy-base-20260727t040500z-529ff29

permissions:
  contents: read

concurrency:
  group: temporary-combat-lab-exact-preview-529ff29c2d63d2f503c10e34ef5b1ed7af3f2246
  cancel-in-progress: false

jobs:
  exact-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REF: feature/20260726-shooting-stage-09v-combat-lab
      SOURCE_SHA: 529ff29c2d63d2f503c10e34ef5b1ed7af3f2246
      EXPECTED_VERCEL_PROJECT_NAME: repo
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: 529ff29c2d63d2f503c10e34ef5b1ed7af3f2246
          fetch-depth: 0

      - name: Verify exact product source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$SOURCE_SHA"
          test -z "$(git status --short)"
          echo "Verified product source: $SOURCE_REF @ $actual_sha"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical Preview gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/exact-preview
          npm run verify:preview -- --report artifacts/exact-preview/preview-verification.json

      - name: Pull permanent Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify permanent Vercel project link
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          node scripts/verify_vercel_project_link.mjs
          --file .vercel/project.json
          --expected-org-id "$VERCEL_ORG_ID"
          --expected-project-id "$VERCEL_PROJECT_ID"
          --expected-project-name "$EXPECTED_VERCEL_PROJECT_NAME"

      - name: Build exact Vercel output
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REAL_WARGAME_BRANCH: ${{ env.SOURCE_REF }}
          REAL_WARGAME_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: npx --yes vercel@56.4.1 build --token="$VERCEL_TOKEN"

      - name: Add exact deployment identity
        run: >-
          node scripts/write_deployment_source.mjs
          --root .vercel/output/static
          --ref "$SOURCE_REF"
          --sha "$SOURCE_SHA"
          --report artifacts/exact-preview/preview-verification.json

      - name: Verify prebuilt pages
        run: npm run verify:deployment-pages -- --root .vercel/output/static --require-source

      - name: Publish one prebuilt Preview
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@56.4.1 deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          [[ "$deployment_url" =~ ^https://[^[:space:]]+$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Wait for READY
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.4.1 inspect "${{ steps.deploy.outputs.url }}" --wait --token="$VERCEL_TOKEN"

      - name: Verify published pages and identity
        id: published
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@56.4.1 curl / --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /ai-node-editor.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /combat-lab.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /deployment-source.json --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > artifacts/exact-preview/deployment-source.json
          node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync('artifacts/exact-preview/deployment-source.json', 'utf8'));
          if (source.ref !== process.env.SOURCE_REF || source.sourceSha !== process.env.SOURCE_SHA) {
            throw new Error(`Deployment identity mismatch: ${source.ref} @ ${source.sourceSha}`);
          }
          fs.writeFileSync('artifacts/exact-preview/deployment.json', JSON.stringify({
            url: process.env.DEPLOYMENT_URL,
            ref: source.ref,
            sourceSha: source.sourceSha,
            verificationStatus: source.verification?.status ?? null,
          }, null, 2));
          NODE

      - name: Upload exact Preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-exact-preview-${{ github.run_id }}
          path: artifacts/exact-preview/**
          if-no-files-found: warn
          retention-days: 14
