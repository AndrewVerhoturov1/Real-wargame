name: Temporary Combat Lab Feature Correction

on:
  pull_request:
    branches:
      - ci/combat-lab-deploy-base-20260727t040500z-529ff29

permissions:
  contents: write

concurrency:
  group: temporary-combat-lab-feature-correction-1c180179
  cancel-in-progress: false

jobs:
  patch-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEATURE_BRANCH: feature/20260726-shooting-stage-09v-combat-lab
      EXPECTED_SHA: 1c180179ff32a0921f9e7f0b9eede38ab05e8cfb
    steps:
      - name: Checkout exact feature candidate
        uses: actions/checkout@v4
        with:
          ref: 1c180179ff32a0921f9e7f0b9eede38ab05e8cfb
          fetch-depth: 0

      - name: Verify branch did not move
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Implement shared speed display synchronization
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/combat-lab/ui/CombatLabShell.ts')
          text = path.read_text()

          old = "  private readonly seed = numberInput(1, 4_294_967_295, 1);\n  private readonly shooter = select();"
          new = "  private readonly seed = numberInput(1, 4_294_967_295, 1);\n  private readonly speed = select();\n  private readonly shooter = select();"
          if old not in text:
              raise SystemExit('speed field insertion point not found')
          text = text.replace(old, new, 1)

          old = "    this.pause.textContent = snapshot.paused ? 'Продолжить' : 'Пауза';\n    this.program.classList.toggle('active', snapshot.programEnabled);"
          new = "    this.pause.textContent = snapshot.paused ? 'Продолжить' : 'Пауза';\n    this.speed.value = String(snapshot.speed);\n    this.program.classList.toggle('active', snapshot.programEnabled);"
          if old not in text:
              raise SystemExit('speed synchronization point not found')
          text = text.replace(old, new, 1)

          old = "    const speed = select();\n    for (const value of COMBAT_LAB_VISUAL_SPEEDS) speed.append(option(String(value), `×${value}`));\n    speed.value = '1';\n    speed.addEventListener('change', () => {\n      this.session.setSpeed(Number(speed.value));"
          new = "    for (const value of COMBAT_LAB_VISUAL_SPEEDS) this.speed.append(option(String(value), `×${value}`));\n    this.speed.value = String(this.session.getSnapshot().speed);\n    this.speed.addEventListener('change', () => {\n      this.session.setSpeed(Number(this.speed.value));"
          if old not in text:
              raise SystemExit('speed control block not found')
          text = text.replace(old, new, 1)

          old = "      inlineField('Скорость', speed),"
          new = "      inlineField('Скорость', this.speed),"
          if old not in text:
              raise SystemExit('speed field mount not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify correction
        run: |
          node scripts/combat_lab_ui_contract_smoke.mjs
          node scripts/combat_lab_workspace_layout_smoke.mjs
          npx tsc --noEmit

      - name: Commit and push guarded correction
        shell: bash
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_SHA"
          git config user.name "Real Wargame CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/combat-lab/ui/CombatLabShell.ts
          git commit -m "fix: synchronize Combat Lab speed controls"
          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"
