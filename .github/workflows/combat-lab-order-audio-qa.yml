name: Combat Lab Order Audio QA

on:
  pull_request:
    branches:
      - ci/combat-lab-order-audio-base-20260727t0800z-6a20a57
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCT_BRANCH: feature/20260726-shooting-stage-09v-combat-lab
      PRODUCT_SHA: 6a20a57c10a1362e39e9f1d73b18a0cd6f337a35
      EVIDENCE_DIR: artifacts/combat-lab-order-audio
    steps:
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
          fetch-depth: 0

      - name: Prove exact feature source
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          branch_sha="$(git ls-remote origin "refs/heads/$PRODUCT_BRANCH" | awk '{print $1}')"
          test "$actual_sha" = "$PRODUCT_SHA"
          test "$branch_sha" = "$PRODUCT_SHA"
          test -z "$(git status --short)"
          echo "Verified product source: $PRODUCT_BRANCH @ $PRODUCT_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run focused contracts
        run: |
          node scripts/combat_lab_full_game_contract_smoke.mjs
          npm run combat-lab-scenarios:smoke

      - name: Run canonical Preview gate
        run: npm run verify:preview -- --report "$RUNNER_TEMP/preview-verification.json"

      - name: Build production dist
        run: npm run build

      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Chromium QA at 1440x900
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          npm run preview -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/vite-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/combat-lab.html > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/combat-lab.html > /dev/null
          cat > .combat-lab-order-audio-qa.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const out = process.env.EVIDENCE_DIR;
          fs.mkdirSync(out, { recursive: true });
          const browser = await chromium.launch({
            headless: true,
            args: ['--use-gl=swiftshader', '--ignore-gpu-blocklist', '--autoplay-policy=no-user-gesture-required'],
          });
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          await context.addInitScript(() => {
            window.__combatAudioProbe = { resumes: 0, oscillatorStarts: 0 };
            const AudioContextConstructor = window.AudioContext ?? window.webkitAudioContext;
            if (!AudioContextConstructor) return;
            const originalResume = AudioContextConstructor.prototype.resume;
            AudioContextConstructor.prototype.resume = function (...args) {
              window.__combatAudioProbe.resumes += 1;
              return originalResume.apply(this, args);
            };
            const originalCreateOscillator = AudioContextConstructor.prototype.createOscillator;
            AudioContextConstructor.prototype.createOscillator = function (...args) {
              const oscillator = originalCreateOscillator.apply(this, args);
              const originalStart = oscillator.start.bind(oscillator);
              oscillator.start = (...startArgs) => {
                window.__combatAudioProbe.oscillatorStarts += 1;
                return originalStart(...startArgs);
              };
              return oscillator;
            };
          });
          const page = await context.newPage();
          const pageErrors = [];
          page.on('pageerror', (error) => pageErrors.push(`pageerror: ${error.message}`));
          page.on('console', (message) => {
            if (message.type() === 'error') pageErrors.push(`console: ${message.text()}`);
          });

          function check(condition, message) {
            if (!condition) throw new Error(message);
          }

          await page.goto('http://127.0.0.1:4173/combat-lab.html', { waitUntil: 'networkidle' });
          await page.waitForSelector('#combat-lab-extension-root[data-combat-lab-extension="active"]');
          await page.waitForSelector('#app canvas');
          await page.waitForSelector('.simulation-unit-bar');
          await page.waitForTimeout(500);

          check(await page.locator('.tactical-order-card').count() === 0, 'Tactical order card exists before command.');
          const labToggle = page.locator('.combat-lab-dock-toggle');
          const rightToggle = page.locator('.simulation-sidebar [data-action="collapse"]');
          check(await labToggle.count() === 1, 'Combat Lab collapse control is missing.');
          check(await rightToggle.count() === 1, 'Game inspector collapse control is missing.');
          await labToggle.click();
          await rightToggle.click();
          await page.waitForTimeout(500);

          const labels = {};
          for (const name of ['Мишень 25 м', 'Мишень 50 м', 'Мишень 100 м', 'Мишень 200 м']) {
            const label = page.locator('.unit-label', { hasText: name }).first();
            check(await label.count() === 1, `Missing target label: ${name}`);
            labels[name] = await label.boundingBox();
          }
          const targetY = Object.values(labels).map((box) => Math.round(box.y));
          check(new Set(targetY).size >= 3, `Targets still appear on one firing line: ${JSON.stringify(targetY)}`);
          await page.screenshot({ path: `${out}/00-target-layout.png`, fullPage: false });

          const canvas = page.locator('#app canvas');
          const box = await canvas.boundingBox();
          check(box, 'Game canvas has no bounding box.');
          await page.mouse.click(box.x + box.width * 0.55, box.y + box.height * 0.58, { button: 'right' });
          await page.waitForTimeout(600);
          check(await page.locator('.tactical-order-card').count() === 0, 'Tactical order card appeared after command.');
          await page.screenshot({ path: `${out}/01-after-order.png`, fullPage: false });

          await labToggle.click();
          await page.waitForTimeout(300);
          const openFire = page.getByRole('button', { name: 'Открыть огонь', exact: true });
          check(await openFire.count() === 1, 'Combat Lab fire control is missing.');
          await openFire.click();
          const speed4 = page.locator('.unit-bar-speed-group [data-speed="4"]');
          if (await speed4.count()) await speed4.click();
          const pause = page.locator('.simulation-controls [data-action="pause"]');
          check(await pause.count() === 1, 'Shared pause control is missing.');
          if (/Продолжить/i.test(await pause.innerText())) await pause.click();
          await page.waitForTimeout(5000);
          if (/Пауза/i.test(await pause.innerText())) await pause.click();
          await page.locator('[data-combat-lab-tab="log"]').click();
          const journalText = await page.locator('[data-combat-lab-tab-panel="log"]').innerText();
          check(/Выстрел/i.test(journalText), `New fire task did not produce a shot. Journal: ${journalText}`);
          const audioProbe = await page.evaluate(() => window.__combatAudioProbe);
          check(audioProbe.oscillatorStarts >= 1, `Shot sound oscillator was not started: ${JSON.stringify(audioProbe)}`);
          check(await page.locator('.tactical-order-card').count() === 0, 'Tactical order card returned after firing.');
          await page.screenshot({ path: `${out}/02-fire-journal.png`, fullPage: false });

          const layout = await page.evaluate(() => ({
            scrollWidth: document.documentElement.scrollWidth,
            clientWidth: document.documentElement.clientWidth,
            canvasCount: document.querySelectorAll('#app canvas').length,
          }));
          check(layout.scrollWidth <= layout.clientWidth, `Horizontal overflow ${layout.scrollWidth}/${layout.clientWidth}`);
          check(layout.canvasCount === 1, `Expected one game canvas, got ${layout.canvasCount}`);
          check(pageErrors.length === 0, `Browser errors detected:\n${pageErrors.join('\n')}`);
          fs.writeFileSync(`${out}/evidence.json`, JSON.stringify({
            productSha: process.env.PRODUCT_SHA,
            labels,
            targetY,
            audioProbe,
            layout,
            pageErrors,
          }, null, 2));
          await browser.close();
          NODE
          PRODUCT_SHA="$PRODUCT_SHA" EVIDENCE_DIR="$EVIDENCE_DIR" node .combat-lab-order-audio-qa.mjs 2>&1 | tee "$EVIDENCE_DIR/browser.log"

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-order-audio-qa-${{ github.run_id }}
          path: |
            artifacts/combat-lab-order-audio/**
            ${{ runner.temp }}/preview-verification.json
            ${{ runner.temp }}/vite-preview.log
          if-no-files-found: warn
          retention-days: 14
