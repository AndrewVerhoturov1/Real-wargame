name: Exact Combat Lab Verification and Deployment

on:
  pull_request:
    branches:
      - feature/20260726-shooting-stage-09v-combat-lab
    paths:
      - .github/workflows/exact-combat-lab-verify-deploy.yml

permissions:
  contents: read

jobs:
  verify-and-deploy:
    name: Verify and deploy exact Combat Lab SHA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXACT_REF: feature/20260726-shooting-stage-09v-combat-lab
      EXACT_SHA: 5f3306cf59e105997fc66513ecf3a1f0516f8a17
      EXPECTED_VERCEL_PROJECT_NAME: repo
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: 5f3306cf59e105997fc66513ecf3a1f0516f8a17
          fetch-depth: 0

      - name: Verify exact source before installation
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXACT_SHA"
          echo "Verified exact source: $EXACT_REF @ $actual_sha"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Run canonical Preview verification gate
        id: gate
        shell: bash
        run: |
          set -o pipefail
          report="$RUNNER_TEMP/preview-verification.json"
          log="$RUNNER_TEMP/preview-verification.log"
          set +e
          npm run verify:preview -- --report "$report" 2>&1 | tee "$log"
          status="${PIPESTATUS[0]}"
          set -e
          echo "report=$report" >> "$GITHUB_OUTPUT"
          echo "log=$log" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-combat-lab-gate-diagnostics
          path: |
            ${{ steps.gate.outputs.report }}
            ${{ steps.gate.outputs.log }}
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce successful verification gate
        shell: bash
        run: test "${{ steps.gate.outputs.status }}" = "0"

      - name: Pull permanent Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify permanent Vercel project link
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          node scripts/verify_vercel_project_link.mjs
          --file .vercel/project.json
          --expected-org-id "$VERCEL_ORG_ID"
          --expected-project-id "$VERCEL_PROJECT_ID"
          --expected-project-name "$EXPECTED_VERCEL_PROJECT_NAME"

      - name: Build Vercel output once
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REAL_WARGAME_BRANCH: ${{ env.EXACT_REF }}
          REAL_WARGAME_COMMIT_SHA: ${{ env.EXACT_SHA }}
        run: npx --yes vercel@56.4.1 build --token="$VERCEL_TOKEN"

      - name: Add exact deployment identity
        run: >-
          node scripts/write_deployment_source.mjs
          --root .vercel/output/static
          --ref "$EXACT_REF"
          --sha "$EXACT_SHA"
          --report "${{ steps.gate.outputs.report }}"

      - name: Verify prebuilt output pages
        run: npm run verify:deployment-pages -- --root .vercel/output/static --require-source

      - name: Publish one prebuilt Preview deployment
        id: deploy
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@56.4.1 deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          [[ "$deployment_url" =~ ^https://[^[:space:]]+$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Wait for READY and inspect deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          npx --yes vercel@56.4.1 inspect "${{ steps.deploy.outputs.url }}"
          --wait --token="$VERCEL_TOKEN"

      - name: Read deployment ID and status
        id: deployment
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          response="$RUNNER_TEMP/vercel-deployment.json"
          curl --fail --silent --show-error --get \
            --url "https://api.vercel.com/v13/deployments/$deployment_host" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --data-urlencode "teamId=$VERCEL_ORG_ID" \
            --output "$response"
          RESPONSE="$response" node <<'NODE'
          const fs = require('node:fs');
          const deployment = JSON.parse(fs.readFileSync(process.env.RESPONSE, 'utf8'));
          if (deployment.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error('Wrong Vercel project.');
          if (deployment.readyState !== 'READY') throw new Error(`Deployment is not READY: ${deployment.readyState}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `id=${deployment.id}\nstatus=${deployment.readyState}\n`);
          NODE

      - name: Verify published pages and exact identity
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          npx --yes vercel@56.4.1 curl / --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /ai-node-editor.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /combat-lab.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          source_file="$RUNNER_TEMP/published-deployment-source.json"
          npx --yes vercel@56.4.1 curl /deployment-source.json --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > "$source_file"
          SOURCE_FILE="$source_file" node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8'));
          if (source.ref !== process.env.EXACT_REF || source.sourceSha !== process.env.EXACT_SHA) {
            throw new Error('Published deployment identity does not match exact source.');
          }
          NODE

      - name: Save deployment result
        if: success()
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/exact-combat-lab-deployment-result.json" <<JSON
          {
            "ref": "$EXACT_REF",
            "sha": "$EXACT_SHA",
            "deploymentId": "${{ steps.deployment.outputs.id }}",
            "status": "${{ steps.deployment.outputs.status }}",
            "url": "${{ steps.deploy.outputs.url }}"
          }
          JSON

      - name: Upload deployment result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exact-combat-lab-deployment-result
          path: ${{ runner.temp }}/exact-combat-lab-deployment-result.json
          retention-days: 7
