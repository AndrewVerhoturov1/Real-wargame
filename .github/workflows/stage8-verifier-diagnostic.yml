name: Stage 8 Verifier Diagnostic

on:
  pull_request:
    branches:
      - real-wargame-preview
    types: [ready_for_review, reopened]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Stage 8 verifier
        id: stage8
        shell: bash
        run: |
          set +e
          npm run infantry-combat-stage8:verify 2>&1 | tee "$RUNNER_TEMP/stage8-verifier.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload complete Stage 8 log
        uses: actions/upload-artifact@v4
        with:
          name: stage8-verifier-log
          path: ${{ runner.temp }}/stage8-verifier.log
          if-no-files-found: error
          retention-days: 3

      - name: Preserve Stage 8 result
        shell: bash
        env:
          EXIT_CODE: ${{ steps.stage8.outputs.exit_code }}
        run: exit "$EXIT_CODE"
