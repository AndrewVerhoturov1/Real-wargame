name: Polygon Editors Wave 2 Visual Audit

on:
  pull_request_target:
    branches:
      - ci/polygon-editors-wave2-audit-base-20260818t0024z-2c2a2d5

permissions:
  contents: read

jobs:
  deploy-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANONICAL_FEATURE_BRANCH: feat/20260817-polygon-editors-visual-parity
      EXPECTED_PRODUCT_SHA: 2c2a2d5f0dcd3bf251622c0a47b6bdde61da2f6d
      EXPECTED_VERCEL_PROJECT_NAME: repo
    steps:
      - name: Checkout trusted CI harness
        uses: actions/checkout@v4
        with:
          ref: ci/polygon-editors-wave2-audit-base-20260818t0024z-2c2a2d5

      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: 2c2a2d5f0dcd3bf251622c0a47b6bdde61da2f6d
          fetch-depth: 0
          path: product

      - name: Verify exact product source
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Product SHA: $actual_sha"
          test "$actual_sha" = "$EXPECTED_PRODUCT_SHA"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install exact product dependencies
        working-directory: product
        run: npm ci --no-audit --no-fund

      - name: Run Preview verification gate
        working-directory: product
        run: npm run verify:preview -- --report "$RUNNER_TEMP/preview-verification.json"

      - name: Pull permanent Vercel project settings
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify permanent Vercel project link
        working-directory: product
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          node scripts/verify_vercel_project_link.mjs
          --file .vercel/project.json
          --expected-org-id "$VERCEL_ORG_ID"
          --expected-project-id "$VERCEL_PROJECT_ID"
          --expected-project-name "$EXPECTED_VERCEL_PROJECT_NAME"

      - name: Build exact Preview output
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REAL_WARGAME_BRANCH: feat/20260817-polygon-editors-visual-parity
          REAL_WARGAME_COMMIT_SHA: 2c2a2d5f0dcd3bf251622c0a47b6bdde61da2f6d
        run: npx --yes vercel@56.4.1 build --token="$VERCEL_TOKEN"

      - name: Add exact deployment identity
        working-directory: product
        run: >-
          node scripts/write_deployment_source.mjs
          --root .vercel/output/static
          --ref "feat/20260817-polygon-editors-visual-parity"
          --sha "$EXPECTED_PRODUCT_SHA"
          --report "$RUNNER_TEMP/preview-verification.json"

      - name: Verify prebuilt output pages
        working-directory: product
        run: npm run verify:deployment-pages -- --root .vercel/output/static --require-source

      - name: Publish exact Preview
        id: deploy
        working-directory: product
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@56.4.1 deploy --prebuilt --yes --token="$VERCEL_TOKEN" | tail -n 1 | tr -d '\r')"
          [[ "$deployment_url" =~ ^https://[^[:space:]]+$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "TARGET_URL=${deployment_url}/combat-lab.html" >> "$GITHUB_ENV"
          mkdir -p ../artifacts/polygon-editors-visual-audit
          printf '{"deploymentUrl":"%s","targetUrl":"%s/combat-lab.html","sourceSha":"%s","ref":"%s"}\n' \
            "$deployment_url" "$deployment_url" "$EXPECTED_PRODUCT_SHA" "$CANONICAL_FEATURE_BRANCH" \
            > ../artifacts/polygon-editors-visual-audit/deployment-info.json

      - name: Wait for READY and inspect deployment
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@56.4.1 inspect "${{ steps.deploy.outputs.url }}" --wait --token="$VERCEL_TOKEN"

      - name: Verify published exact identity
        working-directory: product
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          identity="$RUNNER_TEMP/deployment-source.json"
          npx --yes vercel@56.4.1 curl /deployment-source.json --deployment "${{ steps.deploy.outputs.url }}" --token="$VERCEL_TOKEN" > "$identity"
          SOURCE_FILE="$identity" node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8'));
          if (source.sourceSha !== process.env.EXPECTED_PRODUCT_SHA) throw new Error(`SHA mismatch: ${source.sourceSha}`);
          if (source.ref !== process.env.CANONICAL_FEATURE_BRANCH) throw new Error(`ref mismatch: ${source.ref}`);
          if (source.verificationStatus !== 'passed') throw new Error(`verification status: ${source.verificationStatus}`);
          if ((source.skippedChecks ?? []).length !== 0) throw new Error('Preview verification contains skipped checks.');
          NODE

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real deployment visual audit
        run: npx playwright test --config=ci/playwright.polygon-editors-wave2-audit.config.ts

      - name: Upload deployment and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: polygon-editors-wave2-visual-audit-${{ github.run_id }}
          path: |
            artifacts/polygon-editors-visual-audit/**
            test-results/polygon-editors-wave2-audit/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
