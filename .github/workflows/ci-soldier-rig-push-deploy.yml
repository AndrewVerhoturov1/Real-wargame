name: CI One Shot Soldier Rig Preview

on:
  push:
    branches:
      - ci/soldier-rig-push-deploy-20260809-18364bb

permissions:
  contents: read

concurrency:
  group: ci-one-shot-soldier-rig-preview-18364bb8cbd723d5c5d2c4f23594aec816fe65f5
  cancel-in-progress: false

jobs:
  exact-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_REF: feature/20260808-soldier-topdown-appearance-codex
      EXPECTED_SHA: 18364bb8cbd723d5c5d2c4f23594aec816fe65f5
      EXPECTED_VERCEL_PROJECT_NAME: repo
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: 18364bb8cbd723d5c5d2c4f23594aec816fe65f5
          fetch-depth: 0
          path: product

      - name: Verify exact source before installation
        id: source
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          branch_sha="$(git ls-remote origin "refs/heads/$TARGET_REF" | awk '{print $1}')"
          main_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          preview_sha="$(git ls-remote origin refs/heads/real-wargame-preview | awk '{print $1}')"
          test "$actual_sha" = "$EXPECTED_SHA"
          test "$branch_sha" = "$EXPECTED_SHA"
          test "$actual_sha" != "$main_sha"
          test "$actual_sha" != "$preview_sha"
          test -z "$(git status --short)"
          echo "ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "Verified source: $TARGET_REF @ $actual_sha"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: product/package-lock.json

      - name: Install exact dependencies
        working-directory: product
        run: npm ci --no-audit --no-fund

      - name: Run focused soldier rig contract
        working-directory: product
        run: node scripts/soldier_topdown_prototype_smoke.mjs

      - name: Run canonical Preview verification gate
        id: gate
        shell: bash
        working-directory: product
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/preview-verification.json"
          npm run verify:preview -- --report "$report"
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Confirm Vercel credentials are available
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"

      - name: Pull permanent Vercel project settings
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@56.4.1 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify permanent Vercel project link
        working-directory: product
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          node scripts/verify_vercel_project_link.mjs
          --file .vercel/project.json
          --expected-org-id "$VERCEL_ORG_ID"
          --expected-project-id "$VERCEL_PROJECT_ID"
          --expected-project-name "$EXPECTED_VERCEL_PROJECT_NAME"

      - name: Build Vercel output once
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          REAL_WARGAME_BRANCH: feature/20260808-soldier-topdown-appearance-codex
          REAL_WARGAME_COMMIT_SHA: 18364bb8cbd723d5c5d2c4f23594aec816fe65f5
        run: npx --yes vercel@56.4.1 build --token="$VERCEL_TOKEN"

      - name: Add exact deployment identity
        working-directory: product
        run: >-
          node scripts/write_deployment_source.mjs
          --root .vercel/output/static
          --ref "${{ steps.source.outputs.ref }}"
          --sha "${{ steps.source.outputs.sha }}"
          --report "${{ steps.gate.outputs.report }}"

      - name: Verify prebuilt output pages
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:deployment-pages -- --root .vercel/output/static --require-source
          test -f .vercel/output/static/soldier-topdown-prototype.html

      - name: Reconfirm feature HEAD immediately before publication
        working-directory: product
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin "refs/heads/$TARGET_REF" | awk '{print $1}')"
          echo "Feature HEAD immediately before publication: $latest_sha"
          test "$latest_sha" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Publish one prebuilt Preview deployment
        id: publish
        working-directory: product
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          deployment_url="$(npx --yes vercel@56.4.1 deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          deployment_url="$(printf '%s\n' "$deployment_url" | tail -n 1 | tr -d '\r')"
          [[ "$deployment_url" =~ ^https://[^[:space:]]+$ ]]
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Published Preview: $deployment_url"

      - name: Wait for READY and inspect deployment
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: >-
          npx --yes vercel@56.4.1 inspect "${{ steps.publish.outputs.url }}"
          --wait --token="$VERCEL_TOKEN"

      - name: Read deployment ID and status
        id: deployment
        shell: bash
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
        run: |
          set -euo pipefail
          deployment_host="${DEPLOYMENT_URL#https://}"
          response="$RUNNER_TEMP/vercel-deployment.json"
          curl --fail --silent --show-error --get \
            --url "https://api.vercel.com/v13/deployments/$deployment_host" \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --data-urlencode "teamId=$VERCEL_ORG_ID" \
            --output "$response"
          RESPONSE="$response" node <<'NODE'
          const fs = require('node:fs');
          const deployment = JSON.parse(fs.readFileSync(process.env.RESPONSE, 'utf8'));
          if (deployment.projectId !== process.env.VERCEL_PROJECT_ID) throw new Error('Wrong Vercel project.');
          if (deployment.readyState !== 'READY') throw new Error(`Deployment is ${deployment.readyState ?? 'unknown'}.`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `id=${deployment.id}\nstatus=${deployment.readyState}\n`);
          NODE

      - name: Verify published pages and exact identity
        shell: bash
        working-directory: product
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.publish.outputs.url }}
          EXPECTED_REF: ${{ steps.source.outputs.ref }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          npx --yes vercel@56.4.1 curl / --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /ai-node-editor.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          npx --yes vercel@56.4.1 curl /soldier-topdown-prototype.html --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > /dev/null
          source_file="$RUNNER_TEMP/published-deployment-source.json"
          npx --yes vercel@56.4.1 curl /deployment-source.json --deployment "$DEPLOYMENT_URL" --token="$VERCEL_TOKEN" > "$source_file"
          SOURCE_FILE="$source_file" node <<'NODE'
          const fs = require('node:fs');
          const source = JSON.parse(fs.readFileSync(process.env.SOURCE_FILE, 'utf8'));
          if (source.ref !== process.env.EXPECTED_REF || source.sourceSha !== process.env.EXPECTED_SHA) throw new Error('Published deployment identity mismatch.');
          if (source.verificationStatus !== 'passed') throw new Error(`Verification status is ${source.verificationStatus}`);
          if ((source.skippedChecks ?? []).length !== 0) throw new Error('Deployment contains skipped checks.');
          NODE

      - name: Save deployment result
        if: success()
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/soldier-rig-deployment-result.json" <<JSON
          {
            "ref": "${{ steps.source.outputs.ref }}",
            "sha": "${{ steps.source.outputs.sha }}",
            "deploymentId": "${{ steps.deployment.outputs.id }}",
            "status": "${{ steps.deployment.outputs.status }}",
            "url": "${{ steps.publish.outputs.url }}",
            "prototypeUrl": "${{ steps.publish.outputs.url }}/soldier-topdown-prototype.html"
          }
          JSON

      - name: Upload deployment result
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soldier-rig-deployment-result-18364bb
          path: ${{ runner.temp }}/soldier-rig-deployment-result.json
          retention-days: 14

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo '## One-shot Soldier Rig Preview'
            echo
            echo "- status: ${{ job.status }}"
            echo "- source: $TARGET_REF @ $EXPECTED_SHA"
            echo "- deployment ID: ${{ steps.deployment.outputs.id }}"
            echo "- Preview URL: ${{ steps.publish.outputs.url }}"
            echo "- prototype URL: ${{ steps.publish.outputs.url }}/soldier-topdown-prototype.html"
            echo "- Vercel status: ${{ steps.deployment.outputs.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
