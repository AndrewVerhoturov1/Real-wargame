name: Temporary exact-SHA UX audit

on:
  push:
    branches:
      - planning/20260802-unified-game-workspace-ux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify product foundation and changed paths
        shell: bash
        run: |
          set -euo pipefail
          FOUNDATION=850c6f36b503d666ecb3ba56ee05b67789677ffd
          git merge-base --is-ancestor "$FOUNDATION" HEAD
          test "$(git merge-base "$FOUNDATION" HEAD)" = "$FOUNDATION"
          CHANGED="$(git diff --name-only "$FOUNDATION"...HEAD)"
          printf '%s\n' "$CHANGED"
          if printf '%s\n' "$CHANGED" | grep -Ev '^(\.github/ux-audit/|\.github/workflows/temporary-ux-audit-850c6f3\.yml$|$)'; then
            echo 'Unexpected product file changed on audit branch.' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application and browser runner
        run: |
          npm ci
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Start exact application snapshot
        shell: bash
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/real-wargame-vite.log 2>&1 &
          echo $! > /tmp/real-wargame-vite.pid
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/combat-lab.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/real-wargame-vite.log
          exit 1

      - name: Run exhaustive interface reconnaissance
        env:
          BASE_URL: http://127.0.0.1:4173
          OUT_DIR: artifacts/ux-audit
        run: node --import .github/ux-audit/polyfill.mjs .github/ux-audit/run.mjs

      - name: Save Vite log
        if: always()
        run: |
          mkdir -p artifacts/ux-audit
          cp /tmp/real-wargame-vite.log artifacts/ux-audit/vite.log || true

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-audit-850c6f3-${{ github.run_id }}
          path: artifacts/ux-audit
          if-no-files-found: warn
          retention-days: 7
