name: ARKA Placeholder RED

on:
  pull_request:
    branches:
      - ci/arka-placeholder-red-base-20260816-fe654d0

permissions:
  contents: read

jobs:
  focused-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run focused Polygon shell contract
        run: node scripts/combat_lab_polygon_shell_contract_smoke.mjs
