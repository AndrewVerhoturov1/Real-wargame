name: Temporary Combat Lab Visual QA 2

on:
  pull_request:
    branches:
      - ci/combat-lab-visual2-base-20260727t045000z-5e8d45a

permissions:
  contents: read

concurrency:
  group: temporary-combat-lab-visual-qa-2-9f42818
  cancel-in-progress: false

jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: 9f428186869564f1e76c0aafc682c573572d2d0e
      QA_BASE_BRANCH: ci/combat-lab-visual2-base-20260727t045000z-5e8d45a
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: 9f428186869564f1e76c0aafc682c573572d2d0e
          fetch-depth: 0

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --short)"
          remote_sha="$(git ls-remote origin refs/heads/feature/20260726-shooting-stage-09v-combat-lab | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production pages
        env:
          REAL_WARGAME_BRANCH: feature/20260726-shooting-stage-09v-combat-lab
          REAL_WARGAME_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: |
          npm run build:app
          npm run verify:deployment-pages -- --root dist

      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Read temporary QA script
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$QA_BASE_BRANCH:ci/combat-lab-visual-qa.mjs" > .temporary-combat-lab-visual-qa.mjs
          test -s .temporary-combat-lab-visual-qa.mjs

      - name: Correct temporary QA timing assumptions
        shell: python
        run: |
          from pathlib import Path
          path = Path('.temporary-combat-lab-visual-qa.mjs')
          text = path.read_text()

          old_game = """  const gameRouteDetailsDisplay = await page.locator('.unit-bar-route-controls > .unit-route-details').evaluate((element) => getComputedStyle(element).display);\n  if (gameRouteDetailsDisplay !== 'none') throw new Error(`Order/route popover is visible in normal game: ${gameRouteDetailsDisplay}`);"""
          new_game = """  const gameRouteDetails = page.locator('.unit-bar-route-controls > .unit-route-details');\n  if (await gameRouteDetails.count() > 0) {\n    const gameRouteDetailsDisplay = await gameRouteDetails.evaluate((element) => getComputedStyle(element).display);\n    if (gameRouteDetailsDisplay !== 'none') throw new Error(`Order/route popover is visible in normal game: ${gameRouteDetailsDisplay}`);\n  }"""
          old_lab = """  const routeDetailsDisplay = await page.locator('.unit-bar-route-controls > .unit-route-details').evaluate((element) => getComputedStyle(element).display);\n  if (routeDetailsDisplay !== 'none') throw new Error(`Order/route popover is visible in Combat Lab: ${routeDetailsDisplay}`);"""
          new_lab = """  const routeDetails = page.locator('.unit-bar-route-controls > .unit-route-details');\n  if (await routeDetails.count() > 0) {\n    const routeDetailsDisplay = await routeDetails.evaluate((element) => getComputedStyle(element).display);\n    if (routeDetailsDisplay !== 'none') throw new Error(`Order/route popover is visible in Combat Lab: ${routeDetailsDisplay}`);\n  }"""
          old_lower_pause = """  if (afterLowerClick !== (await labPause.textContent())?.trim()) throw new Error('Pause controls diverged after lower-panel click.');"""
          new_lower_pause = """  await page.waitForFunction((expected) => {\n    const buttons = Array.from(document.querySelectorAll('#combat-lab-extension-root .combat-lab-run-controls button'));\n    const pause = buttons.find((button) => /^(Пауза|Продолжить)$/.test(button.textContent?.trim() ?? ''));\n    return pause?.textContent?.trim() === expected;\n  }, afterLowerClick);"""
          old_lab_pause = """  if (restored !== (await labPause.textContent())?.trim()) throw new Error('Pause controls diverged after laboratory click.');"""
          new_lab_pause = """  await page.waitForFunction((expected) => {\n    const buttons = Array.from(document.querySelectorAll('#combat-lab-extension-root .combat-lab-run-controls button'));\n    const pause = buttons.find((button) => /^(Пауза|Продолжить)$/.test(button.textContent?.trim() ?? ''));\n    return pause?.textContent?.trim() === expected;\n  }, restored);"""

          replacements = [
              (old_game, new_game),
              (old_lab, new_lab),
              (old_lower_pause, new_lower_pause),
              (old_lab_pause, new_lab_pause),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Temporary QA assertion not found: {old[:100]}')
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Run real Chromium QA at 1440x900
        run: node .temporary-combat-lab-visual-qa.mjs

      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-visual-qa-${{ github.run_id }}
          path: artifacts/combat-lab-visual/**
          if-no-files-found: error
          retention-days: 14
