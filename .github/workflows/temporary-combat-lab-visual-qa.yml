name: Temporary Combat Lab Visual QA 2

on:
  pull_request:
    branches:
      - ci/combat-lab-visual2-base-20260727t045000z-5e8d45a

permissions:
  contents: read

concurrency:
  group: temporary-combat-lab-visual-qa-2-5e8d45a
  cancel-in-progress: false

jobs:
  chromium-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: 5e8d45ae32c27a2c4c23e9627904e4c1c7dd1bcb
      QA_BASE_BRANCH: ci/combat-lab-visual2-base-20260727t045000z-5e8d45a
    steps:
      - name: Checkout exact product SHA
        uses: actions/checkout@v4
        with:
          ref: 5e8d45ae32c27a2c4c23e9627904e4c1c7dd1bcb
          fetch-depth: 0

      - name: Verify exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --short)"
          remote_sha="$(git ls-remote origin refs/heads/feature/20260726-shooting-stage-09v-combat-lab | cut -f1)"
          test "$remote_sha" = "$SOURCE_SHA"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Build production pages
        env:
          REAL_WARGAME_BRANCH: feature/20260726-shooting-stage-09v-combat-lab
          REAL_WARGAME_COMMIT_SHA: ${{ env.SOURCE_SHA }}
        run: |
          npm run build:app
          npm run verify:deployment-pages -- --root dist

      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Read temporary QA script
        shell: bash
        run: |
          set -euo pipefail
          git show "origin/$QA_BASE_BRANCH:ci/combat-lab-visual-qa.mjs" > "$RUNNER_TEMP/combat-lab-visual-qa.mjs"
          test -s "$RUNNER_TEMP/combat-lab-visual-qa.mjs"

      - name: Run real Chromium QA at 1440x900
        run: node "$RUNNER_TEMP/combat-lab-visual-qa.mjs"

      - name: Upload Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-visual-qa-${{ github.run_id }}
          path: artifacts/combat-lab-visual/**
          if-no-files-found: error
          retention-days: 14
