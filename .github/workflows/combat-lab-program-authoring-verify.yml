name: Combat Lab Program Authoring Verify

on:
  push:
    branches:
      - worker/20260731-combat-lab-program-authoring
  pull_request:
    branches:
      - verification/20260731-combat-lab-program-authoring-base
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Foundation selection behavior
        run: node scripts/combat_lab_selection_controller_behavior_smoke.mjs
      - name: Foundation map mode behavior
        run: node scripts/combat_lab_map_tool_mode_behavior_smoke.mjs
      - name: Foundation map transaction behavior
        run: node scripts/combat_lab_map_tool_transaction_behavior_smoke.mjs
      - name: Program authoring behaviors
        run: |
          node scripts/combat_lab_program_layout_behavior_smoke.mjs
          node scripts/combat_lab_track_dialog_behavior_smoke.mjs
          node scripts/combat_lab_map_mode_behavior_smoke.mjs
          node scripts/combat_lab_marker_authoring_behavior_smoke.mjs
          node scripts/combat_lab_step_dialog_behavior_smoke.mjs
      - name: Scenario editor smoke
        run: npm run combat-lab-scenario-editor:smoke
      - name: Scenario system verify
        run: npm run combat-lab-scenario-system:verify
      - name: Typecheck
        run: npm run typecheck
      - name: Build application
        run: npm run build:app
