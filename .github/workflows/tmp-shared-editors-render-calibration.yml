name: Temporary Shared Editors Render Calibration

on:
  push:
    branches:
      - compiler/20260731-shared-game-editors-integration

permissions:
  contents: write
  actions: read

jobs:
  calibrate:
    if: contains(github.event.head_commit.message, '[shared-editors-render-calibration]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Establish exact clean calibration HEAD
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mapfile -t TEMP_FILES < <(git ls-files \
            '.github/workflows/tmp-shared-editors-*.yml' \
            'reports/.tmp-shared-editors-*' \
            'reports/compiler-final/*')
          if [ "${#TEMP_FILES[@]}" -gt 0 ]; then
            git rm -f -- "${TEMP_FILES[@]}"
            git commit -m "chore(integration): remove render calibration scaffolding"
            git push origin HEAD:compiler/20260731-shared-game-editors-integration
          fi
          test -z "$(git status --short)"
          TESTED_HEAD=$(git rev-parse HEAD)
          REMOTE_HEAD=$(git ls-remote origin refs/heads/compiler/20260731-shared-game-editors-integration | cut -f1)
          test "$REMOTE_HEAD" = "$TESTED_HEAD"
          git diff --quiet 5150b729afe03d2843e866acf5f7ae8570dd950b "$TESTED_HEAD" -- \
            src scripts package.json package-lock.json public '*.html' '*.css'
          echo "TESTED_HEAD=$TESTED_HEAD" >> "$GITHUB_ENV"
          OUT=/tmp/shared-editors-render-calibration
          rm -rf "$OUT"
          mkdir -p "$OUT/logs"
          printf '%s\n' "$TESTED_HEAD" > "$OUT/tested-head.txt"

      - name: Build and install Chromium
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/shared-editors-render-calibration
          npm ci --no-audit --no-fund > "$OUT/logs/npm-ci.log" 2>&1
          npm run typecheck > "$OUT/logs/typecheck.log" 2>&1
          npm run build > "$OUT/logs/build.log" 2>&1
          npm install --no-save --package-lock=false playwright@1.54.2 > "$OUT/logs/playwright-package.log" 2>&1
          npx playwright install --with-deps chromium > "$OUT/logs/playwright-browser.log" 2>&1

      - name: Calibrate rendering and collect CPU profile
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/shared-editors-render-calibration
          cat > .tmp-shared-editors-render-calibration.mjs <<'NODE'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          const out = '/tmp/shared-editors-render-calibration';
          const base = 'http://127.0.0.1:4173';
          const evidence = {
            testedHead: fs.readFileSync(`${out}/tested-head.txt`, 'utf8').trim(),
            browserVersion: null,
            samples: [],
            longAnimationFrames: [],
            windowKeys: [],
          };

          const percentile = (values, p) => {
            const sorted = [...values].sort((a, b) => a - b);
            return sorted[Math.min(sorted.length - 1, Math.ceil(sorted.length * p) - 1)] ?? 0;
          };

          const sampleFrames = async (page, name, prepare = null) => {
            if (prepare) await prepare();
            await page.waitForTimeout(500);
            const result = await page.evaluate(async ({ sampleName }) => {
              const longTasks = [];
              const longFrames = [];
              let taskObserver = null;
              let frameObserver = null;
              try {
                taskObserver = new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) {
                    longTasks.push({ startTime: entry.startTime, duration: entry.duration });
                  }
                });
                taskObserver.observe({ type: 'longtask', buffered: false });
              } catch {}
              try {
                frameObserver = new PerformanceObserver((list) => {
                  for (const entry of list.getEntries()) {
                    longFrames.push({
                      startTime: entry.startTime,
                      duration: entry.duration,
                      blockingDuration: entry.blockingDuration ?? null,
                      renderStart: entry.renderStart ?? null,
                      styleAndLayoutStart: entry.styleAndLayoutStart ?? null,
                      scripts: Array.from(entry.scripts ?? []).slice(0, 20).map((script) => ({
                        duration: script.duration,
                        pauseDuration: script.pauseDuration,
                        forcedStyleAndLayoutDuration: script.forcedStyleAndLayoutDuration,
                        sourceURL: script.sourceURL,
                        sourceFunctionName: script.sourceFunctionName,
                        invoker: script.invoker,
                        invokerType: script.invokerType,
                      })),
                    });
                  }
                });
                frameObserver.observe({ type: 'long-animation-frame', buffered: false });
              } catch {}

              const deltas = [];
              let previous = performance.now();
              await new Promise((resolve) => {
                const frame = (now) => {
                  deltas.push(now - previous);
                  previous = now;
                  if (deltas.length >= 90) resolve();
                  else requestAnimationFrame(frame);
                };
                requestAnimationFrame(frame);
              });
              taskObserver?.disconnect();
              frameObserver?.disconnect();
              return {
                name: sampleName,
                deltas,
                longTasks,
                longFrames,
                visibilityState: document.visibilityState,
                canvas: Array.from(document.querySelectorAll('canvas')).map((canvas) => ({
                  width: canvas.width,
                  height: canvas.height,
                  cssWidth: canvas.getBoundingClientRect().width,
                  cssHeight: canvas.getBoundingClientRect().height,
                  display: getComputedStyle(canvas).display,
                  visibility: getComputedStyle(canvas).visibility,
                })),
              };
            }, { sampleName: name });
            const deltas = result.deltas;
            evidence.samples.push({
              name,
              count: deltas.length,
              p50: percentile(deltas, 0.50),
              p95: percentile(deltas, 0.95),
              max: Math.max(...deltas),
              approximateFps: 1000 / Math.max(0.001, percentile(deltas, 0.50)),
              longTaskCount: result.longTasks.length,
              longTaskMax: result.longTasks.length ? Math.max(...result.longTasks.map((item) => item.duration)) : 0,
              longFrameCount: result.longFrames.length,
              visibilityState: result.visibilityState,
              canvas: result.canvas,
            });
            evidence.longAnimationFrames.push({ name, entries: result.longFrames.slice(0, 20) });
          };

          const browser = await chromium.launch({ headless: true });
          evidence.browserVersion = browser.version();
          const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
          const page = await context.newPage();
          try {
            await page.goto('about:blank');
            await sampleFrames(page, 'blank');

            await page.goto(`${base}/ai-node-editor.html`, { waitUntil: 'domcontentloaded' });
            await page.locator('[data-game-editor-surface="ai-editor"]').waitFor({ state: 'visible' });
            await sampleFrames(page, 'ai-editor-idle');

            await page.goto(`${base}/`, { waitUntil: 'domcontentloaded' });
            await page.locator('#app canvas').waitFor({ state: 'visible' });
            await sampleFrames(page, 'game-idle');

            await page.goto(`${base}/combat-lab.html`, { waitUntil: 'domcontentloaded' });
            await page.locator('.combat-lab-workspace').waitFor({ state: 'visible' });
            await sampleFrames(page, 'combat-lab-idle');
            evidence.windowKeys = await page.evaluate(() => Object.keys(window)
              .filter((key) => /(?:pixi|ticker|combat|game|render|app)/i.test(key))
              .sort());

            const client = await context.newCDPSession(page);
            await client.send('Profiler.enable');
            await client.send('Profiler.setSamplingInterval', { interval: 100 });
            await client.send('Profiler.start');
            await page.waitForTimeout(5000);
            const profile = await client.send('Profiler.stop');
            fs.writeFileSync(`${out}/combat-lab-cpu-profile.json`, JSON.stringify(profile.profile));
            await client.send('Profiler.disable');

            await sampleFrames(page, 'combat-lab-canvas-hidden', async () => {
              await page.evaluate(() => {
                const canvas = document.querySelector('#app canvas');
                if (canvas) canvas.style.visibility = 'hidden';
              });
            });

            await sampleFrames(page, 'combat-lab-canvas-1px', async () => {
              await page.evaluate(() => {
                const canvas = document.querySelector('#app canvas');
                if (!canvas) return;
                canvas.style.width = '1px';
                canvas.style.height = '1px';
              });
            });
          } finally {
            fs.writeFileSync(`${out}/calibration.json`, JSON.stringify(evidence, null, 2));
            await context.close();
            await browser.close();
          }
          NODE

          npm run preview -- --host 127.0.0.1 --port 4173 > "$OUT/logs/preview-server.log" 2>&1 &
          SERVER_PID=$!
          npm run engine:dev > "$OUT/logs/ai-engine.log" 2>&1 &
          ENGINE_PID=$!
          cleanup() {
            kill "$SERVER_PID" "$ENGINE_PID" >/dev/null 2>&1 || true
            wait "$SERVER_PID" >/dev/null 2>&1 || true
            wait "$ENGINE_PID" >/dev/null 2>&1 || true
            rm -f .tmp-shared-editors-render-calibration.mjs
          }
          trap cleanup EXIT
          READY=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null \
              && curl -fsS http://127.0.0.1:8787/engine/health >/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" -eq 1
          node .tmp-shared-editors-render-calibration.mjs > "$OUT/logs/calibration.log" 2>&1
          cat "$OUT/calibration.json"

      - name: Upload calibration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-editors-render-calibration-evidence
          path: /tmp/shared-editors-render-calibration
          if-no-files-found: error
          retention-days: 14
