name: Soldier Topdown Deployed Visual QA

on:
  pull_request:
    branches:
      - ci/soldier-topdown-visual-base-20260808t214800z-c2b338f4

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: https://repo-krsl0r6kj-111s-projects-807221af.vercel.app
      EXPECTED_PRODUCT_SHA: c2b338f4068956a78b9657a0ea2dc04e6a995e12
      CANONICAL_FEATURE_BRANCH: feature/20260808-soldier-topdown-appearance-codex
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deployed prototype visual scenario
        run: npx playwright test --config=ci/playwright.soldier-topdown-visual.config.ts

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-e2e-evidence-${{ github.run_id }}
          path: |
            artifacts/vercel-e2e/**
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
