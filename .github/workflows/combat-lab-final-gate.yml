name: Combat Lab Final Gate

# Exact-SHA gate for the completed Combat Lab feature branch.
on:
  push:
    branches:
      - feature/20260726-shooting-stage-09v-combat-lab
    paths:
      - .github/workflows/combat-lab-final-gate.yml
  pull_request:
    branches:
      - real-wargame-preview
    paths:
      - .github/workflows/combat-lab-final-gate.yml
      - combat-lab.html
      - src/combat-lab/**
      - src/rendering/PixiTacticalBoardAdapter.ts
      - src/shared/AppShellMenu.ts
      - src/ai-node-editor/main.ts
      - scripts/combat_lab_*
      - scripts/ai_test_lab_smoke.mjs
      - docs/subprojects/infantry-combat-prototype-v1/SHOOTING_STAGE_9V_COMBAT_LAB.md

permissions:
  contents: read

concurrency:
  group: combat-lab-final-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify exact Combat Lab SHA
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify documentation
        run: npm run docs:smoke

      - name: Verify laboratory platform
        run: npm run lab:smoke

      - name: Verify Combat Lab application
        run: npm run combat-lab:smoke

      - name: Verify Combat Lab scenarios
        run: npm run combat-lab-scenarios:smoke

      - name: Verify Combat Lab runner
        run: npm run combat-lab-runner:smoke

      - name: Upload runner failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-runner-failure-${{ github.sha }}
          path: combat-lab-runner-smoke-failure.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Verify infantry combat Stage 9
        run: npm run infantry-combat-stage9:verify

      - name: Typecheck
        run: npm run typecheck

      - name: Build all application pages
        env:
          REAL_WARGAME_BRANCH: feature/20260726-shooting-stage-09v-combat-lab
          REAL_WARGAME_COMMIT_SHA: ${{ github.sha }}
        run: npm run build:app

      - name: Verify deployment pages
        run: npm run verify:deployment-pages -- --root dist

      - name: Check patch whitespace
        run: git diff --check 90043f503d7615f296118abf8f11cd4a85a8df6d...HEAD

      - name: Check repository cleanliness
        run: |
          status="$(git status --short)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

      - name: Upload verified build
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3
