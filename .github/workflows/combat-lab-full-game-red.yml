name: Combat Lab Full Game RED

on:
  push:
    branches:
      - feature/20260726-shooting-stage-09v-combat-lab
    paths:
      - .github/workflows/combat-lab-full-game-red.yml
      - scripts/combat_lab_full_game_contract_smoke.mjs
      - scripts/combat_lab_scenarios_smoke.ts
      - src/game/**
      - src/main.ts
      - src/combat-lab/**
      - combat-lab.html
  pull_request:
    branches:
      - real-wargame-preview
    paths:
      - .github/workflows/combat-lab-full-game-red.yml
      - scripts/combat_lab_full_game_contract_smoke.mjs
      - scripts/combat_lab_scenarios_smoke.ts
      - src/game/**
      - src/main.ts
      - src/combat-lab/**
      - combat-lab.html

permissions:
  contents: read

jobs:
  red-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck extracted game application
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee combat-lab-full-game-typecheck.txt
      - name: Run stable-state scenario contract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run combat-lab-scenarios:smoke 2>&1 | tee combat-lab-stable-state-red.txt
      - name: Run full-game contract
        shell: bash
        run: |
          set -o pipefail
          node scripts/combat_lab_full_game_contract_smoke.mjs 2>&1 | tee combat-lab-full-game-red.txt
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-lab-full-game-diagnostics-${{ github.sha }}
          path: |
            combat-lab-full-game-red.txt
            combat-lab-full-game-typecheck.txt
            combat-lab-stable-state-red.txt
          if-no-files-found: warn
          retention-days: 1
