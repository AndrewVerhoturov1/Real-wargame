name: Temporary Source Export

on:
  push:
    branches:
      - feature/20260726-shooting-stage-09v-combat-lab

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Record exact source
        run: |
          git rev-parse HEAD > SOURCE_SHA.txt
          git branch --show-current > SOURCE_BRANCH.txt

      - name: Archive repository with git metadata
        run: tar --exclude='./node_modules' --exclude='./dist' -czf /tmp/real-wargame-source.tgz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: real-wargame-source-${{ github.sha }}
          path: /tmp/real-wargame-source.tgz
          if-no-files-found: error
          retention-days: 1
