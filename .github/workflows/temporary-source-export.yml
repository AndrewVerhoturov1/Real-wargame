name: Temporary Apply Combat Lab Accuracy

on:
  pull_request:
    branches:
      - real-wargame-preview

permissions:
  contents: write

concurrency:
  group: temporary-combat-lab-accuracy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/20260726-shooting-stage-09v-combat-lab'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout writable feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/20260726-shooting-stage-09v-combat-lab
          fetch-depth: 0
          show-progress: false

      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          prefix='.github/temporary-combat-lab-honest-accuracy.patch.part-'
          final_part="${prefix}06"
          if [[ ! -f "$final_part" ]]; then
            echo 'Implementation patch is not complete yet; nothing to do.'
            exit 0
          fi
          patch_file='/tmp/combat-lab-honest-accuracy.patch'
          cat "${prefix}"{00..06} > "$patch_file"
          git apply --check "$patch_file"
          git apply "$patch_file"
          rm -f "${prefix}"{00..06} .github/workflows/temporary-source-export.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add honest Combat Lab accuracy controls'
          git push origin HEAD:feature/20260726-shooting-stage-09v-combat-lab
